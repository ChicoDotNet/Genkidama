[package]
name = "backupforge"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Backup incremental local verificable por SHA-256 para Genkidama Learn"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.20"
