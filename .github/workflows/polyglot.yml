name: Polyglot CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: polyglot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      beam: ${{ steps.classify.outputs.beam }}
      dotnet: ${{ steps.classify.outputs.dotnet }}
      functional: ${{ steps.classify.outputs.functional }}
      jvm: ${{ steps.classify.outputs.jvm }}
      native: ${{ steps.classify.outputs.native }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify affected runtime families
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            result="$(eng/ci/detect-changes --full)"
          else
            result="$(eng/ci/detect-changes "$BASE_SHA" "$HEAD_SHA")"
          fi
          echo "$result"
          beam="$(python -c 'import json,sys; d=json.loads(sys.argv[1]); print("true" if "beam" in d["polyglot"] else "false")' "$result")"
          dotnet="$(python -c 'import json,sys; d=json.loads(sys.argv[1]); print("true" if "dotnet" in d["polyglot"] else "false")' "$result")"
          functional="$(python -c 'import json,sys; d=json.loads(sys.argv[1]); print("true" if "functional" in d["polyglot"] else "false")' "$result")"
          jvm="$(python -c 'import json,sys; d=json.loads(sys.argv[1]); print("true" if "jvm" in d["polyglot"] else "false")' "$result")"
          native="$(python -c 'import json,sys; d=json.loads(sys.argv[1]); print("true" if "native" in d["polyglot"] else "false")' "$result")"
          echo "beam=$beam" >> "$GITHUB_OUTPUT"
          echo "dotnet=$dotnet" >> "$GITHUB_OUTPUT"
          echo "functional=$functional" >> "$GITHUB_OUTPUT"
          echo "jvm=$jvm" >> "$GITHUB_OUTPUT"
          echo "native=$native" >> "$GITHUB_OUTPUT"

  dotnet-linux:
    name: .NET / Linux
    needs: detect
    if: needs.detect.outputs.dotnet == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.111'

      - name: Setup Python 3.14.7
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'

      - name: Run .NET Learn and Patterns contracts
        run: python eng/ci/run-family dotnet --all --telemetry-file artifacts/ci/dotnet-linux.jsonl

      - name: Upload .NET Linux telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-linux-ci-telemetry-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/dotnet-linux.jsonl
          if-no-files-found: warn
          retention-days: 14

  dotnet-windows:
    name: .NET / Windows
    needs: detect
    if: needs.detect.outputs.dotnet == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.111'

      - name: Setup Python 3.14.7
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'

      - name: Run .NET Windows Learn contracts
        run: python eng/ci/run-family dotnet --learn --telemetry-file artifacts/ci/dotnet-windows.jsonl

      - name: Upload .NET Windows telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-windows-ci-telemetry-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/dotnet-windows.jsonl
          if-no-files-found: warn
          retention-days: 14

  jvm-java25:
    name: JVM / Java 25
    needs: detect
    if: needs.detect.outputs.jvm == 'true'
    runs-on: ubuntu-24.04
    env:
      GENKIDAMA_JVM_PROFILE: java25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 25 LTS
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Setup Python 3.14.7
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'

      - name: Run Java 25 Learn and Patterns contracts
        run: python eng/ci/run-family jvm --all --telemetry-file artifacts/ci/jvm-java25.jsonl

      - name: Upload Java 25 telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-java25-ci-telemetry-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/jvm-java25.jsonl
          if-no-files-found: warn
          retention-days: 14

  jvm17:
    name: JVM / Kotlin + Groovy / Java 17
    needs: detect
    if: needs.detect.outputs.jvm == 'true'
    runs-on: ubuntu-24.04
    env:
      GENKIDAMA_JVM_PROFILE: jvm17

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Setup Python 3.14.7
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'

      - name: Install Groovy runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y groovy

      - name: Run JVM 17 Learn and Patterns contracts
        run: python eng/ci/run-family jvm --all --telemetry-file artifacts/ci/jvm17.jsonl

      - name: Upload JVM 17 telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm17-ci-telemetry-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/jvm17.jsonl
          if-no-files-found: warn
          retention-days: 14

  native-gnu:
    name: Native / GCC
    needs: detect
    if: needs.detect.outputs.native == 'true'
    runs-on: ubuntu-24.04
    env:
      GENKIDAMA_NATIVE_PROFILE: gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.14.7
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'

      - name: Run GCC Learn and C/C++ Patterns contracts
        run: python eng/ci/run-family native --all --telemetry-file artifacts/ci/native-gnu.jsonl

      - name: Upload GCC telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-gnu-ci-telemetry-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/native-gnu.jsonl
          if-no-files-found: warn
          retention-days: 14

  native-clang:
    name: Native / Clang
    needs: detect
    if: needs.detect.outputs.native == 'true'
    runs-on: ubuntu-24.04
    env:
      GENKIDAMA_NATIVE_PROFILE: clang

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.14.7
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'

      - name: Run Clang C/C++ Learn contracts
        run: python eng/ci/run-family native --learn --telemetry-file artifacts/ci/native-clang.jsonl

      - name: Upload Clang telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-clang-ci-telemetry-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/native-clang.jsonl
          if-no-files-found: warn
          retention-days: 14

  native-rust:
    name: Native / Rust 1.97.1
    needs: detect
    if: needs.detect.outputs.native == 'true'
    runs-on: ubuntu-24.04
    env:
      GENKIDAMA_NATIVE_PROFILE: rust

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Setup Python 3.14.7
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'

      - name: Run Rust Learn and Patterns contracts
        run: python eng/ci/run-family native --all --telemetry-file artifacts/ci/native-rust.jsonl

      - name: Upload Rust telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-rust-ci-telemetry-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/native-rust.jsonl
          if-no-files-found: warn
          retention-days: 14

  native-go:
    name: Native / Go 1.26.5
    needs: detect
    if: needs.detect.outputs.native == 'true'
    runs-on: ubuntu-24.04
    env:
      GENKIDAMA_NATIVE_PROFILE: go

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go 1.26.5
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache-dependency-path: learn/es/go/app/go.mod

      - name: Setup Python 3.14.7
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'

      - name: Run Go Learn and Pattern sweep contracts
        run: python eng/ci/run-family native --all --telemetry-file artifacts/ci/native-go.jsonl

      - name: Upload Go telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-go-ci-telemetry-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/native-go.jsonl
          if-no-files-found: warn
          retention-days: 14

  native-msvc:
    name: Native / MSVC
    needs: detect
    if: needs.detect.outputs.native == 'true'
    runs-on: windows-latest
    env:
      GENKIDAMA_NATIVE_PROFILE: msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.14.7
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'

      - name: Run MSVC C++ Learn contract
        run: python eng/ci/run-family native --learn --telemetry-file artifacts/ci/native-msvc.jsonl

      - name: Upload MSVC telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-msvc-ci-telemetry-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/native-msvc.jsonl
          if-no-files-found: warn
          retention-days: 14

  beam:
    name: BEAM / OTP 28 + Elixir 1.19
    needs: detect
    if: needs.detect.outputs.beam == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Erlang OTP 28.5.0.4 and Elixir 1.19.1
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28.5.0.4'
          elixir-version: '1.19.1'

      - name: Setup Python 3.14.7
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'

      - name: Run BEAM Pattern contracts
        run: python eng/ci/run-family beam --patterns --telemetry-file artifacts/ci/beam.jsonl

      - name: Upload BEAM telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beam-ci-telemetry-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/beam.jsonl
          if-no-files-found: warn
          retention-days: 14

  functional:
    name: Functional / OCaml + Common Lisp + Prolog
    needs: detect
    if: needs.detect.outputs.functional == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.14.7
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'

      - name: Install functional runtimes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ocaml sbcl swi-prolog-nox

      - name: Run Functional Pattern contracts
        run: python eng/ci/run-family functional --patterns --telemetry-file artifacts/ci/functional.jsonl

      - name: Upload Functional telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-ci-telemetry-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/functional.jsonl
          if-no-files-found: warn
          retention-days: 14

  gate:
    name: Polyglot CI
    if: always()
    needs:
      - detect
      - dotnet-linux
      - dotnet-windows
      - jvm-java25
      - jvm17
      - native-gnu
      - native-clang
      - native-rust
      - native-go
      - native-msvc
      - beam
      - functional
    runs-on: ubuntu-24.04

    steps:
      - name: Enforce aggregate Polyglot result
        shell: bash
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          BEAM_SELECTED: ${{ needs.detect.outputs.beam }}
          BEAM_RESULT: ${{ needs.beam.result }}
          DOTNET_SELECTED: ${{ needs.detect.outputs.dotnet }}
          DOTNET_LINUX_RESULT: ${{ needs.dotnet-linux.result }}
          DOTNET_WINDOWS_RESULT: ${{ needs.dotnet-windows.result }}
          FUNCTIONAL_SELECTED: ${{ needs.detect.outputs.functional }}
          FUNCTIONAL_RESULT: ${{ needs.functional.result }}
          JVM_SELECTED: ${{ needs.detect.outputs.jvm }}
          JVM_JAVA25_RESULT: ${{ needs.jvm-java25.result }}
          JVM17_RESULT: ${{ needs.jvm17.result }}
          NATIVE_SELECTED: ${{ needs.detect.outputs.native }}
          NATIVE_GNU_RESULT: ${{ needs.native-gnu.result }}
          NATIVE_CLANG_RESULT: ${{ needs.native-clang.result }}
          NATIVE_RUST_RESULT: ${{ needs.native-rust.result }}
          NATIVE_GO_RESULT: ${{ needs.native-go.result }}
          NATIVE_MSVC_RESULT: ${{ needs.native-msvc.result }}
        run: |
          set -euo pipefail
          if [[ "$DETECT_RESULT" != "success" ]]; then
            echo "detect-changes failed: $DETECT_RESULT" >&2
            exit 1
          fi

          if [[ "$BEAM_SELECTED" == "true" ]]; then
            if [[ "$BEAM_RESULT" != "success" ]]; then
              echo "BEAM family failed: beam=$BEAM_RESULT" >&2
              exit 1
            fi
          fi

          if [[ "$DOTNET_SELECTED" == "true" ]]; then
            if [[ "$DOTNET_LINUX_RESULT" != "success" || "$DOTNET_WINDOWS_RESULT" != "success" ]]; then
              echo ".NET family failed: linux=$DOTNET_LINUX_RESULT windows=$DOTNET_WINDOWS_RESULT" >&2
              exit 1
            fi
          fi

          if [[ "$FUNCTIONAL_SELECTED" == "true" ]]; then
            if [[ "$FUNCTIONAL_RESULT" != "success" ]]; then
              echo "Functional family failed: functional=$FUNCTIONAL_RESULT" >&2
              exit 1
            fi
          fi

          if [[ "$JVM_SELECTED" == "true" ]]; then
            if [[ "$JVM_JAVA25_RESULT" != "success" || "$JVM17_RESULT" != "success" ]]; then
              echo "JVM family failed: java25=$JVM_JAVA25_RESULT jvm17=$JVM17_RESULT" >&2
              exit 1
            fi
          fi

          if [[ "$NATIVE_SELECTED" == "true" ]]; then
            if [[ "$NATIVE_GNU_RESULT" != "success" || "$NATIVE_CLANG_RESULT" != "success" || "$NATIVE_RUST_RESULT" != "success" || "$NATIVE_GO_RESULT" != "success" || "$NATIVE_MSVC_RESULT" != "success" ]]; then
              echo "Native family failed: gnu=$NATIVE_GNU_RESULT clang=$NATIVE_CLANG_RESULT rust=$NATIVE_RUST_RESULT go=$NATIVE_GO_RESULT msvc=$NATIVE_MSVC_RESULT" >&2
              exit 1
            fi
          fi

          echo "Polyglot CI gate passed. beam=$BEAM_SELECTED dotnet=$DOTNET_SELECTED functional=$FUNCTIONAL_SELECTED jvm=$JVM_SELECTED native=$NATIVE_SELECTED"
