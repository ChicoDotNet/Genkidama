name: Pattern Flyweight Mainstream
on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/**/flyweight*'
      - 'src/**/Flyweight*'
      - 'wiki/Flyweight.md'
      - '.github/workflows/pattern-flyweight-mainstream.yml'
jobs:
  mainstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v7
        with: { python-version: '3.x' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '25' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: Install scripting, functional and data runtimes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ruby lua5.4 ghc perl fp-compiler r-base octave ocaml sbcl
      - name: Validate mainstream examples
        shell: bash
        run: |
          set -euo pipefail
          expected='styles=2;shared=true;text=ABC'
          assert_output() { test "$2" = "$expected" || { printf '%s mismatch\nexpected: %s\nactual: %s\n' "$1" "$expected" "$2" >&2; exit 1; }; }
          work="$(mktemp -d)"

          dotnet new console -n FlyweightCs -o "$work/cs" --force >/dev/null
          cp 'src/Enterprise/C#/FlyweightExample.cs' "$work/cs/Program.cs"
          assert_output C# "$(dotnet run --project "$work/cs/FlyweightCs.csproj" --configuration Release -q)"

          assert_output TypeScript "$(npx --yes tsx src/Web/TypeScriptTS/flyweight.ts)"
          assert_output Python "$(python src/Scripting/PythonPY/flyweight.py)"
          g++ -std=c++20 -Wall -Wextra -Werror 'src/Systems/C++/flyweight.cpp' -o "$work/flyweight-cpp"
          assert_output C++ "$("$work/flyweight-cpp")"
          javac src/Enterprise/Java/FlyweightExample.java
          assert_output Java "$(java -cp src/Enterprise/Java FlyweightExample)"
          rustc -D warnings src/Systems/Rust/flyweight.rs -o "$work/flyweight-rs"
          assert_output Rust "$("$work/flyweight-rs")"
          assert_output Go "$(go run src/Systems/Go/flyweight.go)"
          assert_output PHP "$(php src/Scripting/PHP/flyweight.php)"
          assert_output F# "$(dotnet fsi 'src/Functional/F#/flyweight.fsx' | tail -n 1)"
          assert_output JavaScript "$(node src/Web/JavaScriptJS/flyweight.js)"

          command -v kotlinc >/dev/null
          kotlinc src/Enterprise/Kotlin/FlyweightExample.kt -include-runtime -d "$work/flyweight-kotlin.jar"
          assert_output Kotlin "$(java -jar "$work/flyweight-kotlin.jar")"

          command -v swiftc >/dev/null
          swiftc -warnings-as-errors src/Systems/Swift/flyweight.swift -o "$work/flyweight-swift"
          assert_output Swift "$("$work/flyweight-swift")"

          dotnet new console -lang VB --framework net10.0 -n FlyweightVb -o "$work/vb" >/dev/null
          cp src/Enterprise/VB.NET/FlyweightExample.vb "$work/vb/Program.vb"
          assert_output VB.NET "$(dotnet run --project "$work/vb/FlyweightVb.vbproj" --configuration Release)"

          gcc -std=c17 -Wall -Wextra -Werror -pedantic src/Systems/C/flyweight.c -o "$work/flyweight-c"
          assert_output C "$("$work/flyweight-c")"

          ruby -cw src/Scripting/Ruby/flyweight.rb >/dev/null
          assert_output Ruby "$(ruby src/Scripting/Ruby/flyweight.rb)"

          assert_output Lua "$(lua5.4 src/Scripting/Lua/flyweight.lua)"
          bash -n src/Scripting/Bash/flyweight.sh
          assert_output Bash "$(bash src/Scripting/Bash/flyweight.sh)"
          assert_output PowerShell "$(pwsh -NoProfile -File src/Scripting/PowerShell/flyweight.ps1)"
          ghc -Wall -Werror src/Functional/Haskell/flyweight.hs -o "$work/flyweight-haskell"
          assert_output Haskell "$("$work/flyweight-haskell")"
          perl -c src/Scripting/Perl/flyweight.pl >/dev/null
          assert_output Perl "$(perl src/Scripting/Perl/flyweight.pl)"

          fpc -vw -FE"$work" -oFlyweightPascal src/Historical/Pascal/flyweight.pas >/dev/null
          assert_output Pascal "$("$work/FlyweightPascal")"
          assert_output R "$(Rscript src/DataScience/R/flyweight.R)"
          assert_output Octave "$(octave --quiet --no-gui src/DataScience/Octave/flyweight.m)"
          ocamlc -w +a-70 -warn-error +a-70 src/Functional/OCaml/flyweight.ml -o "$work/flyweight-ocaml"
          assert_output OCaml "$("$work/flyweight-ocaml")"
          assert_output CommonLisp "$(sbcl --script src/Functional/CommonLisp/flyweight.lisp)"

  data-functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: VirtusLab/scala-cli-setup@v1
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Install functional runtimes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clojure elixir erlang-base
      - name: Validate data and functional Flyweight examples
        shell: bash
        run: |
          set -euo pipefail
          expected='styles=2;shared=true;text=ABC'
          assert_output() { test "$2" = "$expected" || { printf '%s mismatch\nexpected: %s\nactual: %s\n' "$1" "$expected" "$2" >&2; exit 1; }; }
          work="$(mktemp -d)"

          scala-cli compile --scala 3 src/Functional/Scala/Flyweight.scala
          assert_output Scala "$(scala-cli run --scala 3 src/Functional/Scala/Flyweight.scala --quiet)"
          assert_output Julia "$(julia --startup-file=no src/DataScience/Julia/flyweight.jl)"
          assert_output Clojure "$(clojure src/Functional/Clojure/flyweight.clj)"
          assert_output Elixir "$(elixir src/Functional/Elixir/flyweight.exs)"
          erlc -Werror -o "$work" src/Functional/Erlang/flyweight.erl
          assert_output Erlang "$(erl -noshell -pa "$work" -s flyweight main -s init stop)"

  portable-historical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: '24' }
      - name: Install portable and historical runtimes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y swi-prolog groovy gnat gfortran
          npm install --global solc
      - name: Validate portable and historical Flyweight examples
        shell: bash
        run: |
          set -euo pipefail
          expected='styles=2;shared=true;text=ABC'
          assert_output() { test "$2" = "$expected" || { printf '%s mismatch\nexpected: %s\nactual: %s\n' "$1" "$expected" "$2" >&2; exit 1; }; }
          work="$(mktemp -d)"

          assert_output Prolog "$(swipl -q -s src/Niche/Prolog/flyweight.pl -g main -t halt)"
          assert_output Groovy "$(groovy src/Scripting/Groovy/flyweight.groovy)"

          mkdir -p "$work/ada"
          gnatmake -q -gnat2022 -gnatwa -gnatwe -D "$work/ada" -o "$work/flyweight-ada" src/Historical/Ada/flyweight.adb
          assert_output Ada "$("$work/flyweight-ada")"

          mkdir -p "$work/solidity"
          solcjs --bin --abi src/Niche/Solidity/Flyweight.sol -o "$work/solidity"
          test "$(find "$work/solidity" -maxdepth 1 -name '*FlyweightPool.bin' -size +0c | wc -l)" -eq 1
          test "$(find "$work/solidity" -maxdepth 1 -name '*FlyweightPool.abi' -size +0c | wc -l)" -eq 1

          gfortran -std=f2018 -Wall -Wextra -Werror src/Historical/Fortran/flyweight.f90 -o "$work/flyweight-fortran"
          assert_output Fortran "$("$work/flyweight-fortran" | tr -d ' ')"
