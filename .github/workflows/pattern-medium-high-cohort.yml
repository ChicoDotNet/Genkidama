name: Pattern Medium-High Cohort Sweep

on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/Functional/Scala/PatternSweep.scala'
      - 'src/Functional/Clojure/pattern_sweep.clj'
      - 'src/Enterprise/Kotlin/PatternSweep.kt'
      - 'src/Systems/Swift/pattern_sweep.swift'
      - 'src/Enterprise/C#/PatternSweep.cs'
      - 'src/Enterprise/VB.NET/PatternSweep.vb'
      - 'src/Functional/F#/pattern_sweep.fsx'
      - 'src/Niche/Solidity/PatternSweep.sol'
      - 'src/Systems/Ada/pattern_sweep.adb'
      - 'src/Systems/Pascal/pattern_sweep.pas'
      - 'src/Historical/Cobol/pattern_sweep.cbl'
      - 'src/Systems/Fortran/pattern_sweep.f90'
      - 'src/Niche/Nim/pattern_sweep.nim'
      - 'src/Web/TypeScriptTS/pattern-sweep.ts'
      - 'docs/pattern-sweeps/medium-high-cohort.md'
      - '.github/workflows/pattern-medium-high-cohort.yml'

jobs:
  jvm:
    name: JVM — Scala + Clojure + Kotlin (117 cells)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          check-latest: true
      - name: Install latest stable JVM languages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/VirtusLab/scala-cli/releases/latest/download/scala-cli-x86_64-pc-linux.gz -o /tmp/scala-cli.gz
          gzip -d /tmp/scala-cli.gz
          sudo install -m 0755 /tmp/scala-cli /usr/local/bin/scala-cli

          curl -fsSL https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh -o /tmp/clojure-install.sh
          chmod +x /tmp/clojure-install.sh
          sudo /tmp/clojure-install.sh

          kotlin_url="$(
            curl -fsSL \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              https://api.github.com/repos/JetBrains/kotlin/releases/latest |
            jq -r '.assets[] | select(.name | test("^kotlin-compiler-[0-9.]+\\.zip$")) | .browser_download_url' |
            head -n 1
          )"
          test -n "$kotlin_url"
          curl -fsSL "$kotlin_url" -o /tmp/kotlin.zip
          sudo rm -rf /opt/kotlinc
          sudo unzip -q /tmp/kotlin.zip -d /opt
          echo "/opt/kotlinc/bin" >> "$GITHUB_PATH"

          java -version
          scala-cli version
          clojure --version
          /opt/kotlinc/bin/kotlinc -version
      - run: echo "SETUP_END=$(date +%s)" >> "$GITHUB_ENV"
      - name: Validate 117 JVM cells and expose every subtarget
        shell: bash
        run: |
          set -uo pipefail
          work="$(mktemp -d)"
          failures=0

          check_target() {
            local name="$1"
            local expected="$2"
            shift 2
            local log="$work/${name}.log"
            echo "::group::$name"
            set +e
            "$@" 2>&1 | tee "$log"
            local status=${PIPESTATUS[0]}
            set -e
            local last=""
            if [ -s "$log" ]; then last="$(tail -n 1 "$log")"; fi
            if [ "$status" -ne 0 ] || [ "$last" != "$expected" ]; then
              echo "::error::$name failed (status=$status, last=$last)"
              failures=$((failures+1))
            fi
            echo "::endgroup::"
          }

          validate_scala() {
            scala-cli run src/Functional/Scala/PatternSweep.scala --server=false
          }
          validate_clojure() {
            clojure src/Functional/Clojure/pattern_sweep.clj
          }
          validate_kotlin() {
            /opt/kotlinc/bin/kotlinc src/Enterprise/Kotlin/PatternSweep.kt -include-runtime -d "$work/kotlin.jar" &&
              java -jar "$work/kotlin.jar"
          }

          check_target scala 'Scala pattern sweep: 39/39 examples passed' validate_scala
          check_target clojure 'Clojure pattern sweep: 39/39 examples passed' validate_clojure
          check_target kotlin 'Kotlin pattern sweep: 39/39 examples passed' validate_kotlin
          test "$failures" -eq 0
      - name: Timing summary
        if: always()
        shell: bash
        run: |
          now="$(date +%s)"; setup="$((SETUP_END-JOB_START))"; total="$((now-JOB_START))"; validation="$((total-setup))"
          printf '### JVM cohort\n\n- cells: 117\n- setup_seconds: %s\n- validation_seconds: %s\n- total_seconds: %s\n' "$setup" "$validation" "$total" >> "$GITHUB_STEP_SUMMARY"

  dotnet:
    name: .NET 10 LTS — C# + VB.NET + F# (117 cells)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet --info
      - run: echo "SETUP_END=$(date +%s)" >> "$GITHUB_ENV"
      - name: Validate 117 .NET cells and expose every subtarget
        shell: bash
        run: |
          set -uo pipefail
          work="$(mktemp -d)"
          failures=0

          check_target() {
            local name="$1"
            local expected="$2"
            shift 2
            local log="$work/${name}.log"
            echo "::group::$name"
            set +e
            "$@" 2>&1 | tee "$log"
            local status=${PIPESTATUS[0]}
            set -e
            local last=""
            if [ -s "$log" ]; then last="$(tail -n 1 "$log")"; fi
            if [ "$status" -ne 0 ] || [ "$last" != "$expected" ]; then
              echo "::error::$name failed (status=$status, last=$last)"
              failures=$((failures+1))
            fi
            echo "::endgroup::"
          }

          validate_csharp() {
            dotnet new console --framework net10.0 -n SweepCs -o "$work/cs" --force &&
              cp 'src/Enterprise/C#/PatternSweep.cs' "$work/cs/Program.cs" &&
              dotnet build "$work/cs/SweepCs.csproj" -c Release -warnaserror &&
              dotnet run --project "$work/cs/SweepCs.csproj" -c Release --no-build
          }
          validate_vb() {
            dotnet new console --language VB --framework net10.0 -n SweepVb -o "$work/vb" --force &&
              cp 'src/Enterprise/VB.NET/PatternSweep.vb' "$work/vb/Program.vb" &&
              dotnet build "$work/vb/SweepVb.vbproj" -c Release -warnaserror &&
              dotnet run --project "$work/vb/SweepVb.vbproj" -c Release --no-build
          }
          validate_fsharp() {
            dotnet fsi 'src/Functional/F#/pattern_sweep.fsx'
          }

          check_target csharp 'C# pattern sweep: 39/39 examples passed' validate_csharp
          check_target vbnet 'VB.NET pattern sweep: 39/39 examples passed' validate_vb
          check_target fsharp 'F# pattern sweep: 39/39 examples passed' validate_fsharp
          test "$failures" -eq 0
      - name: Timing summary
        if: always()
        shell: bash
        run: |
          now="$(date +%s)"; setup="$((SETUP_END-JOB_START))"; total="$((now-JOB_START))"; validation="$((total-setup))"
          printf '### .NET cohort\n\n- cells: 117\n- setup_seconds: %s\n- validation_seconds: %s\n- total_seconds: %s\n' "$setup" "$validation" "$total" >> "$GITHUB_STEP_SUMMARY"

  node:
    name: Node 24 LTS — TypeScript + Solidity (78 cells)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false
      - run: node --version
      - run: echo "SETUP_END=$(date +%s)" >> "$GITHUB_ENV"
      - name: Validate 78 Node-owned cells
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          npx --yes --package typescript@latest tsc --noEmit --strict --target ES2022 src/Web/TypeScriptTS/pattern-sweep.ts
          test "$(npx --yes tsx@latest src/Web/TypeScriptTS/pattern-sweep.ts | tail -n 1)" = 'TypeScript pattern sweep: 39/39 examples passed'
          npx --yes solc@latest --version
          npx --yes solc@latest --bin --abi src/Niche/Solidity/PatternSweep.sol -o "$work/solidity"
          test -n "$(find "$work/solidity" -type f -name '*PatternSweep.bin' -size +0c -print -quit)"
          grep -Fq 'function runAll() external pure returns(uint passed)' src/Niche/Solidity/PatternSweep.sol
      - name: Timing summary
        if: always()
        shell: bash
        run: |
          now="$(date +%s)"; setup="$((SETUP_END-JOB_START))"; total="$((now-JOB_START))"; validation="$((total-setup))"
          printf '### Node cohort\n\n- cells: 78\n- setup_seconds: %s\n- validation_seconds: %s\n- total_seconds: %s\n' "$setup" "$validation" "$total" >> "$GITHUB_STEP_SUMMARY"

  gnu:
    name: GNU compiled — Ada + Pascal + COBOL + Fortran (156 cells)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Install current distro-stable compiler toolchains
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gnat fp-compiler gnucobol3 gfortran
          gnatmake --version | head -n 1
          fpc -iV
          cobc --version | head -n 1
          gfortran --version | head -n 1
      - run: echo "SETUP_END=$(date +%s)" >> "$GITHUB_ENV"
      - name: Validate 156 GNU-compiled cells and expose every subtarget
        shell: bash
        run: |
          set -uo pipefail
          work="$(mktemp -d)"
          mkdir -p "$work/ada" "$work/pascal"
          failures=0

          check_target() {
            local name="$1"
            local expected="$2"
            shift 2
            local log="$work/${name}.log"
            echo "::group::$name"
            set +e
            "$@" 2>&1 | tee "$log"
            local status=${PIPESTATUS[0]}
            set -e
            local last=""
            if [ -s "$log" ]; then last="$(tail -n 1 "$log")"; fi
            if [ "$status" -ne 0 ] || [ "$last" != "$expected" ]; then
              echo "::error::$name failed (status=$status, last=$last)"
              failures=$((failures+1))
            fi
            echo "::endgroup::"
          }

          validate_ada() {
            gnatmake -q -gnat2022 -gnatwa -gnatwe -D "$work/ada" -o "$work/ada-sweep" src/Systems/Ada/pattern_sweep.adb &&
              "$work/ada-sweep"
          }
          validate_pascal() {
            fpc -O2 -S2 -vw -FE"$work/pascal" -FU"$work/pascal" src/Systems/Pascal/pattern_sweep.pas &&
              "$work/pascal/pattern_sweep"
          }
          validate_cobol() {
            cobc -free -x -Wall -Werror src/Historical/Cobol/pattern_sweep.cbl -o "$work/cobol-sweep" &&
              "$work/cobol-sweep"
          }
          validate_fortran() {
            gfortran -std=f2018 -Wall -Wextra -Werror src/Systems/Fortran/pattern_sweep.f90 -o "$work/fortran-sweep" &&
              "$work/fortran-sweep"
          }

          check_target ada 'Ada pattern sweep: 39/39 examples passed' validate_ada
          check_target pascal 'Pascal pattern sweep: 39/39 examples passed' validate_pascal
          check_target cobol 'COBOL pattern sweep: 39/39 examples passed' validate_cobol
          check_target fortran 'Fortran pattern sweep: 39/39 examples passed' validate_fortran
          test "$failures" -eq 0
      - name: Timing summary
        if: always()
        shell: bash
        run: |
          now="$(date +%s)"; setup="$((SETUP_END-JOB_START))"; total="$((now-JOB_START))"; validation="$((total-setup))"
          printf '### GNU compiled cohort\n\n- cells: 156\n- setup_seconds: %s\n- validation_seconds: %s\n- total_seconds: %s\n' "$setup" "$validation" "$total" >> "$GITHUB_STEP_SUMMARY"

  swift:
    name: Swift stable (39 cells)
    runs-on: ubuntu-latest
    container: swift:latest
    steps:
      - uses: actions/checkout@v7
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - run: swift --version
      - run: echo "SETUP_END=$(date +%s)" >> "$GITHUB_ENV"
      - name: Validate 39 Swift cells
        shell: bash
        run: |
          set -euo pipefail
          swiftc -warnings-as-errors src/Systems/Swift/pattern_sweep.swift -o /tmp/swift-sweep
          test "$(/tmp/swift-sweep | tail -n 1)" = 'Swift pattern sweep: 39/39 examples passed'
      - name: Timing summary
        if: always()
        shell: bash
        run: |
          now="$(date +%s)"; setup="$((SETUP_END-JOB_START))"; total="$((now-JOB_START))"; validation="$((total-setup))"
          printf '### Swift cohort\n\n- cells: 39\n- setup_seconds: %s\n- validation_seconds: %s\n- total_seconds: %s\n' "$setup" "$validation" "$total" >> "$GITHUB_STEP_SUMMARY"

  nim:
    name: Nim stable (39 cells)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Install latest stable Nim through official choosenim
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://nim-lang.org/choosenim/init.sh -o /tmp/choosenim.sh
          sh /tmp/choosenim.sh -y
          echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.nimble/bin:$PATH"
          choosenim stable -y
          nim --version
      - run: echo "SETUP_END=$(date +%s)" >> "$GITHUB_ENV"
      - name: Validate 39 Nim cells
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.nimble/bin:$PATH"
          nim c --hints:off --warnings:on --threads:on -d:release -o:/tmp/nim-sweep src/Niche/Nim/pattern_sweep.nim
          /tmp/nim-sweep | tee /tmp/nim-sweep.log
          test "$(tail -n 1 /tmp/nim-sweep.log)" = 'Nim pattern sweep: 39/39 examples passed'
      - name: Timing summary
        if: always()
        shell: bash
        run: |
          now="$(date +%s)"; setup="$((SETUP_END-JOB_START))"; total="$((now-JOB_START))"; validation="$((total-setup))"
          printf '### Nim cohort\n\n- cells: 39\n- setup_seconds: %s\n- validation_seconds: %s\n- total_seconds: %s\n' "$setup" "$validation" "$total" >> "$GITHUB_STEP_SUMMARY"