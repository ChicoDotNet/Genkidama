name: Pattern Composite Final

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/pattern-composite-final.yml'
      - 'src/Historical/Ada/composite.adb'
      - 'src/Niche/Solidity/Composite.sol'
      - 'src/Historical/Fortran/composite.f90'
      - 'src/Systems/Objective-C/composite.m'
      - 'src/Systems/Zig/composite.zig'
      - 'src/Niche/Nim/composite.nim'
      - 'src/Web/Dart/composite.dart'
      - 'src/Niche/Crystal/composite.cr'
      - 'src/Historical/Cobol/composite.cbl'
      - 'src/Shell/VBA/composite.bas'
      - 'src/Shell/VBA/ICompositeComponent.cls'
      - 'src/Shell/VBA/CompositeFileLeaf.cls'
      - 'src/Shell/VBA/CompositeFolder.cls'
      - 'src/Niche/GDScript/composite.gd'
      - 'src/DataScience/MATLAB/composite.m'
      - 'src/LowLevel/Assembly/composite.asm'
      - 'src/Enterprise/Delphi/CompositeExample.pas'
      - 'src/Other/MicroPython/composite.py'
      - 'src/Other/Rockstar/composite.rock'
      - 'wiki/Composite.md'

jobs:
  portable-final:
    if: github.head_ref == 'patterns/composite-kb006'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
      - name: Setup Crystal
        uses: crystal-lang/install-crystal@v1
      - name: Setup final portable runtimes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gnat gfortran nim gnucobol3 nasm
      - name: Validate Ada Composite
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          gnatmake -q -gnat2022 -gnatwa -gnatwe -D "$work" src/Historical/Ada/composite.adb -o /tmp/composite-ada
          output="$(/tmp/composite-ada)"
          grep -Fxq 'leaf=2' <<<"$output"
          grep -Fxq 'docs=8' <<<"$output"
          grep -Fxq 'root=10' <<<"$output"
      - name: Validate Solidity Composite source contract
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          npx --yes solc@0.8.30 --bin --abi src/Niche/Solidity/Composite.sol -o "$out"
          test -n "$(find "$out" -type f -name '*CompositeExample.bin' -size +0c -print -quit)"
          grep -Fq 'function size(uint256 nodeId)' src/Niche/Solidity/Composite.sol
          grep -Fq 'total += size(node.children[i]);' src/Niche/Solidity/Composite.sol
          grep -Fq 'function scenario()' src/Niche/Solidity/Composite.sol
      - name: Validate Fortran Composite
        shell: bash
        run: |
          set -euo pipefail
          gfortran -std=f2018 -Wall -Wextra -Werror src/Historical/Fortran/composite.f90 -o /tmp/composite-fortran
          output="$(/tmp/composite-fortran)"
          grep -Fxq 'leaf=2' <<<"$output"
          grep -Fxq 'docs=8' <<<"$output"
          grep -Fxq 'root=10' <<<"$output"
      - name: Validate Zig Composite
        shell: bash
        run: |
          set -euo pipefail
          zig fmt --check src/Systems/Zig/composite.zig
          output="$(zig run src/Systems/Zig/composite.zig 2>&1)"
          grep -Fxq 'leaf=2' <<<"$output"
          grep -Fxq 'docs=8' <<<"$output"
          grep -Fxq 'root=10' <<<"$output"
      - name: Validate Nim Composite
        shell: bash
        run: |
          set -euo pipefail
          nim c --hints:off --warnings:on -o:/tmp/composite-nim src/Niche/Nim/composite.nim
          output="$(/tmp/composite-nim)"
          grep -Fxq 'leaf=2' <<<"$output"
          grep -Fxq 'docs=8' <<<"$output"
          grep -Fxq 'root=10' <<<"$output"
      - name: Validate Dart Composite
        shell: bash
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed src/Web/Dart/composite.dart
          dart analyze --fatal-infos --fatal-warnings src/Web/Dart/composite.dart
          output="$(dart run src/Web/Dart/composite.dart)"
          grep -Fxq 'leaf=2' <<<"$output"
          grep -Fxq 'docs=8' <<<"$output"
          grep -Fxq 'root=10' <<<"$output"
      - name: Validate Crystal Composite
        shell: bash
        run: |
          set -euo pipefail
          crystal tool format src/Niche/Crystal/composite.cr
          test -z "$(git status --short -- src/Niche/Crystal/composite.cr)"
          crystal build --error-on-warnings src/Niche/Crystal/composite.cr -o /tmp/composite-crystal
          output="$(/tmp/composite-crystal)"
          grep -Fxq 'leaf=2' <<<"$output"
          grep -Fxq 'docs=8' <<<"$output"
          grep -Fxq 'root=10' <<<"$output"
      - name: Validate COBOL Composite
        shell: bash
        run: |
          set -euo pipefail
          cobc -x -Wall src/Historical/Cobol/composite.cbl -o /tmp/composite-cobol
          output="$(/tmp/composite-cobol)"
          grep -Fxq 'leaf=2' <<<"$output"
          grep -Fxq 'docs=8' <<<"$output"
          grep -Fxq 'root=10' <<<"$output"
      - name: Validate Assembly Composite
        shell: bash
        run: |
          set -euo pipefail
          nasm -f elf64 -Wall src/LowLevel/Assembly/composite.asm -o /tmp/composite-assembly.o
          ld /tmp/composite-assembly.o -o /tmp/composite-assembly
          output="$(/tmp/composite-assembly)"
          grep -Fxq 'leaf=2' <<<"$output"
          grep -Fxq 'docs=8' <<<"$output"
          grep -Fxq 'root=10' <<<"$output"

  objective-c:
    if: github.head_ref == 'patterns/composite-kb006'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate Objective-C Composite
        shell: bash
        run: |
          set -euo pipefail
          clang -fobjc-arc -Wall -Wextra -Werror -framework Foundation src/Systems/Objective-C/composite.m -o /tmp/composite-objective-c
          output="$(/tmp/composite-objective-c 2>&1)"
          grep -Fxq 'leaf=2' <<<"$output"
          grep -Fxq 'docs=8' <<<"$output"
          grep -Fxq 'root=10' <<<"$output"

  gdscript:
    if: github.head_ref == 'patterns/composite-kb006'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip' --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
      - name: Validate GDScript Composite
        shell: bash
        run: |
          set -euo pipefail
          output="$(godot --headless --script src/Niche/GDScript/composite.gd 2>&1)"
          grep -Fxq 'leaf=2' <<<"$output"
          grep -Fxq 'docs=8' <<<"$output"
          grep -Fxq 'root=10' <<<"$output"

  matlab:
    if: github.head_ref == 'patterns/composite-kb006'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: latest
      - name: Validate MATLAB Composite
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            addpath('src/DataScience/MATLAB');
            output = evalc('composite');
            disp(output);
            assert(contains(output, "leaf=2"));
            assert(contains(output, "docs=8"));
            assert(contains(output, "root=10"));

  micropython:
    if: github.head_ref == 'patterns/composite-kb006'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build MicroPython 1.28.0 Unix port
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev pkg-config
          git clone --depth 1 --branch v1.28.0 --recurse-submodules https://github.com/micropython/micropython.git /tmp/micropython
          make -C /tmp/micropython/mpy-cross -j2
          make -C /tmp/micropython/ports/unix -j2
      - name: Validate MicroPython Composite
        shell: bash
        run: |
          set -euo pipefail
          output="$(/tmp/micropython/ports/unix/build-standard/micropython src/Other/MicroPython/composite.py)"
          grep -Fxq 'leaf=2' <<<"$output"
          grep -Fxq 'docs=8' <<<"$output"
          grep -Fxq 'root=10' <<<"$output"

  rockstar:
    if: github.head_ref == 'patterns/composite-kb006'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Rockstar v2.0.31
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://github.com/RockstarLang/rockstar/releases/download/v2.0.31/rockstar-v2.0.31-linux-x64.tar.gz' --output /tmp/rockstar.tar.gz
          echo '3d265c80d9d039ad92524f42951eb546d8b42c680965dfa551210457e399653f  /tmp/rockstar.tar.gz' | sha256sum -c -
          mkdir -p /tmp/rockstar
          tar -xzf /tmp/rockstar.tar.gz -C /tmp/rockstar
          ROCKSTAR="$(find /tmp/rockstar -type f -name rockstar -perm -111 | head -n 1)"
          echo "ROCKSTAR=$ROCKSTAR" >> "$GITHUB_ENV"
      - name: Validate Rockstar Composite
        shell: bash
        run: |
          set -euo pipefail
          output="$("$ROCKSTAR" src/Other/Rockstar/composite.rock)"
          grep -Fxq 'leaf=2' <<<"$output"
          grep -Fxq 'docs=8' <<<"$output"
          grep -Fxq 'root=10' <<<"$output"
          test "$(wc -l <<<"$output" | tr -d ' ')" = '3'

  proprietary-source-contracts:
    if: github.head_ref == 'patterns/composite-kb006'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate VBA and Delphi Composite source contracts
        shell: python
        run: |
          from pathlib import Path
          import re

          def require(text: str, pattern: str, label: str) -> None:
              if re.search(pattern, text, flags=re.IGNORECASE | re.MULTILINE | re.DOTALL) is None:
                  raise SystemExit(f"Missing source contract: {label}")

          interface = Path('src/Shell/VBA/ICompositeComponent.cls').read_text(encoding='utf-8')
          leaf = Path('src/Shell/VBA/CompositeFileLeaf.cls').read_text(encoding='utf-8')
          folder = Path('src/Shell/VBA/CompositeFolder.cls').read_text(encoding='utf-8')
          demo = Path('src/Shell/VBA/composite.bas').read_text(encoding='utf-8')

          require(interface, r'Public\s+Function\s+Size\(\)\s+As\s+Long', 'VBA Component operation')
          require(leaf, r'Implements\s+ICompositeComponent.*ICompositeComponent_Size.*mBytes', 'VBA leaf contract')
          require(folder, r'Implements\s+ICompositeComponent.*Collection.*Public\s+Sub\s+Add.*child\.Size', 'VBA composite recursion')
          require(demo, r'docs\.Add\s+FileNode\(3\).*docs\.Add\s+FileNode\(5\).*root\.Add\s+readme.*root\.Add\s+docsComponent', 'VBA nested tree')
          require(demo, r'leaf=.*Size.*docs=.*Size.*root=.*Size', 'VBA observable scenario')

          delphi = Path('src/Enterprise/Delphi/CompositeExample.pas').read_text(encoding='utf-8')
          require(delphi, r'ICompositeComponent\s*=\s*interface.*function\s+Size', 'Delphi Component interface')
          require(delphi, r'TFileLeaf\s*=\s*class\(TInterfacedObject,\s*ICompositeComponent\).*function\s+Size', 'Delphi leaf')
          require(delphi, r'TFolderComposite\s*=\s*class\(TInterfacedObject,\s*ICompositeComponent\).*TList<ICompositeComponent>.*procedure\s+Add.*function\s+Size', 'Delphi composite')
          require(delphi, r'for\s+Child\s+in\s+FChildren\s+do.*Child\.Size', 'Delphi recursive aggregation')
          require(delphi, r'DocsObject\.Add\(TFileLeaf\.Create\(3\)\).*DocsObject\.Add\(TFileLeaf\.Create\(5\)\).*RootObject\.Add\(Readme\).*RootObject\.Add\(Docs\)', 'Delphi nested tree')
