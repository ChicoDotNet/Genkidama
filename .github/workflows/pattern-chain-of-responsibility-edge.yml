name: Pattern Chain of Responsibility Edge

on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/Shell/VBA/chain_of_responsibility.bas'
      - 'src/Enterprise/Delphi/ChainOfResponsibility.pas'
      - 'src/Other/Rockstar/chain_of_responsibility.rock'
      - 'src/DataScience/MATLAB/chain_of_responsibility.m'
      - 'wiki/ChainOfResponsibility.md'
      - '.github/workflows/pattern-chain-of-responsibility-edge.yml'

jobs:
  proprietary-source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate VBA and Delphi Chain source contracts
        shell: python
        run: |
          from pathlib import Path
          import re

          def require(text: str, pattern: str, label: str) -> None:
              if re.search(pattern, text, flags=re.IGNORECASE | re.MULTILINE | re.DOTALL) is None:
                  raise SystemExit(f"Missing source contract: {label}")

          vba = Path('src/Shell/VBA/chain_of_responsibility.bas').read_text(encoding='utf-8')
          for pattern, label in [
              (r'^Option Explicit$', 'VBA Option Explicit'),
              (r'Function\s+HandleFaq.*amount\s*<=\s*50.*HandleBilling\(amount,\s*visited\)', 'VBA FAQ delegates'),
              (r'Function\s+HandleBilling.*amount\s*<=\s*500.*HandleEscalation\(amount,\s*visited\)', 'VBA Billing delegates'),
              (r'Function\s+HandleEscalation.*handled=escalation;result=refund', 'VBA fallback'),
              (r'Usage.*HandleFaq\(250,\s*visited\).*visited=.*result', 'VBA canonical usage'),
          ]:
              require(vba, pattern, label)

          delphi = Path('src/Enterprise/Delphi/ChainOfResponsibility.pas').read_text(encoding='utf-8')
          for pattern, label in [
              (r'IRefundHandler\s*=\s*interface.*function\s+Handle', 'Delphi handler interface'),
              (r'TRefundHandler\s*=\s*class\(TInterfacedObject,\s*IRefundHandler\).*FNext:\s*IRefundHandler', 'Delphi linked handler'),
              (r'if\s+AAmount\s*<=\s*FLimit\s+then.*handled=%s;result=refund', 'Delphi short-circuit'),
              (r'if\s+Assigned\(FNext\)\s+then.*FNext\.Handle', 'Delphi delegation'),
              (r"Billing\s*:=\s*TRefundHandler\.Create\('billing',\s*500,\s*Escalation\).*Faq\s*:=\s*TRefundHandler\.Create\('faq',\s*50,\s*Billing\).*Faq\.Handle\(250", 'Delphi canonical chain'),
          ]:
              require(delphi, pattern, label)

          print('VBA Chain source contract: OK')
          print('Delphi Chain source contract: OK')

  rockstar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rockstar v2.0.31
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://github.com/RockstarLang/rockstar/releases/download/v2.0.31/rockstar-v2.0.31-linux-x64.tar.gz' --output /tmp/rockstar.tar.gz
          echo '3d265c80d9d039ad92524f42951eb546d8b42c680965dfa551210457e399653f  /tmp/rockstar.tar.gz' | sha256sum -c -
          mkdir -p /tmp/rockstar
          tar -xzf /tmp/rockstar.tar.gz -C /tmp/rockstar
          ROCKSTAR="$(find /tmp/rockstar -type f -name rockstar -perm -111 | head -n 1)"
          test -n "$ROCKSTAR"
          echo "ROCKSTAR=$ROCKSTAR" >> "$GITHUB_ENV"
      - name: Validate Rockstar Chain
        shell: bash
        run: |
          set -euo pipefail
          expected='visited=faq>billing;handled=billing;result=refund(250)'
          output="$("$ROCKSTAR" src/Other/Rockstar/chain_of_responsibility.rock 2>&1)"
          printf '%s\n' "$output"
          test "$output" = "$expected"

  matlab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: latest
      - name: Validate MATLAB Chain
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            addpath('src/DataScience/MATLAB');
            output = evalc('chain_of_responsibility');
            disp(output);
            assert(contains(output, "visited=faq>billing;handled=billing;result=refund(250)"));
