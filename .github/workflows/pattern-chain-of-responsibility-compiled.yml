name: Pattern Chain of Responsibility Compiled
on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/**/chain*'
      - 'src/**/ChainOfResponsibility*'
      - 'wiki/ChainOfResponsibility.md'
      - '.github/workflows/pattern-chain-of-responsibility-compiled.yml'

jobs:
  compiled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install compiled language toolchains
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fp-compiler gnat gfortran
      - name: Validate Chain of Responsibility compiled examples
        shell: bash
        run: |
          set -euo pipefail
          expected='visited=faq>billing;handled=billing;result=refund(250)'
          assert_output() {
            test "$2" = "$expected" || {
              printf '%s mismatch\nexpected: %s\nactual: %s\n' "$1" "$expected" "$2" >&2
              exit 1
            }
          }
          work="$(mktemp -d)"

          fpc -O2 -S2 -FE"$work" -FU"$work" src/Systems/Pascal/chain_of_responsibility.pas >/dev/null
          assert_output Pascal "$("$work/chain_of_responsibility")"

          gnatmake -q -gnat2022 -gnatwa -D "$work" -o "$work/chain-ada" src/Systems/Ada/chain_of_responsibility.adb
          assert_output Ada "$("$work/chain-ada")"

          gfortran -std=f2018 -Wall -Wextra -Werror src/Systems/Fortran/chain_of_responsibility.f90 -o "$work/chain-fortran"
          assert_output Fortran "$("$work/chain-fortran" | xargs)"
