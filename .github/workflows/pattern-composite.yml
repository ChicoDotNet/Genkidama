name: Pattern Composite

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/pattern-composite.yml'
      - 'src/Enterprise/C#/CompositeExample.cs'
      - 'src/Enterprise/Java/CompositeExample.java'
      - 'src/Enterprise/Kotlin/CompositeExample.kt'
      - 'src/Functional/F#/composite.fsx'
      - 'src/Scripting/PHP/composite.php'
      - 'src/Scripting/PythonPY/composite.py'
      - 'src/Systems/C++/composite.cpp'
      - 'src/Systems/Go/composite.go'
      - 'src/Systems/Rust/composite.rs'
      - 'src/Systems/Swift/composite.swift'
      - 'src/Web/JavaScriptJS/composite.js'
      - 'src/Web/TypeScriptTS/composite.ts'
      - 'wiki/Composite.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup PHP
        shell: bash
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y php-cli

      - name: Validate C# Composite
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          dotnet new console --framework net10.0 --output "$work" --force >/dev/null
          cp 'src/Enterprise/C#/CompositeExample.cs' "$work/Program.cs"
          output="$(dotnet run --project "$work" --configuration Release)"
          grep -Fxq 'leaf=2' <<<"$output"
          grep -Fxq 'docs=8' <<<"$output"
          grep -Fxq 'root=10' <<<"$output"

      - name: Validate Python Composite
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile src/Scripting/PythonPY/composite.py
          output="$(python src/Scripting/PythonPY/composite.py)"
          grep -Fxq 'leaf=2' <<<"$output"
          grep -Fxq 'docs=8' <<<"$output"
          grep -Fxq 'root=10' <<<"$output"

      - name: Validate JavaScript Composite
        shell: bash
        run: |
          set -euo pipefail
          node --check src/Web/JavaScriptJS/composite.js
          output="$(node src/Web/JavaScriptJS/composite.js)"
          grep -Fxq 'leaf=2' <<<"$output"
          grep -Fxq 'docs=8' <<<"$output"
          grep -Fxq 'root=10' <<<"$output"

      - name: Validate TypeScript Composite
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          npx --yes --package typescript@6.0.3 tsc src/Web/TypeScriptTS/composite.ts --strict --target ES2024 --module commonjs --outDir "$work"
          output="$(node "$work/composite.js")"
          grep -Fxq 'leaf=2' <<<"$output"
          grep -Fxq 'docs=8' <<<"$output"
          grep -Fxq 'root=10' <<<"$output"

      - name: Validate C++ Composite
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          g++ -std=c++20 -Wall -Wextra -Werror 'src/Systems/C++/composite.cpp' -o "$work/composite"
          output="$("$work/composite")"
          grep -Fxq 'leaf=2' <<<"$output"
          grep -Fxq 'docs=8' <<<"$output"
          grep -Fxq 'root=10' <<<"$output"

      - name: Validate Java Composite
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          javac -Xlint:all -Werror -d "$work" src/Enterprise/Java/CompositeExample.java
          output="$(java -cp "$work" CompositeExample)"
          grep -Fxq 'leaf=2' <<<"$output"
          grep -Fxq 'docs=8' <<<"$output"
          grep -Fxq 'root=10' <<<"$output"

      - name: Validate Go Composite
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -d src/Systems/Go/composite.go)"
          go vet src/Systems/Go/composite.go
          output="$(go run src/Systems/Go/composite.go)"
          grep -Fxq 'leaf=2' <<<"$output"
          grep -Fxq 'docs=8' <<<"$output"
          grep -Fxq 'root=10' <<<"$output"

      - name: Validate Rust Composite
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          rustfmt --check src/Systems/Rust/composite.rs
          rustc -D warnings src/Systems/Rust/composite.rs -o "$work/composite"
          output="$("$work/composite")"
          grep -Fxq 'leaf=2' <<<"$output"
          grep -Fxq 'docs=8' <<<"$output"
          grep -Fxq 'root=10' <<<"$output"

      - name: Validate PHP Composite
        shell: bash
        run: |
          set -euo pipefail
          php -l src/Scripting/PHP/composite.php >/dev/null
          output="$(php src/Scripting/PHP/composite.php)"
          grep -Fxq 'leaf=2' <<<"$output"
          grep -Fxq 'docs=8' <<<"$output"
          grep -Fxq 'root=10' <<<"$output"

      - name: Validate Kotlin Composite
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          command -v kotlinc >/dev/null
          kotlinc src/Enterprise/Kotlin/CompositeExample.kt -include-runtime -d "$work/composite.jar"
          output="$(java -jar "$work/composite.jar")"
          grep -Fxq 'leaf=2' <<<"$output"
          grep -Fxq 'docs=8' <<<"$output"
          grep -Fxq 'root=10' <<<"$output"

      - name: Validate Swift Composite
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          command -v swiftc >/dev/null
          swiftc src/Systems/Swift/composite.swift -o "$work/composite"
          output="$("$work/composite")"
          grep -Fxq 'leaf=2' <<<"$output"
          grep -Fxq 'docs=8' <<<"$output"
          grep -Fxq 'root=10' <<<"$output"

      - name: Validate F# Composite
        shell: bash
        run: |
          set -euo pipefail
          output="$(dotnet fsi 'src/Functional/F#/composite.fsx')"
          grep -Fxq 'leaf=2' <<<"$output"
          grep -Fxq 'docs=8' <<<"$output"
          grep -Fxq 'root=10' <<<"$output"
