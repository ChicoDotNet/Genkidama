name: Pattern Medium-High Ada Canonical

on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/Systems/Ada/*_pattern.adb'
      - 'src/Systems/Ada/pattern_sweep.adb'
      - '.github/workflows/pattern-medium-high-ada-canonical.yml'

jobs:
  ada-canonical:
    name: Ada 2022 — 39 canonical cells
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Install distro-stable GNAT
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gnat
          gnatmake --version | head -n 1
      - run: echo "SETUP_END=$(date +%s)" >> "$GITHUB_ENV"
      - name: Compile and execute all canonical Ada cells
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          mkdir -p "$work/obj"
          test "$(find src/Systems/Ada -maxdepth 1 -type f -name '*_pattern.adb' | wc -l)" -eq 39
          gnatmake -q -gnat2022 -gnatwa -gnatwe -D "$work/obj" -o "$work/ada-sweep" src/Systems/Ada/pattern_sweep.adb
          test "$("$work/ada-sweep" | tail -n 1)" = 'Ada pattern sweep: 39/39 examples passed'
      - name: Timing summary
        if: always()
        shell: bash
        run: |
          now="$(date +%s)"; setup="$((SETUP_END-JOB_START))"; total="$((now-JOB_START))"; validation="$((total-setup))"
          printf '### Ada canonical\n\n- cells: 39\n- setup_seconds: %s\n- validation_seconds: %s\n- total_seconds: %s\n' "$setup" "$validation" "$total" >> "$GITHUB_STEP_SUMMARY"
