name: Learn Python

on:
  pull_request:
    branches:
      - main
    paths:
      - 'learn/es/python/**'
      - '.github/workflows/learn-python.yml'
  push:
    branches:
      - main
    paths:
      - 'learn/es/python/**'
      - '.github/workflows/learn-python.yml'

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.14.7
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'

      - name: Show Python version
        run: python --version

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check 'pytest==9.1.1'

      - name: Compile
        run: python -m compileall -q learn/es/python/app/src

      - name: Test
        working-directory: learn/es/python/app
        run: python -m pytest

      - name: Smoke test
        working-directory: learn/es/python/app
        env:
          PYTHONPATH: src
        run: |
          python -m ledgermatch examples/invoices.csv | tee /tmp/ledgermatch.txt
          grep -F 'Procesadas: 4' /tmp/ledgermatch.txt
          grep -F 'Con diferencia: 2' /tmp/ledgermatch.txt
