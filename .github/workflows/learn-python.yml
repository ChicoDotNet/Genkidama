name: Learn Python

on:
  pull_request:
    branches:
      - main
    paths:
      - 'learn/es/python/**'
      - '.github/workflows/learn-python.yml'
  push:
    branches:
      - main
    paths:
      - 'learn/es/python/**'
      - '.github/workflows/learn-python.yml'

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.14.7
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'

      - name: Show Python version
        run: python --version

      - name: Install package and development dependency
        working-directory: learn/es/python/app
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Compile
        working-directory: learn/es/python/app
        run: python -m compileall -q src

      - name: Test
        working-directory: learn/es/python/app
        run: python -m pytest

      - name: Build wheel
        working-directory: learn/es/python/app
        run: python -m pip wheel --disable-pip-version-check --no-deps . -w /tmp/ledgermatch-wheel

      - name: Smoke test installed command and idempotency
        working-directory: learn/es/python/app
        run: |
          ledgermatch examples/invoices.csv --db /tmp/ledgermatch.db | tee /tmp/ledgermatch-first.txt
          grep -F 'Procesadas: 4' /tmp/ledgermatch-first.txt
          grep -F 'Con diferencia: 2' /tmp/ledgermatch-first.txt
          grep -F 'Persistencia: importación #1 creada' /tmp/ledgermatch-first.txt
          ledgermatch examples/invoices.csv --db /tmp/ledgermatch.db | tee /tmp/ledgermatch-second.txt
          grep -F 'Persistencia: importación #1 ya registrada' /tmp/ledgermatch-second.txt
