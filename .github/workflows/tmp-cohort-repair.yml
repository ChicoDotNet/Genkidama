name: Temporary Cohort Repair

on:
  pull_request:
    branches:
      - dev
    paths:
      - .github/workflows/tmp-cohort-repair.yml
      - src/Functional/Haskell/PatternSweep.hs
      - src/Web/Dart/pattern_sweep.dart
      - src/Niche/Crystal/pattern_sweep.cr
      - src/Systems/Zig/pattern_sweep.zig

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sweeps/high-overhead-cohort-kb006
          fetch-depth: 0
      - name: Start repair timer
        run: echo "REPAIR_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Install GHC
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ghc
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: crystal-lang/install-crystal@v1
      - uses: mlugg/setup-zig@v2
      - name: Repair Haskell and canonicalize formatter-owned sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/Functional/Haskell/PatternSweep.hs')
          s = p.read_text()
          old_facade = 'enterpriseFacadeCase = let crm i="crm:create:"++show i; billing i="billing:open:"++show i in crm 77 ++ ">" ++ billing 77 == "crm:create:77>billing:open:77"'
          new_facade = 'enterpriseFacadeCase =\n  let crm :: Int -> String\n      crm i = "crm:create:" ++ show i\n      billing :: Int -> String\n      billing i = "billing:open:" ++ show i\n  in crm 77 ++ ">" ++ billing 77 == "crm:create:77>billing:open:77"'
          replacements = {
              old_facade: new_facade,
              'activeObjectCase = let queue=[(+3),(*4)]; before=0; after=foldl (flip ($)) before queue in before==0 && after==12': 'activeObjectCase = let queue=[(+3),(*4)]; before=(0 :: Int); after=foldl (flip ($)) before queue in before==0 && after==12',
              'leaderFollowersCase = let workers=cycle ["worker-1","worker-2","worker-3"]; events=["event-a","event-b","event-c"]; handled=zipWith (\\w e->w++":"++e) workers events; next=workers!!3 in handled==["worker-1:event-a","worker-2:event-b","worker-3:event-c"] && next=="worker-1"': 'leaderFollowersCase = let workers=cycle ["worker-1","worker-2","worker-3"]; events=["event-a","event-b","event-c"]; handled=zipWith (\\w e->w++":"++e) workers events; nextWorker=workers!!3 in handled==["worker-1:event-a","worker-2:event-b","worker-3:event-c"] && nextWorker=="worker-1"',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected source fragment: {old[:64]}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          dart format src/Web/Dart/pattern_sweep.dart
          crystal tool format src/Niche/Crystal/pattern_sweep.cr
          zig fmt src/Systems/Zig/pattern_sweep.zig
      - name: Validate 156 repaired cells
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"

          ghc -Wall -Werror -O0 -odir "$work" -hidir "$work" src/Functional/Haskell/PatternSweep.hs -o "$work/pattern-sweep-haskell"
          test "$("$work/pattern-sweep-haskell")" = 'Haskell pattern sweep: 39/39 examples passed'

          dart format --output=none --set-exit-if-changed src/Web/Dart/pattern_sweep.dart
          dart analyze --fatal-infos --fatal-warnings src/Web/Dart/pattern_sweep.dart
          test "$(dart run src/Web/Dart/pattern_sweep.dart)" = 'Dart pattern sweep: 39/39 examples passed'

          crystal tool format --check src/Niche/Crystal/pattern_sweep.cr
          crystal build --error-on-warnings src/Niche/Crystal/pattern_sweep.cr -o "$work/pattern-sweep-crystal"
          test "$("$work/pattern-sweep-crystal")" = 'Crystal pattern sweep: 39/39 examples passed'

          zig fmt --check src/Systems/Zig/pattern_sweep.zig
          test "$(zig run src/Systems/Zig/pattern_sweep.zig 2>&1)" = 'Zig pattern sweep: 39/39 examples passed'
      - name: Verify repair scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain --untracked-files=no | sed 's/^...//' | sort)
          printf '%s\n' "${changed[@]}"
          expected=$(printf '%s\n' \
            src/Functional/Haskell/PatternSweep.hs \
            src/Niche/Crystal/pattern_sweep.cr \
            src/Systems/Zig/pattern_sweep.zig \
            src/Web/Dart/pattern_sweep.dart | sort)
          actual=$(printf '%s\n' "${changed[@]}")
          test "$actual" = "$expected"
      - name: Commit repaired cohort sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/Functional/Haskell/PatternSweep.hs \
            src/Web/Dart/pattern_sweep.dart \
            src/Niche/Crystal/pattern_sweep.cr \
            src/Systems/Zig/pattern_sweep.zig
          git commit -m 'fix(patterns): repair high-overhead cohort gates'
          git push origin HEAD:sweeps/high-overhead-cohort-kb006
      - name: Record repair timing
        if: always()
        shell: bash
        run: |
          now="$(date +%s)"
          printf '### Temporary cohort repair\n- repaired_cells: 156\n- wall_seconds: %s\n' "$((now - REPAIR_STARTED))" >> "$GITHUB_STEP_SUMMARY"
