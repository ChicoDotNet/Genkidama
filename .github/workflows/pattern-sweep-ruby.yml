name: Pattern sweep - Ruby

on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/Scripting/Ruby/pattern_sweep.rb'
      - 'docs/pattern-sweeps/ruby.md'
      - '.github/workflows/pattern-sweep-ruby.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruby-pattern-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Syntax-check and execute 39 pattern cells
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          ruby -c src/Scripting/Ruby/pattern_sweep.rb
          setup_done=$(date +%s)
          ruby src/Scripting/Ruby/pattern_sweep.rb
          finish=$(date +%s)
          echo "cells=39"
          echo "setup_seconds=$((setup_done-start))"
          echo "validation_seconds=$((finish-setup_done))"
          echo "total_seconds=$((finish-start))"
