name: Pattern Adapter Final

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/pattern-adapter-final.yml'
      - 'src/Historical/Ada/adapter.adb'
      - 'src/Niche/Solidity/Adapter.sol'
      - 'src/Historical/Fortran/adapter.f90'
      - 'src/Systems/Objective-C/adapter.m'
      - 'src/Systems/Zig/adapter.zig'
      - 'src/Niche/Nim/adapter.nim'
      - 'src/Web/Dart/adapter.dart'
      - 'src/Niche/Crystal/adapter.cr'
      - 'src/Historical/Cobol/adapter.cbl'
      - 'src/Shell/VBA/adapter.bas'
      - 'src/Shell/VBA/ITemperatureReader.cls'
      - 'src/Shell/VBA/LegacyFahrenheitSensor.cls'
      - 'src/Shell/VBA/FahrenheitSensorAdapter.cls'
      - 'src/Niche/GDScript/adapter.gd'
      - 'src/DataScience/MATLAB/adapter.m'
      - 'src/LowLevel/Assembly/adapter.asm'
      - 'src/Enterprise/Delphi/AdapterExample.pas'
      - 'src/Other/MicroPython/adapter.py'
      - 'src/Other/Rockstar/adapter.rock'
      - 'wiki/Adapter.md'

jobs:
  portable-final:
    if: github.head_ref == 'patterns/adapter-kb006'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Setup Crystal
        uses: crystal-lang/install-crystal@v1

      - name: Setup final portable runtimes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gnat gfortran nim gnucobol3 nasm

      - name: Validate Ada Adapter
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          gnatmake -q -gnat2022 -gnatwa -gnatwe -D "$work" src/Historical/Ada/adapter.adb -o /tmp/adapter-ada
          output="$(/tmp/adapter-ada | tr -d ' ')"
          grep -Fxq 'legacy=86F' <<<"$output"
          grep -Fxq 'adapted=30C' <<<"$output"

      - name: Validate Solidity Adapter source contract
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          npx --yes solc@0.8.30 --bin --abi src/Niche/Solidity/Adapter.sol -o "$out"
          test -n "$(find "$out" -type f -name '*FahrenheitSensorAdapter.bin' -size +0c -print -quit)"
          grep -Fq 'interface ITemperatureReader' src/Niche/Solidity/Adapter.sol
          grep -Fq 'adaptee.readFahrenheit()' src/Niche/Solidity/Adapter.sol
          grep -Fq '((fahrenheit - 32) * 5) / 9' src/Niche/Solidity/Adapter.sol

      - name: Validate Fortran Adapter
        shell: bash
        run: |
          set -euo pipefail
          gfortran -std=f2018 -Wall -Wextra -Werror src/Historical/Fortran/adapter.f90 -o /tmp/adapter-fortran
          output="$(/tmp/adapter-fortran)"
          grep -Fxq 'legacy=86F' <<<"$output"
          grep -Fxq 'adapted=30C' <<<"$output"

      - name: Validate Zig Adapter
        shell: bash
        run: |
          set -euo pipefail
          zig fmt --check src/Systems/Zig/adapter.zig
          output="$(zig run src/Systems/Zig/adapter.zig 2>&1)"
          grep -Fxq 'legacy=86F' <<<"$output"
          grep -Fxq 'adapted=30C' <<<"$output"

      - name: Validate Nim Adapter
        shell: bash
        run: |
          set -euo pipefail
          nim c --hints:off --warnings:on -o:/tmp/adapter-nim src/Niche/Nim/adapter.nim
          output="$(/tmp/adapter-nim)"
          grep -Fxq 'legacy=86F' <<<"$output"
          grep -Fxq 'adapted=30C' <<<"$output"

      - name: Validate Dart Adapter
        shell: bash
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed src/Web/Dart/adapter.dart
          dart analyze --fatal-infos --fatal-warnings src/Web/Dart/adapter.dart
          output="$(dart run src/Web/Dart/adapter.dart)"
          grep -Fxq 'legacy=86F' <<<"$output"
          grep -Fxq 'adapted=30C' <<<"$output"

      - name: Validate Crystal Adapter
        shell: bash
        run: |
          set -euo pipefail
          crystal tool format src/Niche/Crystal/adapter.cr
          test -z "$(git status --short -- src/Niche/Crystal/adapter.cr)"
          crystal build --error-on-warnings src/Niche/Crystal/adapter.cr -o /tmp/adapter-crystal
          output="$(/tmp/adapter-crystal)"
          grep -Fxq 'legacy=86F' <<<"$output"
          grep -Fxq 'adapted=30C' <<<"$output"

      - name: Validate COBOL Adapter
        shell: bash
        run: |
          set -euo pipefail
          cobc -x -Wall src/Historical/Cobol/adapter.cbl -o /tmp/adapter-cobol
          output="$(/tmp/adapter-cobol)"
          grep -Fxq 'legacy=86F' <<<"$output"
          grep -Fxq 'adapted=30C' <<<"$output"

      - name: Validate Assembly Adapter
        shell: bash
        run: |
          set -euo pipefail
          nasm -f elf64 -Wall src/LowLevel/Assembly/adapter.asm -o /tmp/adapter-assembly.o
          ld /tmp/adapter-assembly.o -o /tmp/adapter-assembly
          output="$(/tmp/adapter-assembly)"
          grep -Fxq 'legacy=86F' <<<"$output"
          grep -Fxq 'adapted=30C' <<<"$output"

  objective-c:
    if: github.head_ref == 'patterns/adapter-kb006'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate Objective-C Adapter
        shell: bash
        run: |
          set -euo pipefail
          clang -fobjc-arc -Wall -Wextra -Werror -framework Foundation src/Systems/Objective-C/adapter.m -o /tmp/adapter-objective-c
          output="$(/tmp/adapter-objective-c 2>&1)"
          grep -Fxq 'legacy=86F' <<<"$output"
          grep -Fxq 'adapted=30C' <<<"$output"

  gdscript:
    if: github.head_ref == 'patterns/adapter-kb006'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip' --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
      - name: Validate GDScript Adapter
        shell: bash
        run: |
          set -euo pipefail
          output="$(godot --headless --script src/Niche/GDScript/adapter.gd 2>&1)"
          grep -Fxq 'legacy=86F' <<<"$output"
          grep -Fxq 'adapted=30C' <<<"$output"

  matlab:
    if: github.head_ref == 'patterns/adapter-kb006'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: latest
      - name: Validate MATLAB Adapter
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            addpath('src/DataScience/MATLAB');
            output = evalc('adapter');
            disp(output);
            assert(contains(output, "legacy=86F"));
            assert(contains(output, "adapted=30C"));

  micropython:
    if: github.head_ref == 'patterns/adapter-kb006'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build MicroPython 1.28.0 Unix port
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev pkg-config
          git clone --depth 1 --branch v1.28.0 --recurse-submodules https://github.com/micropython/micropython.git /tmp/micropython
          make -C /tmp/micropython/mpy-cross -j2
          make -C /tmp/micropython/ports/unix -j2
      - name: Validate MicroPython Adapter
        shell: bash
        run: |
          set -euo pipefail
          output="$(/tmp/micropython/ports/unix/build-standard/micropython src/Other/MicroPython/adapter.py)"
          grep -Fxq 'legacy=86F' <<<"$output"
          grep -Fxq 'adapted=30C' <<<"$output"

  rockstar:
    if: github.head_ref == 'patterns/adapter-kb006'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Rockstar v2.0.31
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://github.com/RockstarLang/rockstar/releases/download/v2.0.31/rockstar-v2.0.31-linux-x64.tar.gz' --output /tmp/rockstar.tar.gz
          echo '3d265c80d9d039ad92524f42951eb546d8b42c680965dfa551210457e399653f  /tmp/rockstar.tar.gz' | sha256sum -c -
          mkdir -p /tmp/rockstar
          tar -xzf /tmp/rockstar.tar.gz -C /tmp/rockstar
          ROCKSTAR="$(find /tmp/rockstar -type f -name rockstar -perm -111 | head -n 1)"
          echo "ROCKSTAR=$ROCKSTAR" >> "$GITHUB_ENV"
      - name: Validate Rockstar Adapter
        shell: bash
        run: |
          set -euo pipefail
          output="$("$ROCKSTAR" src/Other/Rockstar/adapter.rock)"
          grep -Fxq 'legacy=86F' <<<"$output"
          grep -Fxq 'adapted=30C' <<<"$output"
          test "$(wc -l <<<"$output" | tr -d ' ')" = '2'

  proprietary-source-contracts:
    if: github.head_ref == 'patterns/adapter-kb006'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate VBA and Delphi Adapter source contracts
        shell: python
        run: |
          from pathlib import Path
          import re

          def require(text: str, pattern: str, label: str) -> None:
              if re.search(pattern, text, flags=re.IGNORECASE | re.MULTILINE | re.DOTALL) is None:
                  raise SystemExit(f"Missing source contract: {label}")

          interface = Path('src/Shell/VBA/ITemperatureReader.cls').read_text(encoding='utf-8')
          legacy = Path('src/Shell/VBA/LegacyFahrenheitSensor.cls').read_text(encoding='utf-8')
          adapter = Path('src/Shell/VBA/FahrenheitSensorAdapter.cls').read_text(encoding='utf-8')
          demo = Path('src/Shell/VBA/adapter.bas').read_text(encoding='utf-8')

          require(interface, r'Public\s+Function\s+ReadCelsius\(\)\s+As\s+Long', 'VBA Target contract')
          require(legacy, r'Public\s+Function\s+ReadFahrenheit\(\)\s+As\s+Long.*86', 'VBA Adaptee contract')
          require(adapter, r'Implements\s+ITemperatureReader', 'VBA Adapter implements Target')
          require(adapter, r'Private\s+adaptee\s+As\s+LegacyFahrenheitSensor', 'VBA Adapter composition')
          require(adapter, r'adaptee\.ReadFahrenheit\(\).*\(\(fahrenheit\s*-\s*32\)\s*\*\s*5\)\s*\\\s*9', 'VBA unit translation')
          require(demo, r'Set\s+reader\s*=\s*concreteAdapter.*Debug\.Print\s+"legacy=".*Debug\.Print\s+"adapted="', 'VBA client observes Target')

          delphi = Path('src/Enterprise/Delphi/AdapterExample.pas').read_text(encoding='utf-8')
          require(delphi, r'ITemperatureReader\s*=\s*interface', 'Delphi Target interface')
          require(delphi, r'TLegacyFahrenheitSensor\s*=\s*class.*ReadFahrenheit', 'Delphi Adaptee')
          require(delphi, r'TFahrenheitSensorAdapter\s*=\s*class\(TInterfacedObject,\s*ITemperatureReader\)', 'Delphi Adapter implements Target')
          require(delphi, r'FAdaptee:\s*TLegacyFahrenheitSensor', 'Delphi Adapter composition')
          require(delphi, r'FAdaptee\.ReadFahrenheit.*\(\(Fahrenheit\s*-\s*32\)\s*\*\s*5\)\s*div\s*9', 'Delphi unit translation')

          print('VBA Adapter source contract: OK')
          print('Delphi Adapter source contract: OK')
