name: Learn Ruby

on:
  pull_request:
    paths:
      - 'learn/es/ruby/**'
      - '.github/workflows/learn-ruby.yml'
  push:
    branches: [dev]
    paths:
      - 'learn/es/ruby/**'
      - '.github/workflows/learn-ruby.yml'

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: learn/es/ruby/app
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1.321.0
        with:
          ruby-version: '4.0.6'
          bundler-cache: true
          working-directory: learn/es/ruby/app
      - name: Show versions
        run: ruby --version && bundle --version
      - name: Prepare database
        run: bundle exec rails db:prepare
        env:
          RAILS_ENV: test
      - name: Run tests
        run: bundle exec rails test
      - name: Smoke application
        run: bundle exec rails runner script/smoke.rb
        env:
          RAILS_ENV: test
