name: Pattern Builder

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/pattern-builder.yml'
      - 'src/Enterprise/C#/BuilderExample.cs'
      - 'src/Enterprise/Java/BuilderExample.java'
      - 'src/Enterprise/Kotlin/BuilderExample.kt'
      - 'src/Scripting/PHP/builder.php'
      - 'src/Scripting/PythonPY/builder.py'
      - 'src/Scripting/RubyRB/builder.rb'
      - 'src/Scripting/Lua/builder.lua'
      - 'src/Shell/Bash/builder.sh'
      - 'src/Systems/C/builder.c'
      - 'src/Systems/C++/builder.cpp'
      - 'src/Systems/Go/builder.go'
      - 'src/Systems/Rust/builder.rs'
      - 'src/Systems/Swift/builder.swift'
      - 'src/Web/JavaScriptJS/builder.js'
      - 'src/Web/TypeScriptTS/builder.ts'
      - 'wiki/Builder.md'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup lightweight runtimes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y lua5.4 php-cli ruby

      - name: Validate C# Builder
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          dotnet new console --framework net10.0 --output "$work" --force >/dev/null
          cp 'src/Enterprise/C#/BuilderExample.cs' "$work/Program.cs"
          output="$(dotnet run --project "$work" --configuration Release)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Python Builder
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile src/Scripting/PythonPY/builder.py
          output="$(python src/Scripting/PythonPY/builder.py)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate JavaScript Builder
        shell: bash
        run: |
          set -euo pipefail
          node --check src/Web/JavaScriptJS/builder.js
          output="$(node src/Web/JavaScriptJS/builder.js)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate TypeScript Builder
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          npx --yes typescript@6.0.3 tsc src/Web/TypeScriptTS/builder.ts --strict --target ES2024 --module commonjs --outDir "$work"
          output="$(node "$work/builder.js")"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Go Builder
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -d src/Systems/Go/builder.go)"
          go vet src/Systems/Go/builder.go
          output="$(go run src/Systems/Go/builder.go)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Java Builder
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          javac -Xlint:all -Werror -d "$work" src/Enterprise/Java/BuilderExample.java
          output="$(java -cp "$work" BuilderExample)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Rust Builder
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          rustfmt --check src/Systems/Rust/builder.rs
          rustc -D warnings src/Systems/Rust/builder.rs -o "$work/builder"
          output="$("$work/builder")"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate C++ Builder
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          g++ -std=c++20 -Wall -Wextra -Werror 'src/Systems/C++/builder.cpp' -o "$work/builder"
          output="$("$work/builder")"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate C Builder
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          gcc -std=c17 -Wall -Wextra -Werror src/Systems/C/builder.c -o "$work/builder"
          output="$("$work/builder")"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Ruby Builder
        shell: bash
        run: |
          set -euo pipefail
          ruby -cw src/Scripting/RubyRB/builder.rb
          output="$(ruby src/Scripting/RubyRB/builder.rb)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate PHP Builder
        shell: bash
        run: |
          set -euo pipefail
          php -l src/Scripting/PHP/builder.php
          output="$(php src/Scripting/PHP/builder.php)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Lua Builder
        shell: bash
        run: |
          set -euo pipefail
          output="$(lua5.4 src/Scripting/Lua/builder.lua)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Bash Builder
        shell: bash
        run: |
          set -euo pipefail
          bash -n src/Shell/Bash/builder.sh
          output="$(bash src/Shell/Bash/builder.sh)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Kotlin Builder
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          command -v kotlinc >/dev/null
          kotlinc src/Enterprise/Kotlin/BuilderExample.kt -include-runtime -d "$work/builder.jar"
          output="$(java -jar "$work/builder.jar")"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Swift Builder
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          command -v swiftc >/dev/null
          swiftc src/Systems/Swift/builder.swift -o "$work/builder"
          output="$("$work/builder")"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"
