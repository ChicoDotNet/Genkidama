name: Pattern Proxy Final

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/pattern-proxy-final.yml'
      - 'src/Niche/Solidity/Proxy.sol'
      - 'src/Historical/Cobol/proxy.cbl'
      - 'src/LowLevel/Assembly/proxy.asm'
      - 'src/Shell/VBA/ProxyExample.bas'
      - 'src/Enterprise/Delphi/ProxyExample.pas'
      - 'src/Other/Rockstar/proxy.rock'
      - 'src/DataScience/MATLAB/proxy.m'
      - 'wiki/Proxy.md'
      - 'src/Data/SQL/command.sql'
      - 'src/Scripting/Perl/command.pl'
      - 'src/Niche/GDScript/command.gd'
      - 'src/LowLevel/Assembly/command.asm'
      - 'src/Enterprise/Delphi/CommandExample.pas'
      - 'src/Other/MicroPython/command.py'
      - 'src/Other/Rockstar/command.rock'
      - 'src/Shell/VBA/CommandExample.bas'
      - 'docs/pattern-sweeps/command-final.md'
      - 'wiki/Command.md'

jobs:
  final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install native toolchains
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gnucobol3 nasm

      - name: Validate Solidity Proxy source contract
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          npx --yes solc@0.8.30 --bin --abi src/Niche/Solidity/Proxy.sol -o "$out"
          test -n "$(find "$out" -type f -name '*DocumentStoreProxy.bin' -size +0c -print -quit)"
          grep -Fq 'backend = new RemoteDocumentStore();' src/Niche/Solidity/Proxy.sol
          grep -Fq 'cache[id] = backend.get(id);' src/Niche/Solidity/Proxy.sol
          grep -Fq 'cached[id] = true;' src/Niche/Solidity/Proxy.sol

      - name: Validate COBOL Proxy
        shell: bash
        run: |
          set -euo pipefail
          cobc -x -Wall src/Historical/Cobol/proxy.cbl -o /tmp/proxy-cobol
          test "$(/tmp/proxy-cobol)" = 'backend=1;fetches=1;first=doc(42);second=doc(42)'

      - name: Validate Assembly Proxy
        shell: bash
        run: |
          set -euo pipefail
          nasm -f elf64 -Wall src/LowLevel/Assembly/proxy.asm -o /tmp/proxy-assembly.o
          ld /tmp/proxy-assembly.o -o /tmp/proxy-assembly
          test "$(/tmp/proxy-assembly)" = 'backend=1;fetches=1;first=doc(42);second=doc(42)'

  rockstar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rockstar v2.0.31
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://github.com/RockstarLang/rockstar/releases/download/v2.0.31/rockstar-v2.0.31-linux-x64.tar.gz' --output /tmp/rockstar.tar.gz
          echo '3d265c80d9d039ad92524f42951eb546d8b42c680965dfa551210457e399653f  /tmp/rockstar.tar.gz' | sha256sum -c -
          mkdir -p /tmp/rockstar
          tar -xzf /tmp/rockstar.tar.gz -C /tmp/rockstar
          echo "ROCKSTAR=$(find /tmp/rockstar -type f -name rockstar -perm -111 | head -n 1)" >> "$GITHUB_ENV"
      - name: Validate Rockstar Proxy
        shell: bash
        run: |
          set -euo pipefail
          test "$("$ROCKSTAR" src/Other/Rockstar/proxy.rock)" = 'backend=1;fetches=1;first=doc(42);second=doc(42)'

  matlab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: matlab-actions/setup-matlab@v2
      - uses: matlab-actions/run-command@v3
        with:
          command: "run('src/DataScience/MATLAB/proxy.m')"

  proprietary-source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate VBA and Delphi Proxy source contracts
        shell: python
        run: |
          from pathlib import Path
          import re

          def require(text, pattern, label):
              if re.search(pattern, text, flags=re.IGNORECASE | re.MULTILINE | re.DOTALL) is None:
                  raise SystemExit(f"Missing source contract: {label}")

          vba = Path('src/Shell/VBA/ProxyExample.bas').read_text(encoding='utf-8')
          for pattern, label in [
              (r'^Option Explicit$', 'VBA Option Explicit'),
              (r'Function\s+ProxyGet', 'VBA proxy operation'),
              (r'CreateObject\("Scripting\.Dictionary"\)', 'VBA proxy cache'),
              (r'If\s+mBackendCreated\s*=\s*0\s+Then\s+mBackendCreated\s*=\s*1', 'VBA lazy backend'),
              (r'cache\.Exists\(key\)', 'VBA cached mediation'),
          ]:
              require(vba, pattern, label)

          delphi = Path('src/Enterprise/Delphi/ProxyExample.pas').read_text(encoding='utf-8')
          for pattern, label in [
              (r'IDocumentStore\s*=\s*interface', 'Delphi subject contract'),
              (r'TRemoteDocumentStore\s*=\s*class', 'Delphi real subject'),
              (r'TDocumentStoreProxy\s*=\s*class', 'Delphi proxy'),
              (r'FCache\.TryGetValue', 'Delphi cached mediation'),
              (r'if\s+FBackend\s*=\s*nil\s+then', 'Delphi lazy backend'),
          ]:
              require(delphi, pattern, label)

          print('VBA/Delphi Proxy source contracts: OK')

  command-final:
    if: github.head_ref == 'patterns/command-kb006-final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Command final native tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y sqlite3 perl nasm build-essential libffi-dev pkg-config unzip

      - name: Validate SQL, Perl and Assembly Command
        shell: bash
        run: |
          set -euo pipefail
          expected='balance=130;commands=2'
          test "$(sqlite3 :memory: < src/Data/SQL/command.sql)" = "$expected"
          perl -c src/Scripting/Perl/command.pl
          test "$(perl src/Scripting/Perl/command.pl)" = "$expected"
          nasm -f elf64 -Wall src/LowLevel/Assembly/command.asm -o /tmp/command.o
          ld /tmp/command.o -o /tmp/command
          test "$(/tmp/command)" = "$expected"

      - name: Validate VBA and Delphi Command source contracts
        shell: python
        run: |
          from pathlib import Path
          import re
          def require(text, pattern, label):
              if re.search(pattern, text, flags=re.IGNORECASE | re.MULTILINE | re.DOTALL) is None:
                  raise SystemExit(f"Missing source contract: {label}")
          vba = Path('src/Shell/VBA/CommandExample.bas').read_text(encoding='utf-8')
          require(vba, r'ExecuteCommand', 'VBA dispatcher')
          require(vba, r'Case\s+"deposit"', 'VBA deposit command')
          require(vba, r'Case\s+"withdraw"', 'VBA withdraw command')
          delphi = Path('src/Enterprise/Delphi/CommandExample.pas').read_text(encoding='utf-8')
          require(delphi, r'ICommand\s*=\s*interface', 'Delphi command contract')
          require(delphi, r'TDepositCommand', 'Delphi deposit command')
          require(delphi, r'TWithdrawCommand', 'Delphi withdraw command')
          require(delphi, r'for\s+Command\s+in\s+Queue\s+do', 'Delphi invoker queue')
          print('VBA/Delphi Command source contracts: OK')

      - name: Setup and validate Godot 4.6.3 Command
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip' --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          output="$(godot --headless --script src/Niche/GDScript/command.gd 2>&1)"
          grep -Fxq 'balance=130;commands=2' <<<"$output"

      - name: Build and validate MicroPython 1.28.0 Command
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.28.0 --recurse-submodules https://github.com/micropython/micropython.git /tmp/micropython
          make -C /tmp/micropython/mpy-cross -j2
          make -C /tmp/micropython/ports/unix -j2
          test "$(/tmp/micropython/ports/unix/build-standard/micropython src/Other/MicroPython/command.py)" = 'balance=130;commands=2'

      - name: Setup and validate Rockstar v2.0.31 Command
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://github.com/RockstarLang/rockstar/releases/download/v2.0.31/rockstar-v2.0.31-linux-x64.tar.gz' --output /tmp/rockstar-command.tar.gz
          echo '3d265c80d9d039ad92524f42951eb546d8b42c680965dfa551210457e399653f  /tmp/rockstar-command.tar.gz' | sha256sum -c -
          mkdir -p /tmp/rockstar-command
          tar -xzf /tmp/rockstar-command.tar.gz -C /tmp/rockstar-command
          runtime="$(find /tmp/rockstar-command -type f -name rockstar -perm -111 | head -n 1)"
          test "$("$runtime" src/Other/Rockstar/command.rock)" = 'balance=130;commands=2'
