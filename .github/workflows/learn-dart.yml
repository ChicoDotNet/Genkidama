name: Learn Dart

on:
  pull_request:
    paths:
      - 'learn/es/dart/**'
      - '.github/workflows/learn-dart.yml'
  push:
    branches:
      - dev
      - main
    paths:
      - 'learn/es/dart/**'
      - '.github/workflows/learn-dart.yml'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter 3.47.0 stable
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Show versions
        shell: bash
        run: |
          flutter --version
          dart --version

      - name: Restore dependencies
        working-directory: learn/es/dart/app
        run: flutter pub get

      - name: Check formatting
        working-directory: learn/es/dart/app
        shell: bash
        run: |
          dart format lib test
          git diff --exit-code -- lib test

      - name: Analyze
        working-directory: learn/es/dart/app
        run: flutter analyze

      - name: Run tests
        working-directory: learn/es/dart/app
        run: flutter test

      - name: Build portable web artifact
        if: matrix.os == 'ubuntu-latest'
        working-directory: learn/es/dart/app
        run: flutter build web --release
