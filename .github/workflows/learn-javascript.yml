name: Learn JavaScript

on:
  pull_request:
    paths:
      - 'learn/es/javascript/**'
      - '.github/workflows/learn-javascript.yml'
  push:
    branches:
      - main
    paths:
      - 'learn/es/javascript/**'
      - '.github/workflows/learn-javascript.yml'

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js 24.18.1 LTS
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.1'
      - name: Show Node.js and npm versions
        run: |
          node --version
          npm --version
      - name: Verify JavaScript course gate
        working-directory: learn/es/javascript/app
        run: npm run verify
      - name: HTTP smoke and security headers
        working-directory: learn/es/javascript/app
        run: |
          npm start >/tmp/kanban-local.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --dump-header /tmp/kanban-local.headers http://127.0.0.1:4173/ >/tmp/kanban-local.html; then break; fi
            sleep 0.25
          done
          grep -F '<h1>Kanban Local</h1>' /tmp/kanban-local.html
          grep -Fi 'content-security-policy:' /tmp/kanban-local.headers
          grep -Fi 'x-content-type-options: nosniff' /tmp/kanban-local.headers
          curl --fail --silent http://127.0.0.1:4173/src/app.js | grep -F 'applyBoardCommand'
          curl --fail --silent --dump-header /tmp/manifest.headers http://127.0.0.1:4173/manifest.webmanifest | grep -F '"display": "standalone"'
          grep -Fi 'content-type: application/manifest+json' /tmp/manifest.headers
          curl --fail --silent http://127.0.0.1:4173/service-worker.js | grep -F 'kanban-local-v2'
