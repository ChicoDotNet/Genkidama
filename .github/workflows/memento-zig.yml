name: Memento Zig

on:
  pull_request:
    branches: [dev]
    paths:
      - "src/Systems/Zig/memento.zig"
      - "src/Systems/Zig/pattern_sweep.zig"
      - ".github/workflows/memento-zig.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-and-aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          ZIG_VERSION="0.16.0"
          ZIG_SHA256="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
          archive="${RUNNER_TEMP}/zig-${ZIG_VERSION}.tar.xz"
          root="${RUNNER_TEMP}/zig-${ZIG_VERSION}"
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o "$archive"
          echo "${ZIG_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$root"
          tar -xJf "$archive" --strip-components=1 -C "$root"
          echo "$root" >> "$GITHUB_PATH"
          "$root/zig" version

      - name: Validate canonical and aggregate
        shell: bash
        run: |
          set -euo pipefail
          canonical="src/Systems/Zig/memento.zig"
          sweep="src/Systems/Zig/pattern_sweep.zig"
          zig fmt --check "$canonical" "$sweep"
          canonical_output="$(zig run "$canonical" 2>&1)"
          test "$canonical_output" = "Zig Memento: passed"
          sweep_output="$(zig run "$sweep" 2>&1)"
          test "$sweep_output" = "Zig pattern sweep: 39/39 examples passed"
