name: Pattern Flyweight Portable

on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/Systems/Objective-C/flyweight.m'
      - 'src/Systems/Zig/flyweight.zig'
      - 'src/Niche/Nim/flyweight.nim'
      - 'src/Web/Dart/flyweight.dart'
      - 'src/Niche/Crystal/flyweight.cr'
      - '.github/workflows/pattern-flyweight-portable.yml'

jobs:
  zig-nim-dart-crystal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.15.2'
      - uses: dart-lang/setup-dart@v1
      - name: Install Nim and Crystal
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y nim crystal
      - name: Validate Zig, Nim, Dart and Crystal Flyweight
        shell: bash
        run: |
          set -euo pipefail
          expected='styles=2;shared=true;text=ABC'
          work="$(mktemp -d)"

          zig fmt --check src/Systems/Zig/flyweight.zig
          zig build-exe src/Systems/Zig/flyweight.zig -O ReleaseSafe -femit-bin="$work/flyweight-zig"
          test "$("$work/flyweight-zig")" = "$expected"

          nim c --hints:off --warnings:on -o:"$work/flyweight-nim" src/Niche/Nim/flyweight.nim
          test "$("$work/flyweight-nim")" = "$expected"

          dart format --output=none --set-exit-if-changed src/Web/Dart/flyweight.dart
          dart analyze --fatal-infos --fatal-warnings src/Web/Dart/flyweight.dart
          test "$(dart run src/Web/Dart/flyweight.dart)" = "$expected"

          crystal tool format --check src/Niche/Crystal/flyweight.cr
          crystal build --error-trace src/Niche/Crystal/flyweight.cr -o "$work/flyweight-crystal"
          test "$("$work/flyweight-crystal")" = "$expected"

  objective-c:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Objective-C Flyweight
        shell: bash
        run: |
          set -euo pipefail
          expected='styles=2;shared=true;text=ABC'
          clang -fobjc-arc -Wall -Wextra -Werror -framework Foundation src/Systems/Objective-C/flyweight.m -o /tmp/flyweight-objective-c
          test "$(/tmp/flyweight-objective-c)" = "$expected"
