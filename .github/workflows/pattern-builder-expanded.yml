name: Pattern Builder Expanded

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/pattern-builder-expanded.yml'
      - 'src/Enterprise/C#/BuilderExample.cs'
      - 'src/Enterprise/Java/BuilderExample.java'
      - 'src/Enterprise/Kotlin/BuilderExample.kt'
      - 'src/Functional/F#/builder.fsx'
      - 'src/Scripting/PHP/builder.php'
      - 'src/Scripting/PythonPY/builder.py'
      - 'src/Scripting/RubyRB/builder.rb'
      - 'src/Scripting/Lua/builder.lua'
      - 'src/Shell/Bash/builder.sh'
      - 'src/Systems/C/builder.c'
      - 'src/Systems/C++/builder.cpp'
      - 'src/Systems/Go/builder.go'
      - 'src/Systems/Rust/builder.rs'
      - 'src/Systems/Swift/builder.swift'
      - 'src/Web/JavaScriptJS/builder.js'
      - 'src/Web/TypeScriptTS/builder.ts'
      - 'wiki/Builder.md'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup lightweight runtimes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y lua5.4 php-cli ruby

      - name: Validate Builder tranche
        shell: bash
        run: |
          set -euo pipefail
          assert_output() {
            local output="$1"
            grep -Fq '# Service status' <<<"$output"
            grep -Fq '<h1>Service status</h1>' <<<"$output"
            grep -Fq '99.95%' <<<"$output"
          }

          work="$(mktemp -d)"
          dotnet new console --framework net10.0 --output "$work/csharp" --force >/dev/null
          cp 'src/Enterprise/C#/BuilderExample.cs' "$work/csharp/Program.cs"
          assert_output "$(dotnet run --project "$work/csharp" --configuration Release)"

          python -m py_compile src/Scripting/PythonPY/builder.py
          assert_output "$(python src/Scripting/PythonPY/builder.py)"

          node --check src/Web/JavaScriptJS/builder.js
          assert_output "$(node src/Web/JavaScriptJS/builder.js)"

          npx --yes typescript@6.0.3 tsc src/Web/TypeScriptTS/builder.ts --strict --target ES2024 --module commonjs --outDir "$work/typescript"
          assert_output "$(node "$work/typescript/builder.js")"

          test -z "$(gofmt -d src/Systems/Go/builder.go)"
          go vet src/Systems/Go/builder.go
          assert_output "$(go run src/Systems/Go/builder.go)"

          javac -Xlint:all -Werror -d "$work/java" src/Enterprise/Java/BuilderExample.java
          assert_output "$(java -cp "$work/java" BuilderExample)"

          rustfmt --check src/Systems/Rust/builder.rs
          rustc -D warnings src/Systems/Rust/builder.rs -o "$work/builder-rust"
          assert_output "$("$work/builder-rust")"

          g++ -std=c++20 -Wall -Wextra -Werror 'src/Systems/C++/builder.cpp' -o "$work/builder-cpp"
          assert_output "$("$work/builder-cpp")"

          gcc -std=c17 -Wall -Wextra -Werror src/Systems/C/builder.c -o "$work/builder-c"
          assert_output "$("$work/builder-c")"

          ruby -cw src/Scripting/RubyRB/builder.rb
          assert_output "$(ruby src/Scripting/RubyRB/builder.rb)"

          php -l src/Scripting/PHP/builder.php
          assert_output "$(php src/Scripting/PHP/builder.php)"

          dotnet fsi src/Functional/F#/builder.fsx > "$work/fsharp.out"
          assert_output "$(cat "$work/fsharp.out")"

          lua5.4 src/Scripting/Lua/builder.lua > "$work/lua.out"
          assert_output "$(cat "$work/lua.out")"

          bash -n src/Shell/Bash/builder.sh
          assert_output "$(bash src/Shell/Bash/builder.sh)"

          command -v kotlinc >/dev/null
          kotlinc src/Enterprise/Kotlin/BuilderExample.kt -include-runtime -d "$work/builder-kotlin.jar"
          assert_output "$(java -jar "$work/builder-kotlin.jar")"

          command -v swiftc >/dev/null
          swiftc src/Systems/Swift/builder.swift -o "$work/builder-swift"
          assert_output "$("$work/builder-swift")"
