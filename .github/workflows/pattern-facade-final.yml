name: Pattern Facade Final

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/pattern-facade-final.yml'
      - 'src/Niche/Crystal/facade.cr'
      - 'src/Historical/Cobol/facade.cbl'
      - 'src/Shell/VBA/FacadeExample.bas'
      - 'src/Niche/GDScript/facade.gd'
      - 'src/LowLevel/Assembly/facade.asm'
      - 'src/Enterprise/Delphi/FacadeExample.pas'
      - 'src/Other/MicroPython/facade.py'
      - 'src/Other/Rockstar/facade.rock'

jobs:
  portable-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crystal-lang/install-crystal@v1
      - name: Install toolchains
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gnucobol3 nasm
      - name: Validate Crystal, COBOL and Assembly Facade
        shell: bash
        run: |
          set -euo pipefail
          expected='checkout=auth(alice)>reserve(SKU-42)>charge(499)'
          work="$(mktemp -d)"

          crystal tool format src/Niche/Crystal/facade.cr
          test -z "$(git status --short -- src/Niche/Crystal/facade.cr)"
          crystal build --error-on-warnings src/Niche/Crystal/facade.cr -o "$work/facade-crystal"
          test "$("$work/facade-crystal")" = "$expected"

          cobc -x -Wall src/Historical/Cobol/facade.cbl -o "$work/facade-cobol"
          test "$("$work/facade-cobol" | tr -d '\r')" = "$expected"

          nasm -f elf64 -Wall src/LowLevel/Assembly/facade.asm -o "$work/facade-assembly.o"
          ld "$work/facade-assembly.o" -o "$work/facade-assembly"
          test "$("$work/facade-assembly")" = "$expected"

  gdscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip' --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
      - name: Validate GDScript Facade
        shell: bash
        run: |
          set -euo pipefail
          output="$(godot --headless --script src/Niche/GDScript/facade.gd 2>&1)"
          grep -Fxq 'checkout=auth(alice)>reserve(SKU-42)>charge(499)' <<<"$output"

  micropython:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build MicroPython 1.28.0 Unix port
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev pkg-config
          git clone --depth 1 --branch v1.28.0 --recurse-submodules https://github.com/micropython/micropython.git /tmp/micropython
          make -C /tmp/micropython/mpy-cross -j2
          make -C /tmp/micropython/ports/unix -j2
      - name: Validate MicroPython Facade
        shell: bash
        run: |
          set -euo pipefail
          test "$(/tmp/micropython/ports/unix/build-standard/micropython src/Other/MicroPython/facade.py)" = 'checkout=auth(alice)>reserve(SKU-42)>charge(499)'

  rockstar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rockstar v2.0.31
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://github.com/RockstarLang/rockstar/releases/download/v2.0.31/rockstar-v2.0.31-linux-x64.tar.gz' --output /tmp/rockstar.tar.gz
          echo '3d265c80d9d039ad92524f42951eb546d8b42c680965dfa551210457e399653f  /tmp/rockstar.tar.gz' | sha256sum -c -
          mkdir -p /tmp/rockstar
          tar -xzf /tmp/rockstar.tar.gz -C /tmp/rockstar
          echo "ROCKSTAR=$(find /tmp/rockstar -type f -name rockstar -perm -111 | head -n 1)" >> "$GITHUB_ENV"
      - name: Validate Rockstar Facade
        shell: bash
        run: |
          set -euo pipefail
          output="$("$ROCKSTAR" src/Other/Rockstar/facade.rock 2>&1)"
          grep -Fxq 'checkout=auth(alice)>reserve(SKU-42)>charge(499)' <<<"$output"

  proprietary-source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate VBA and Delphi Facade source contracts
        shell: python
        run: |
          from pathlib import Path
          import re

          def require(text, pattern, label):
              if re.search(pattern, text, flags=re.IGNORECASE | re.MULTILINE | re.DOTALL) is None:
                  raise SystemExit(f"Missing source contract: {label}")

          vba = Path('src/Shell/VBA/FacadeExample.bas').read_text(encoding='utf-8')
          for pattern, label in [
              (r'^Option Explicit$', 'VBA Option Explicit'),
              (r'Function\s+Authenticate', 'VBA auth subsystem'),
              (r'Function\s+ReserveInventory', 'VBA inventory subsystem'),
              (r'Function\s+Charge', 'VBA billing subsystem'),
              (r'Function\s+CheckoutFacade.*Authenticate\(user\).*ReserveInventory\(sku\).*Charge\(cents\)', 'VBA facade coordination'),
          ]:
              require(vba, pattern, label)

          delphi = Path('src/Enterprise/Delphi/FacadeExample.pas').read_text(encoding='utf-8')
          for pattern, label in [
              (r'TAuthService\s*=\s*class', 'Delphi auth subsystem'),
              (r'TInventoryService\s*=\s*class', 'Delphi inventory subsystem'),
              (r'TBillingService\s*=\s*class', 'Delphi billing subsystem'),
              (r'TCheckoutFacade\s*=\s*class.*function\s+Checkout', 'Delphi facade contract'),
              (r'FAuth\.Authenticate\(UserName\).*FInventory\.Reserve\(Sku\).*FBilling\.Charge\(Cents\)', 'Delphi facade coordination'),
          ]:
              require(delphi, pattern, label)

          print('VBA/Delphi Facade source contracts: OK')
