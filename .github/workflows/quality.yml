name: Quality

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.14.7
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'
          cache: pip
          cache-dependency-path: learn/_meta/requirements.txt

      - name: Run Quality contract
        run: eng/ci/run-quality --telemetry-file artifacts/ci/quality.jsonl

      - name: Upload Quality telemetry
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-ci-telemetry-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/quality.jsonl
          if-no-files-found: warn
          retention-days: 14

  cache-hygiene-plan:
    name: Cache hygiene / Dry run
    needs: quality
    if: always() && github.event_name == 'pull_request' && needs.quality.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Plan cache hygiene
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 eng/ci/cache_hygiene.py --scope quality --scope jvm --scope go

  cache-hygiene-quality:
    name: Cache hygiene / Quality
    needs: quality
    if: always() && github.event_name != 'pull_request' && needs.quality.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
      pull-requests: read
    concurrency:
      group: genkidama-cache-hygiene
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply Quality cache hygiene
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 eng/ci/cache_hygiene.py --scope quality --apply
