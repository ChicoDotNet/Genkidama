name: Learn TypeScript

on:
  pull_request:
    paths:
      - 'learn/es/typescript/**'
      - '.github/workflows/learn-typescript.yml'
  push:
    branches:
      - main
    paths:
      - 'learn/es/typescript/**'
      - '.github/workflows/learn-typescript.yml'

permissions:
  contents: read

jobs:
  verify-typescript-course:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: learn/es/typescript/app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Report toolchain
        run: |
          node --version
          npx tsc --version

      - name: Verify FreelanceDesk
        run: npm run verify

      - name: Smoke HTTP application
        shell: bash
        run: |
          set -euo pipefail
          PORT=3100 node dist/src/server/index.js > /tmp/freelancedesk.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if node -e "fetch('http://127.0.0.1:3100/').then(r=>{if(!r.ok)process.exit(1)})"; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/freelancedesk.log >&2
          exit 1
