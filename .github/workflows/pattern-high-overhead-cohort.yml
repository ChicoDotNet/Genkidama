name: Pattern High-Overhead Cohort Sweep

on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/Functional/Haskell/PatternSweep.hs'
      - 'src/Web/Dart/pattern_sweep.dart'
      - 'src/Niche/Crystal/pattern_sweep.cr'
      - 'src/Systems/Zig/pattern_sweep.zig'
      - 'src/DataScience/Julia/pattern_sweep.jl'
      - 'src/Systems/Go/pattern_sweep.go'
      - 'src/Systems/Objective-C/pattern_sweep.m'
      - 'docs/pattern-sweeps/high-overhead-cohort.md'
      - '.github/workflows/pattern-high-overhead-cohort.yml'

jobs:
  haskell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start setup timer
        shell: bash
        run: echo "SETUP_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Set up Haskell
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ghc
      - name: Mark validation start
        shell: bash
        run: |
          now="$(date +%s)"
          echo "SETUP_SECONDS=$((now - SETUP_STARTED))" >> "$GITHUB_ENV"
          echo "VALIDATION_STARTED=$now" >> "$GITHUB_ENV"
      - name: Validate 39 Haskell pattern cells
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          ghc -Wall -Werror -O0 -odir "$work" -hidir "$work" src/Functional/Haskell/PatternSweep.hs -o "$work/pattern-sweep-haskell"
          output="$("$work/pattern-sweep-haskell")"
          test "$output" = 'Haskell pattern sweep: 39/39 examples passed'
      - name: Record Haskell timing
        if: always()
        shell: bash
        run: |
          now="$(date +%s)"
          validation="$((now - VALIDATION_STARTED))"
          total="$((SETUP_SECONDS + validation))"
          printf '### Haskell cohort timing\n- cells: 39\n- setup_seconds: %s\n- validation_seconds: %s\n- total_seconds: %s\n' "$SETUP_SECONDS" "$validation" "$total" >> "$GITHUB_STEP_SUMMARY"

  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start setup timer
        shell: bash
        run: echo "SETUP_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
      - name: Mark validation start
        shell: bash
        run: |
          now="$(date +%s)"
          echo "SETUP_SECONDS=$((now - SETUP_STARTED))" >> "$GITHUB_ENV"
          echo "VALIDATION_STARTED=$now" >> "$GITHUB_ENV"
      - name: Validate 39 Dart pattern cells
        shell: bash
        run: |
          set -euo pipefail
          file='src/Web/Dart/pattern_sweep.dart'
          dart format --output=none --set-exit-if-changed "$file"
          dart analyze --fatal-infos --fatal-warnings "$file"
          output="$(dart run "$file")"
          test "$output" = 'Dart pattern sweep: 39/39 examples passed'
      - name: Record Dart timing
        if: always()
        shell: bash
        run: |
          now="$(date +%s)"; validation="$((now - VALIDATION_STARTED))"; total="$((SETUP_SECONDS + validation))"
          printf '### Dart cohort timing\n- cells: 39\n- setup_seconds: %s\n- validation_seconds: %s\n- total_seconds: %s\n' "$SETUP_SECONDS" "$validation" "$total" >> "$GITHUB_STEP_SUMMARY"

  crystal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start setup timer
        shell: bash
        run: echo "SETUP_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Set up Crystal
        uses: crystal-lang/install-crystal@v1
      - name: Mark validation start
        shell: bash
        run: |
          now="$(date +%s)"
          echo "SETUP_SECONDS=$((now - SETUP_STARTED))" >> "$GITHUB_ENV"
          echo "VALIDATION_STARTED=$now" >> "$GITHUB_ENV"
      - name: Validate 39 Crystal pattern cells
        shell: bash
        run: |
          set -euo pipefail
          file='src/Niche/Crystal/pattern_sweep.cr'
          work="$(mktemp -d)"
          crystal tool format "$file"
          test -z "$(git status --short -- "$file")"
          crystal build --error-on-warnings "$file" -o "$work/pattern-sweep-crystal"
          output="$("$work/pattern-sweep-crystal")"
          test "$output" = 'Crystal pattern sweep: 39/39 examples passed'
      - name: Record Crystal timing
        if: always()
        shell: bash
        run: |
          now="$(date +%s)"; validation="$((now - VALIDATION_STARTED))"; total="$((SETUP_SECONDS + validation))"
          printf '### Crystal cohort timing\n- cells: 39\n- setup_seconds: %s\n- validation_seconds: %s\n- total_seconds: %s\n' "$SETUP_SECONDS" "$validation" "$total" >> "$GITHUB_STEP_SUMMARY"

  zig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start setup timer
        shell: bash
        run: echo "SETUP_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Set up Zig
        uses: mlugg/setup-zig@v2
      - name: Mark validation start
        shell: bash
        run: |
          now="$(date +%s)"
          echo "SETUP_SECONDS=$((now - SETUP_STARTED))" >> "$GITHUB_ENV"
          echo "VALIDATION_STARTED=$now" >> "$GITHUB_ENV"
      - name: Validate 39 Zig pattern cells
        shell: bash
        run: |
          set -euo pipefail
          file='src/Systems/Zig/pattern_sweep.zig'
          zig fmt --check "$file"
          output="$(zig run "$file" 2>&1)"
          test "$output" = 'Zig pattern sweep: 39/39 examples passed'
      - name: Record Zig timing
        if: always()
        shell: bash
        run: |
          now="$(date +%s)"; validation="$((now - VALIDATION_STARTED))"; total="$((SETUP_SECONDS + validation))"
          printf '### Zig cohort timing\n- cells: 39\n- setup_seconds: %s\n- validation_seconds: %s\n- total_seconds: %s\n' "$SETUP_SECONDS" "$validation" "$total" >> "$GITHUB_STEP_SUMMARY"

  julia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start setup timer
        shell: bash
        run: echo "SETUP_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Mark validation start
        shell: bash
        run: |
          now="$(date +%s)"
          echo "SETUP_SECONDS=$((now - SETUP_STARTED))" >> "$GITHUB_ENV"
          echo "VALIDATION_STARTED=$now" >> "$GITHUB_ENV"
      - name: Validate 39 Julia pattern cells
        shell: bash
        run: |
          set -euo pipefail
          output="$(julia --startup-file=no --check-bounds=yes src/DataScience/Julia/pattern_sweep.jl)"
          test "$output" = 'Julia pattern sweep: 39/39 examples passed'
      - name: Record Julia timing
        if: always()
        shell: bash
        run: |
          now="$(date +%s)"; validation="$((now - VALIDATION_STARTED))"; total="$((SETUP_SECONDS + validation))"
          printf '### Julia cohort timing\n- cells: 39\n- setup_seconds: %s\n- validation_seconds: %s\n- total_seconds: %s\n' "$SETUP_SECONDS" "$validation" "$total" >> "$GITHUB_STEP_SUMMARY"

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start setup timer
        shell: bash
        run: echo "SETUP_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Mark validation start
        shell: bash
        run: |
          now="$(date +%s)"
          echo "SETUP_SECONDS=$((now - SETUP_STARTED))" >> "$GITHUB_ENV"
          echo "VALIDATION_STARTED=$now" >> "$GITHUB_ENV"
      - name: Validate 39 Go pattern cells
        shell: bash
        run: |
          set -euo pipefail
          file='src/Systems/Go/pattern_sweep.go'
          test -z "$(gofmt -d "$file")"
          go vet "$file"
          output="$(go run "$file")"
          test "$output" = 'Go pattern sweep: 39/39 examples passed'
      - name: Record Go timing
        if: always()
        shell: bash
        run: |
          now="$(date +%s)"; validation="$((now - VALIDATION_STARTED))"; total="$((SETUP_SECONDS + validation))"
          printf '### Go cohort timing\n- cells: 39\n- setup_seconds: %s\n- validation_seconds: %s\n- total_seconds: %s\n' "$SETUP_SECONDS" "$validation" "$total" >> "$GITHUB_STEP_SUMMARY"

  objective-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start setup timer
        shell: bash
        run: echo "SETUP_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Set up GNUstep Objective-C runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gobjc libobjc-13-dev libgnustep-base-dev
      - name: Mark validation start
        shell: bash
        run: |
          now="$(date +%s)"
          echo "SETUP_SECONDS=$((now - SETUP_STARTED))" >> "$GITHUB_ENV"
          echo "VALIDATION_STARTED=$now" >> "$GITHUB_ENV"
      - name: Validate 39 Objective-C pattern cells
        shell: bash
        run: |
          set -euo pipefail
          file='src/Systems/Objective-C/pattern_sweep.m'
          work="$(mktemp -d)"
          objc_headers="$(gcc -print-file-name=include)"
          objc_library="$(gcc -print-file-name=libobjc.so)"
          test -f "$objc_library"
          objc_libdir="$(dirname "$objc_library")"
          clang $(gnustep-config --objc-flags) -Wall -Wextra -Werror -I"$objc_headers" \
            "$file" -o "$work/pattern-sweep-objc" -L"$objc_libdir" $(gnustep-config --base-libs)
          output="$("$work/pattern-sweep-objc")"
          test "$output" = 'Objective-C pattern sweep: 39/39 examples passed'
      - name: Record Objective-C timing
        if: always()
        shell: bash
        run: |
          now="$(date +%s)"; validation="$((now - VALIDATION_STARTED))"; total="$((SETUP_SECONDS + validation))"
          printf '### Objective-C cohort timing\n- cells: 39\n- setup_seconds: %s\n- validation_seconds: %s\n- total_seconds: %s\n' "$SETUP_SECONDS" "$validation" "$total" >> "$GITHUB_STEP_SUMMARY"
