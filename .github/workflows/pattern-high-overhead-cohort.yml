name: Pattern High-Overhead Cohort Sweep

on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/Functional/Haskell/PatternSweep.hs'
      - 'src/Web/Dart/pattern_sweep.dart'
      - 'src/Niche/Crystal/pattern_sweep.cr'
      - 'src/Systems/Zig/pattern_sweep.zig'
      - 'src/DataScience/Julia/pattern_sweep.jl'
      - 'src/Systems/Go/pattern_sweep.go'
      - 'src/Systems/Objective-C/pattern_sweep.m'
      - 'docs/pattern-sweeps/high-overhead-cohort.md'
      - '.github/workflows/pattern-high-overhead-cohort.yml'

permissions:
  contents: read

jobs:
  haskell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start setup timer
        run: echo "SETUP_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Set up latest stable Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: latest
          cabal-update: false
      - name: Mark validation start
        shell: bash
        run: |
          now="$(date +%s)"
          echo "SETUP_SECONDS=$((now - SETUP_STARTED))" >> "$GITHUB_ENV"
          echo "VALIDATION_STARTED=$now" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_VERSION=GHC $(ghc --numeric-version)" >> "$GITHUB_ENV"
      - name: Validate 39 Haskell pattern cells
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          ghc -Wall -Werror -O0 -odir "$work" -hidir "$work" src/Functional/Haskell/PatternSweep.hs -o "$work/pattern-sweep-haskell"
          test "$("$work/pattern-sweep-haskell")" = 'Haskell pattern sweep: 39/39 examples passed'
      - name: Record Haskell timing
        if: always()
        shell: bash
        run: |
          now="$(date +%s)"; validation="$((now - VALIDATION_STARTED))"; total="$((SETUP_SECONDS + validation))"
          printf '### Haskell cohort timing\n- cells: 39\n- toolchain: %s\n- setup_seconds: %s\n- validation_seconds: %s\n- total_seconds: %s\n' "$TOOLCHAIN_VERSION" "$SETUP_SECONDS" "$validation" "$total" >> "$GITHUB_STEP_SUMMARY"

  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start setup timer
        run: echo "SETUP_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Set up latest stable Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Mark validation start
        shell: bash
        run: |
          now="$(date +%s)"
          echo "SETUP_SECONDS=$((now - SETUP_STARTED))" >> "$GITHUB_ENV"
          echo "VALIDATION_STARTED=$now" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_VERSION=$(dart --version 2>&1)" >> "$GITHUB_ENV"
      - name: Validate 39 Dart pattern cells
        shell: bash
        run: |
          set -euo pipefail
          file='src/Web/Dart/pattern_sweep.dart'
          dart format --output=none --set-exit-if-changed "$file"
          dart analyze --fatal-infos --fatal-warnings "$file"
          test "$(dart run "$file")" = 'Dart pattern sweep: 39/39 examples passed'
      - name: Record Dart timing
        if: always()
        shell: bash
        run: |
          now="$(date +%s)"; validation="$((now - VALIDATION_STARTED))"; total="$((SETUP_SECONDS + validation))"
          printf '### Dart cohort timing\n- cells: 39\n- toolchain: %s\n- setup_seconds: %s\n- validation_seconds: %s\n- total_seconds: %s\n' "$TOOLCHAIN_VERSION" "$SETUP_SECONDS" "$validation" "$total" >> "$GITHUB_STEP_SUMMARY"

  crystal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start setup timer
        run: echo "SETUP_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Set up latest stable Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest
      - name: Mark validation start
        shell: bash
        run: |
          now="$(date +%s)"
          echo "SETUP_SECONDS=$((now - SETUP_STARTED))" >> "$GITHUB_ENV"
          echo "VALIDATION_STARTED=$now" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_VERSION=$(crystal --version | head -n1)" >> "$GITHUB_ENV"
      - name: Validate 39 Crystal pattern cells
        shell: bash
        run: |
          set -euo pipefail
          file='src/Niche/Crystal/pattern_sweep.cr'
          work="$(mktemp -d)"
          crystal tool format --check "$file"
          crystal build --error-on-warnings "$file" -o "$work/pattern-sweep-crystal"
          test "$("$work/pattern-sweep-crystal")" = 'Crystal pattern sweep: 39/39 examples passed'
      - name: Record Crystal timing
        if: always()
        shell: bash
        run: |
          now="$(date +%s)"; validation="$((now - VALIDATION_STARTED))"; total="$((SETUP_SECONDS + validation))"
          printf '### Crystal cohort timing\n- cells: 39\n- toolchain: %s\n- setup_seconds: %s\n- validation_seconds: %s\n- total_seconds: %s\n' "$TOOLCHAIN_VERSION" "$SETUP_SECONDS" "$validation" "$total" >> "$GITHUB_STEP_SUMMARY"

  zig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start setup timer
        run: echo "SETUP_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Set up latest stable Zig from official release index
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, tarfile, urllib.request
          index = json.load(urllib.request.urlopen('https://ziglang.org/download/index.json'))
          stable = max(
              (v for v in index if re.fullmatch(r'\d+\.\d+\.\d+', v)),
              key=lambda v: tuple(map(int, v.split('.')))
          )
          package = index[stable]['x86_64-linux']
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'zig.tar.xz'
          urllib.request.urlretrieve(package['tarball'], archive)
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          if digest != package['shasum']:
              raise SystemExit(f'Zig SHA-256 mismatch: {digest} != {package["shasum"]}')
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'zig-stable'
          target.mkdir(exist_ok=True)
          with tarfile.open(archive, 'r:xz') as tar:
              tar.extractall(target, filter='data')
          root = next(target.iterdir())
          with open(os.environ['GITHUB_PATH'], 'a') as path:
              path.write(str(root) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'ZIG_STABLE_VERSION={stable}\n')
          print(f'Installed Zig {stable}')
          PY
      - name: Mark validation start
        shell: bash
        run: |
          now="$(date +%s)"
          echo "SETUP_SECONDS=$((now - SETUP_STARTED))" >> "$GITHUB_ENV"
          echo "VALIDATION_STARTED=$now" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_VERSION=Zig $(zig version)" >> "$GITHUB_ENV"
          test "$(zig version)" = "$ZIG_STABLE_VERSION"
      - name: Validate 39 Zig pattern cells
        shell: bash
        run: |
          set -euo pipefail
          file='src/Systems/Zig/pattern_sweep.zig'
          zig fmt --check "$file"
          test "$(zig run "$file" 2>&1)" = 'Zig pattern sweep: 39/39 examples passed'
      - name: Record Zig timing
        if: always()
        shell: bash
        run: |
          now="$(date +%s)"; validation="$((now - VALIDATION_STARTED))"; total="$((SETUP_SECONDS + validation))"
          printf '### Zig cohort timing\n- cells: 39\n- toolchain: %s\n- setup_seconds: %s\n- validation_seconds: %s\n- total_seconds: %s\n' "$TOOLCHAIN_VERSION" "$SETUP_SECONDS" "$validation" "$total" >> "$GITHUB_STEP_SUMMARY"

  julia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start setup timer
        run: echo "SETUP_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Set up latest stable Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Mark validation start
        shell: bash
        run: |
          now="$(date +%s)"
          echo "SETUP_SECONDS=$((now - SETUP_STARTED))" >> "$GITHUB_ENV"
          echo "VALIDATION_STARTED=$now" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_VERSION=$(julia --version)" >> "$GITHUB_ENV"
      - name: Validate 39 Julia pattern cells
        shell: bash
        run: |
          set -euo pipefail
          test "$(julia --startup-file=no --check-bounds=yes src/DataScience/Julia/pattern_sweep.jl)" = 'Julia pattern sweep: 39/39 examples passed'
      - name: Record Julia timing
        if: always()
        shell: bash
        run: |
          now="$(date +%s)"; validation="$((now - VALIDATION_STARTED))"; total="$((SETUP_SECONDS + validation))"
          printf '### Julia cohort timing\n- cells: 39\n- toolchain: %s\n- setup_seconds: %s\n- validation_seconds: %s\n- total_seconds: %s\n' "$TOOLCHAIN_VERSION" "$SETUP_SECONDS" "$validation" "$total" >> "$GITHUB_STEP_SUMMARY"

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start setup timer
        run: echo "SETUP_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Set up latest stable Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Mark validation start
        shell: bash
        run: |
          now="$(date +%s)"
          echo "SETUP_SECONDS=$((now - SETUP_STARTED))" >> "$GITHUB_ENV"
          echo "VALIDATION_STARTED=$now" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_VERSION=$(go version)" >> "$GITHUB_ENV"
      - name: Validate 39 Go pattern cells
        shell: bash
        run: |
          set -euo pipefail
          file='src/Systems/Go/pattern_sweep.go'
          test -z "$(gofmt -d "$file")"
          go vet "$file"
          test "$(go run "$file")" = 'Go pattern sweep: 39/39 examples passed'
      - name: Record Go timing
        if: always()
        shell: bash
        run: |
          now="$(date +%s)"; validation="$((now - VALIDATION_STARTED))"; total="$((SETUP_SECONDS + validation))"
          printf '### Go cohort timing\n- cells: 39\n- toolchain: %s\n- setup_seconds: %s\n- validation_seconds: %s\n- total_seconds: %s\n' "$TOOLCHAIN_VERSION" "$SETUP_SECONDS" "$validation" "$total" >> "$GITHUB_STEP_SUMMARY"

  objective-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start setup timer
        run: echo "SETUP_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Set up latest distro-stable Objective-C toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang gobjc libgnustep-base-dev
      - name: Mark validation start
        shell: bash
        run: |
          now="$(date +%s)"
          echo "SETUP_SECONDS=$((now - SETUP_STARTED))" >> "$GITHUB_ENV"
          echo "VALIDATION_STARTED=$now" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_VERSION=$(clang --version | head -n1)" >> "$GITHUB_ENV"
      - name: Validate 39 Objective-C pattern cells
        shell: bash
        run: |
          set -euo pipefail
          file='src/Systems/Objective-C/pattern_sweep.m'
          work="$(mktemp -d)"
          objc_headers="$(gcc -print-file-name=include)"
          objc_library="$(gcc -print-file-name=libobjc.so)"
          test -f "$objc_library"
          objc_libdir="$(dirname "$objc_library")"
          clang $(gnustep-config --objc-flags) -Wall -Wextra -Werror -I"$objc_headers" \
            "$file" -o "$work/pattern-sweep-objc" -L"$objc_libdir" $(gnustep-config --base-libs)
          test "$("$work/pattern-sweep-objc")" = 'Objective-C pattern sweep: 39/39 examples passed'
      - name: Record Objective-C timing
        if: always()
        shell: bash
        run: |
          now="$(date +%s)"; validation="$((now - VALIDATION_STARTED))"; total="$((SETUP_SECONDS + validation))"
          printf '### Objective-C cohort timing\n- cells: 39\n- toolchain: %s\n- setup_seconds: %s\n- validation_seconds: %s\n- total_seconds: %s\n' "$TOOLCHAIN_VERSION" "$SETUP_SECONDS" "$validation" "$total" >> "$GITHUB_STEP_SUMMARY"
