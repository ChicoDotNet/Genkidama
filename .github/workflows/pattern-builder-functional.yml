name: Pattern Builder Functional

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/pattern-builder-functional.yml'
      - 'src/Functional/Clojure/builder.clj'
      - 'src/Functional/Elixir/builder.exs'
      - 'src/Functional/Erlang/builder.erl'
      - 'src/Functional/F#/builder.fsx'
      - 'src/Functional/Haskell/Builder.hs'
      - 'src/Functional/Scala/Builder.scala'
      - 'src/Scripting/Perl/builder.pl'
      - 'src/Shell/PowerShell/builder.ps1'
      - 'src/DataScience/R/builder.R'
      - 'src/DataScience/Octave/builder.m'
      - 'src/Historical/Pascal/builder.pas'
      - 'src/Niche/Prolog/builder.pl'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28.5.0.4'
          elixir-version: '1.19.1'

      - name: Setup runtimes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ghc scala clojure perl powershell r-base octave fp-compiler swi-prolog-nox

      - name: Validate F# Builder
        shell: bash
        run: |
          set -euo pipefail
          output="$(dotnet fsi 'src/Functional/F#/builder.fsx')"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Haskell Builder
        shell: bash
        run: |
          set -euo pipefail
          output="$(runghc -Wall -Werror src/Functional/Haskell/Builder.hs)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Scala Builder
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          scalac -deprecation -feature -unchecked src/Functional/Scala/Builder.scala -d "$out"
          output="$(scala -cp "$out" Builder)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Perl Builder
        shell: bash
        run: |
          set -euo pipefail
          perl -c src/Scripting/Perl/builder.pl
          output="$(perl src/Scripting/Perl/builder.pl)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate PowerShell Builder
        shell: bash
        run: |
          set -euo pipefail
          output="$(pwsh -NoLogo -NoProfile -NonInteractive -File src/Shell/PowerShell/builder.ps1)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate R Builder
        shell: bash
        run: |
          set -euo pipefail
          output="$(Rscript --vanilla src/DataScience/R/builder.R)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate GNU Octave Builder
        shell: bash
        run: |
          set -euo pipefail
          output="$(octave --no-gui --quiet --eval "addpath('src/DataScience/Octave'); builder();")"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Pascal Builder
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          fpc -Mobjfpc -O2 -Sew -FE"$out" src/Historical/Pascal/builder.pas >/dev/null
          output="$("$out/builder")"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Erlang Builder
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          erlc -Werror -o "$out" src/Functional/Erlang/builder.erl
          output="$(erl -noshell -pa "$out" -eval 'builder:main(), halt().')"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Elixir Builder
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          elixirc --warnings-as-errors -o "$out" src/Functional/Elixir/builder.exs >/dev/null
          output="$(elixir src/Functional/Elixir/builder.exs)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Clojure Builder
        shell: bash
        run: |
          set -euo pipefail
          output="$(clojure src/Functional/Clojure/builder.clj)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Prolog Builder
        shell: bash
        run: |
          set -euo pipefail
          output="$(swipl -q -s src/Niche/Prolog/builder.pl -g run -t halt)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"
