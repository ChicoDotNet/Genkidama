name: Pattern Command MATLAB

on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/DataScience/MATLAB/command.m'
      - 'wiki/Command.md'
      - '.github/workflows/pattern-command-matlab.yml'

jobs:
  matlab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Mark MATLAB setup start
        shell: bash
        run: date +%s > "$RUNNER_TEMP/matlab-setup-start"

      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: latest

      - name: Record setup timing
        shell: bash
        run: |
          set -euo pipefail
          start="$(cat "$RUNNER_TEMP/matlab-setup-start")"
          now="$(date +%s)"
          echo "$((now - start))" > "$RUNNER_TEMP/matlab-setup-seconds"
          echo "$now" > "$RUNNER_TEMP/matlab-validation-start"

      - name: Validate MATLAB Command behavior
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            addpath('src/DataScience/MATLAB');
            result = command;
            assert(result.queue == "deposit(50)>withdraw(20)");
            assert(result.executed == "deposit>withdraw");
            assert(result.balance == 130);
            assert(result.undone == "withdraw(20)");
            assert(result.balanceAfterUndo == 150);
            output = evalc('command');
            disp(output);
            assert(contains(output, "queued=deposit(50)>withdraw(20);executed=deposit>withdraw;balance=130;undo=withdraw(20);balance_after_undo=150"));

      - name: Record MATLAB timing telemetry
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          setup_start="$(cat "$RUNNER_TEMP/matlab-setup-start")"
          validation_start="$(cat "$RUNNER_TEMP/matlab-validation-start")"
          now="$(date +%s)"
          setup_seconds="$(cat "$RUNNER_TEMP/matlab-setup-seconds")"
          validation_seconds="$((now - validation_start))"
          total_seconds="$((now - setup_start))"
          {
            echo '### MATLAB target timing'
            echo
            echo "- setup_seconds=$setup_seconds"
            echo "- validation_seconds=$validation_seconds"
            echo "- total_seconds=$total_seconds"
          } >> "$GITHUB_STEP_SUMMARY"
