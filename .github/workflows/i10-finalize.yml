name: I10 Finalize Cleanup

on:
  push:
    branches:
      - ci/i10-workflow-debt-purge
    paths:
      - .github/workflows/i10-finalize.yml

permissions:
  contents: write

concurrency:
  group: i10-finalize-cleanup
  cancel-in-progress: false

jobs:
  finalize:
    name: Purge legacy workflow topology
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v7
        with:
          ref: ci/i10-workflow-debt-purge
          fetch-depth: 0
          persist-credentials: true

      - name: Purge legacy workflows and install permanent guardrail
        shell: bash
        run: |
          set -euo pipefail

          find .github/workflows -maxdepth 1 -type f \
            ! -name 'ci.yml' \
            ! -name 'quality.yml' \
            ! -name 'polyglot.yml' \
            ! -name 'i10-finalize.yml' \
            -print0 | xargs -0 -r git rm --

          cat > eng/ci/workflow_debt.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import json
          import sys
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[2]
          WORKFLOW_DIR = ROOT / ".github" / "workflows"
          ALLOWED_WORKFLOWS = frozenset({"ci.yml", "quality.yml", "polyglot.yml"})


          class WorkflowInventoryError(RuntimeError):
              """Raised when the consolidated workflow inventory drifts."""


          def actual_workflows() -> set[str]:
              return {
                  path.relative_to(WORKFLOW_DIR).as_posix()
                  for path in WORKFLOW_DIR.rglob("*")
                  if path.is_file()
              }


          def summary() -> dict[str, object]:
              actual = actual_workflows()
              return {
                  "allowed_workflow_count": len(ALLOWED_WORKFLOWS),
                  "workflow_count": len(actual),
                  "workflows": sorted(actual),
                  "unexpected": sorted(actual - ALLOWED_WORKFLOWS),
                  "missing": sorted(ALLOWED_WORKFLOWS - actual),
              }


          def validate() -> dict[str, object]:
              stats = summary()
              unexpected = stats["unexpected"]
              missing = stats["missing"]
              if unexpected or missing:
                  raise WorkflowInventoryError(
                      f"workflow inventory drift: unexpected={unexpected}, missing={missing}"
                  )
              return {**stats, "status": "consolidated"}


          def main(argv: list[str] | None = None) -> int:
              args = list(sys.argv[1:] if argv is None else argv)
              command = args[0] if args else "validate"
              if len(args) > 1 or command not in {"summary", "validate"}:
                  raise WorkflowInventoryError("usage: workflow_debt.py [summary|validate]")

              payload = validate() if command == "validate" else summary()
              print(json.dumps(payload, sort_keys=True))
              return 0


          if __name__ == "__main__":
              try:
                  raise SystemExit(main())
              except WorkflowInventoryError as exc:
                  print(f"workflow-inventory: {exc}", file=sys.stderr)
                  raise SystemExit(1)
          PY
          chmod +x eng/ci/workflow_debt.py

          cat > eng/ci/tests/test_workflow_debt.py <<'PY'
          from __future__ import annotations

          import sys
          import unittest
          from pathlib import Path
          from unittest import mock

          CI_DIR = Path(__file__).resolve().parents[1]
          if str(CI_DIR) not in sys.path:
              sys.path.insert(0, str(CI_DIR))

          import workflow_debt as wd


          class WorkflowInventoryTests(unittest.TestCase):
              def test_current_inventory_is_exactly_the_three_consolidated_gates(self) -> None:
                  stats = wd.validate()
                  self.assertEqual(stats["workflow_count"], 3)
                  self.assertEqual(
                      set(stats["workflows"]),
                      {"ci.yml", "quality.yml", "polyglot.yml"},
                  )
                  self.assertEqual(stats["status"], "consolidated")

              def test_guardrail_rejects_workflow_sprawl(self) -> None:
                  drifted = set(wd.ALLOWED_WORKFLOWS) | {"pattern-regression.yml"}
                  with mock.patch.object(wd, "actual_workflows", return_value=drifted):
                      with self.assertRaises(wd.WorkflowInventoryError):
                          wd.validate()

              def test_guardrail_rejects_missing_consolidated_gate(self) -> None:
                  incomplete = set(wd.ALLOWED_WORKFLOWS) - {"polyglot.yml"}
                  with mock.patch.object(wd, "actual_workflows", return_value=incomplete):
                      with self.assertRaises(wd.WorkflowInventoryError):
                          wd.validate()


          if __name__ == "__main__":
              unittest.main()
          PY

          git rm eng/ci/workflow_debt.json
          git rm .github/workflows/i10-finalize.yml

          python eng/ci/workflow_debt.py validate
          python -m unittest discover -s eng/ci/tests -p 'test_workflow_debt.py'

          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = \
            'ci.yml polyglot.yml quality.yml '

          git config user.name 'genkidama-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add eng/ci/workflow_debt.py eng/ci/tests/test_workflow_debt.py
          git commit -m 'I10b: purge legacy workflow topology'
          git push origin HEAD:ci/i10-workflow-debt-purge
