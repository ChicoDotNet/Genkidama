name: Genkidama Learn

on:
  pull_request:
    paths:
      - 'learn/**'
      - '.github/workflows/learn.yml'
      - 'README.md'
  push:
    branches:
      - main
    paths:
      - 'learn/**'
      - '.github/workflows/learn.yml'
      - 'README.md'

permissions:
  contents: read

jobs:
  validate-foundation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.14.7
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check -r learn/_meta/requirements.txt

      - name: Validate Learn metadata, structure and links
        run: python learn/_meta/validate.py
