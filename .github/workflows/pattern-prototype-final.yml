name: Pattern Prototype Final

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/pattern-prototype-final.yml'
      - 'src/Historical/Ada/prototype.adb'
      - 'src/Niche/Solidity/Prototype.sol'
      - 'src/Historical/Fortran/prototype.f90'
      - 'src/Systems/Objective-C/prototype.m'
      - 'src/Systems/Zig/prototype.zig'
      - 'src/Niche/Nim/prototype.nim'
      - 'src/Web/Dart/prototype.dart'
      - 'src/Niche/Crystal/prototype.cr'
      - 'src/Historical/Cobol/prototype.cbl'
      - 'src/LowLevel/Assembly/prototype.asm'
      - 'src/Niche/GDScript/prototype.gd'
      - 'src/DataScience/MATLAB/prototype.m'
      - 'src/Other/MicroPython/prototype.py'
      - 'src/Other/Rockstar/prototype.rock'
      - 'src/Shell/VBA/PrototypeServiceProfile.cls'
      - 'src/Shell/VBA/prototype.bas'
      - 'src/Enterprise/Delphi/Prototype.pas'
      - 'wiki/Prototype.md'

jobs:
  portable-final:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Setup Crystal
        uses: crystal-lang/install-crystal@v1

      - name: Setup compilers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gnat gfortran gnucobol3 nasm nim

      - name: Validate portable final Prototype targets
        shell: bash
        run: |
          set -euo pipefail

          assert_output() {
            local output="$1"
            grep -Fq 'original=orders: metrics' <<<"$output"
            grep -Fq 'clone=orders-canary: metrics,tracing' <<<"$output"
            if grep -Fq 'original=orders: metrics,tracing' <<<"$output"; then
              echo 'Prototype clone shares mutable feature state with the original.' >&2
              exit 1
            fi
          }

          gnatmake -q -gnat2022 -gnatwa -gnatwe src/Historical/Ada/prototype.adb -o /tmp/prototype-ada
          assert_output "$(/tmp/prototype-ada)"

          solidity_out="$(mktemp -d)"
          npx --yes solc@0.8.30 --bin --abi src/Niche/Solidity/Prototype.sol -o "$solidity_out"
          test -n "$(find "$solidity_out" -type f -name '*_Prototype.bin' -size +0c -print -quit)"
          python - <<'PY'
          from pathlib import Path
          text = Path('src/Niche/Solidity/Prototype.sol').read_text(encoding='utf-8')
          required = [
              'original.features = new string[](1)',
              'clone.features = new string[](2)',
              'clone.features[0] = original.features[0]',
              'clone.name = "orders-canary"',
              'clone.features[1] = "tracing"',
          ]
          for fragment in required:
              if fragment not in text:
                  raise SystemExit(f'Missing Solidity Prototype source contract: {fragment}')
          PY

          gfortran -std=f2018 -Wall -Wextra -Werror src/Historical/Fortran/prototype.f90 -o /tmp/prototype-fortran
          assert_output "$(/tmp/prototype-fortran)"

          zig fmt --check src/Systems/Zig/prototype.zig
          assert_output "$(zig run src/Systems/Zig/prototype.zig 2>&1)"

          nim c --hints:off --warnings:on -o:/tmp/prototype-nim src/Niche/Nim/prototype.nim
          assert_output "$(/tmp/prototype-nim)"

          dart format --output=none --set-exit-if-changed src/Web/Dart/prototype.dart
          dart analyze --fatal-infos --fatal-warnings src/Web/Dart/prototype.dart
          assert_output "$(dart run src/Web/Dart/prototype.dart)"

          crystal tool format src/Niche/Crystal/prototype.cr
          test -z "$(git status --short -- src/Niche/Crystal/prototype.cr)"
          crystal build --error-on-warnings src/Niche/Crystal/prototype.cr -o /tmp/prototype-crystal
          assert_output "$(/tmp/prototype-crystal)"

          cobc -x -Wall src/Historical/Cobol/prototype.cbl -o /tmp/prototype-cobol
          assert_output "$(/tmp/prototype-cobol)"

          nasm -f elf64 -Wall src/LowLevel/Assembly/prototype.asm -o /tmp/prototype-assembly.o
          ld /tmp/prototype-assembly.o -o /tmp/prototype-assembly
          assert_output "$(/tmp/prototype-assembly)"

  objective-c:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Objective-C Prototype with Foundation
        shell: bash
        run: |
          set -euo pipefail
          clang -fobjc-arc -Wall -Wextra -Werror -framework Foundation \
            src/Systems/Objective-C/prototype.m -o /tmp/prototype-objective-c
          output="$(/tmp/prototype-objective-c 2>&1)"
          grep -Fq 'original=orders: metrics' <<<"$output"
          grep -Fq 'clone=orders-canary: metrics,tracing' <<<"$output"
          ! grep -Fq 'original=orders: metrics,tracing' <<<"$output"

  gdscript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip' --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot

      - name: Validate GDScript Prototype
        shell: bash
        run: |
          set -euo pipefail
          output="$(godot --headless --script src/Niche/GDScript/prototype.gd 2>&1)"
          grep -Fq 'original=orders: metrics' <<<"$output"
          grep -Fq 'clone=orders-canary: metrics,tracing' <<<"$output"
          ! grep -Fq 'original=orders: metrics,tracing' <<<"$output"

  matlab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: latest

      - name: Validate MATLAB Prototype
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            addpath('src/DataScience/MATLAB');
            output = evalc('prototype');
            disp(output);
            assert(contains(output, "original=orders: metrics"));
            assert(contains(output, "clone=orders-canary: metrics,tracing"));
            assert(~contains(output, "original=orders: metrics,tracing"));

  micropython:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build MicroPython 1.28.0 Unix port
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev pkg-config
          git clone --depth 1 --branch v1.28.0 --recurse-submodules https://github.com/micropython/micropython.git /tmp/micropython
          make -C /tmp/micropython/mpy-cross -j2
          make -C /tmp/micropython/ports/unix -j2

      - name: Validate MicroPython Prototype
        shell: bash
        run: |
          set -euo pipefail
          output="$(/tmp/micropython/ports/unix/build-standard/micropython src/Other/MicroPython/prototype.py)"
          grep -Fq 'original=orders: metrics' <<<"$output"
          grep -Fq 'clone=orders-canary: metrics,tracing' <<<"$output"
          ! grep -Fq 'original=orders: metrics,tracing' <<<"$output"

  rockstar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rockstar v2.0.31
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://github.com/RockstarLang/rockstar/releases/download/v2.0.31/rockstar-v2.0.31-linux-x64.tar.gz' --output /tmp/rockstar.tar.gz
          echo '3d265c80d9d039ad92524f42951eb546d8b42c680965dfa551210457e399653f  /tmp/rockstar.tar.gz' | sha256sum -c -
          mkdir -p /tmp/rockstar
          tar -xzf /tmp/rockstar.tar.gz -C /tmp/rockstar
          ROCKSTAR="$(find /tmp/rockstar -type f -name rockstar -perm -111 | head -n 1)"
          test -n "$ROCKSTAR"
          echo "ROCKSTAR=$ROCKSTAR" >> "$GITHUB_ENV"

      - name: Validate Rockstar Prototype
        shell: bash
        run: |
          set -euo pipefail
          output="$("$ROCKSTAR" src/Other/Rockstar/prototype.rock 2>&1)"
          printf '%s\n' "$output"
          grep -Fq 'original=orders: metrics' <<<"$output"
          grep -Fq 'clone=orders-canary: metrics,tracing' <<<"$output"
          ! grep -Fq 'original=orders: metrics,tracing' <<<"$output"

  proprietary-source-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate VBA and Delphi Prototype source contracts
        shell: python
        run: |
          from pathlib import Path
          import re

          def require(text: str, pattern: str, label: str) -> None:
              if re.search(pattern, text, flags=re.IGNORECASE | re.MULTILINE | re.DOTALL) is None:
                  raise SystemExit(f"Missing source contract: {label}")

          vba_class = Path('src/Shell/VBA/PrototypeServiceProfile.cls').read_text(encoding='utf-8')
          vba_client = Path('src/Shell/VBA/prototype.bas').read_text(encoding='utf-8')
          require(vba_class, r'Function\s+CloneProfile\(\)\s+As\s+PrototypeServiceProfile.*New\s+PrototypeServiceProfile.*For\s+Each\s+feature\s+In\s+mFeatures.*copy\.AddFeature', 'VBA deep-copy contract')
          require(vba_client, r'original\.CloneProfile\(\).*canary\.Name\s*=\s*"orders-canary".*canary\.AddFeature\s+"tracing"', 'VBA client clones then customizes')
          require(vba_client, r'original=.*original\.Describe\(\).*clone=.*canary\.Describe\(\)', 'VBA observable original/clone output')

          delphi = Path('src/Enterprise/Delphi/Prototype.pas').read_text(encoding='utf-8')
          require(delphi, r'function\s+TServiceProfile\.Clone:\s*TServiceProfile.*TServiceProfile\.Create\(FName\).*FFeatures\.Assign', 'Delphi deep-copy contract')
          require(delphi, r'Canary\s*:=\s*Original\.Clone.*Canary\.Name\s*:=\s*\'orders-canary\'.*Canary\.AddFeature\(\'tracing\'\)', 'Delphi client clones then customizes')
          require(delphi, r'Writeln\(\'original=\'\s*\+\s*Original\.Describe\).*Writeln\(\'clone=\'\s*\+\s*Canary\.Describe\)', 'Delphi observable output')

          print('VBA Prototype source contract: OK')
          print('Delphi Prototype source contract: OK')
