name: Pattern Singleton

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/pattern-singleton.yml'
      - 'src/**/singleton*'
      - 'src/**/SingletonExample.*'
      - 'wiki/Singleton.md'

jobs:
  mainstream:
    if: github.head_ref == 'patterns/singleton-kb006'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup lightweight runtimes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y php-cli

      - name: Validate mainstream Singleton examples
        shell: bash
        run: |
          set -euo pipefail
          assert_singleton() {
            local output="$1"
            grep -Fq 'same=true' <<<"$output"
            grep -Fq 'count=1' <<<"$output"
          }

          work="$(mktemp -d)"

          dotnet new console --framework net10.0 --output "$work/csharp" --force >/dev/null
          cp 'src/Enterprise/C#/SingletonExample.cs' "$work/csharp/Program.cs"
          assert_singleton "$(dotnet run --project "$work/csharp" --configuration Release)"

          python -m py_compile src/Scripting/PythonPY/singleton.py
          assert_singleton "$(python src/Scripting/PythonPY/singleton.py)"

          node --check src/Web/JavaScriptJS/singleton.js
          assert_singleton "$(node src/Web/JavaScriptJS/singleton.js)"

          npx --yes --package typescript@6.0.3 tsc src/Web/TypeScriptTS/singleton.ts --strict --target ES2024 --module commonjs --outDir "$work/typescript"
          assert_singleton "$(node "$work/typescript/singleton.js")"

          test -z "$(gofmt -d src/Systems/Go/singleton.go)"
          go vet src/Systems/Go/singleton.go
          assert_singleton "$(go run src/Systems/Go/singleton.go)"

          rustfmt --check src/Systems/Rust/singleton.rs
          rustc -D warnings src/Systems/Rust/singleton.rs -o "$work/singleton-rust"
          assert_singleton "$("$work/singleton-rust")"

          g++ -std=c++20 -Wall -Wextra -Werror 'src/Systems/C++/singleton.cpp' -o "$work/singleton-cpp"
          assert_singleton "$("$work/singleton-cpp")"

          javac -Xlint:all -Werror -d "$work/java" src/Enterprise/Java/SingletonExample.java
          assert_singleton "$(java -cp "$work/java" SingletonExample)"

          php -l src/Scripting/PHP/singleton.php
          assert_singleton "$(php src/Scripting/PHP/singleton.php)"

          command -v kotlinc >/dev/null
          kotlinc src/Enterprise/Kotlin/SingletonExample.kt -include-runtime -d "$work/singleton-kotlin.jar"
          assert_singleton "$(java -jar "$work/singleton-kotlin.jar")"

          command -v swiftc >/dev/null
          swiftc src/Systems/Swift/singleton.swift -o "$work/singleton-swift"
          assert_singleton "$("$work/singleton-swift")"

          assert_singleton "$(dotnet fsi 'src/Functional/F#/singleton.fsx')"

  portable:
    if: github.head_ref == 'patterns/singleton-kb006'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup portable runtimes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fp-compiler lua5.4 ghc scala ruby

      - name: Validate portable Singleton examples
        shell: bash
        run: |
          set -euo pipefail
          assert_singleton() {
            local output="$1"
            grep -Fq 'same=true' <<<"$output"
            grep -Fq 'count=1' <<<"$output"
          }

          work="$(mktemp -d)"

          dotnet new console --language VB --framework net10.0 --output "$work/vb" --force >/dev/null
          cp src/Enterprise/VisualBasic/SingletonExample.vb "$work/vb/Program.vb"
          assert_singleton "$(dotnet run --project "$work/vb" --configuration Release)"

          gcc -std=c17 -Wall -Wextra -Werror src/Systems/C/singleton.c -o "$work/singleton-c"
          assert_singleton "$("$work/singleton-c")"

          ruby -cw src/Scripting/RubyRB/singleton.rb
          assert_singleton "$(ruby src/Scripting/RubyRB/singleton.rb)"

          assert_singleton "$(lua5.4 src/Scripting/Lua/singleton.lua)"

          bash -n src/Shell/Bash/singleton.sh
          assert_singleton "$(bash src/Shell/Bash/singleton.sh)"

          assert_singleton "$(pwsh -NoLogo -NoProfile -NonInteractive -File src/Shell/PowerShell/singleton.ps1)"

          assert_singleton "$(runghc -Wall -Werror src/Functional/Haskell/Singleton.hs)"

          scala_out="$(mktemp -d)"
          scalac -deprecation -feature -unchecked src/Functional/Scala/Singleton.scala -d "$scala_out"
          assert_singleton "$(scala -cp "$scala_out" Singleton)"

          perl -c src/Scripting/Perl/singleton.pl
          assert_singleton "$(perl src/Scripting/Perl/singleton.pl)"

          pascal_out="$(mktemp -d)"
          fpc -Mobjfpc -O2 -Sew -FE"$pascal_out" src/Historical/Pascal/singleton.pas >/dev/null
          assert_singleton "$("$pascal_out/singleton")"

  functional:
    if: github.head_ref == 'patterns/singleton-kb006'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28.5.0.4'
          elixir-version: '1.19.1'

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - name: Setup functional runtimes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y r-base octave ocaml sbcl clojure swi-prolog-nox groovy

      - name: Validate functional Singleton examples
        shell: bash
        run: |
          set -euo pipefail
          assert_singleton() {
            local output="$1"
            grep -Fq 'same=true' <<<"$output"
            grep -Fq 'count=1' <<<"$output"
          }

          assert_singleton "$(Rscript --vanilla src/DataScience/R/singleton.R)"
          assert_singleton "$(octave --no-gui --quiet --eval "addpath('src/DataScience/Octave'); singleton();")"
          assert_singleton "$(julia --startup-file=no src/DataScience/Julia/singleton.jl)"

          ocaml_out="$(mktemp -d)"
          ocamlc -w +A-70 -warn-error +A-70 src/Functional/OCaml/singleton.ml -o "$ocaml_out/singleton"
          assert_singleton "$("$ocaml_out/singleton")"

          assert_singleton "$(sbcl --noinform --non-interactive --load src/Functional/Lisp/singleton.lisp)"
          assert_singleton "$(clojure src/Functional/Clojure/singleton.clj)"

          elixir_out="$(mktemp -d)"
          elixirc --warnings-as-errors -o "$elixir_out" src/Functional/Elixir/singleton.exs >/dev/null
          assert_singleton "$(elixir src/Functional/Elixir/singleton.exs)"

          erlang_out="$(mktemp -d)"
          erlc -Werror -o "$erlang_out" src/Functional/Erlang/singleton.erl
          assert_singleton "$(erl -noshell -pa "$erlang_out" -eval 'singleton:main(), halt().')"

          assert_singleton "$(swipl -q -s src/Niche/Prolog/singleton.pl -g run -t halt)"

          groovyc -d /tmp/singleton-groovy src/Scripting/Groovy/singleton.groovy
          assert_singleton "$(groovy src/Scripting/Groovy/singleton.groovy)"
