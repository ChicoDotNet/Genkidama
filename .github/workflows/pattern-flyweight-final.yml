name: Pattern Flyweight Final

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/pattern-flyweight-final.yml'
      - 'src/Historical/Cobol/flyweight.cbl'
      - 'src/Shell/VBA/FlyweightExample.bas'
      - 'src/Niche/GDScript/flyweight.gd'
      - 'src/LowLevel/Assembly/flyweight.asm'
      - 'src/Enterprise/Delphi/FlyweightExample.pas'
      - 'src/Other/MicroPython/flyweight.py'
      - 'src/Other/Rockstar/flyweight.rock'
      - 'src/DataScience/MATLAB/flyweight.m'

jobs:
  portable-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchains
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gnucobol3 nasm
      - name: Validate COBOL and Assembly Flyweight
        shell: bash
        run: |
          set -euo pipefail
          expected='styles=2;shared=true;text=ABC'
          work="$(mktemp -d)"
          cobc -x -Wall src/Historical/Cobol/flyweight.cbl -o "$work/flyweight-cobol"
          test "$("$work/flyweight-cobol" | tr -d '\r')" = "$expected"
          nasm -f elf64 -Wall src/LowLevel/Assembly/flyweight.asm -o "$work/flyweight-assembly.o"
          ld "$work/flyweight-assembly.o" -o "$work/flyweight-assembly"
          test "$("$work/flyweight-assembly")" = "$expected"

  gdscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip' --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
      - name: Validate GDScript Flyweight
        shell: bash
        run: |
          set -euo pipefail
          output="$(godot --headless --script src/Niche/GDScript/flyweight.gd 2>&1)"
          grep -Fxq 'styles=2;shared=true;text=ABC' <<<"$output"

  micropython:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build MicroPython 1.28.0 Unix port
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev pkg-config
          git clone --depth 1 --branch v1.28.0 --recurse-submodules https://github.com/micropython/micropython.git /tmp/micropython
          make -C /tmp/micropython/mpy-cross -j2
          make -C /tmp/micropython/ports/unix -j2
      - name: Validate MicroPython Flyweight
        shell: bash
        run: |
          set -euo pipefail
          test "$(/tmp/micropython/ports/unix/build-standard/micropython src/Other/MicroPython/flyweight.py)" = 'styles=2;shared=true;text=ABC'

  rockstar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rockstar v2.0.31
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://github.com/RockstarLang/rockstar/releases/download/v2.0.31/rockstar-v2.0.31-linux-x64.tar.gz' --output /tmp/rockstar.tar.gz
          echo '3d265c80d9d039ad92524f42951eb546d8b42c680965dfa551210457e399653f  /tmp/rockstar.tar.gz' | sha256sum -c -
          mkdir -p /tmp/rockstar
          tar -xzf /tmp/rockstar.tar.gz -C /tmp/rockstar
          echo "ROCKSTAR=$(find /tmp/rockstar -type f -name rockstar -perm -111 | head -n 1)" >> "$GITHUB_ENV"
      - name: Validate Rockstar Flyweight
        shell: bash
        run: |
          set -euo pipefail
          test "$("$ROCKSTAR" src/Other/Rockstar/flyweight.rock)" = 'styles=2;shared=true;text=ABC'

  matlab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: matlab-actions/setup-matlab@v2
      - uses: matlab-actions/run-command@v2
        with:
          command: "run('src/DataScience/MATLAB/flyweight.m')"

  proprietary-source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate VBA and Delphi Flyweight source contracts
        shell: python
        run: |
          from pathlib import Path
          import re

          def require(text, pattern, label):
              if re.search(pattern, text, flags=re.IGNORECASE | re.MULTILINE | re.DOTALL) is None:
                  raise SystemExit(f"Missing source contract: {label}")

          vba = Path('src/Shell/VBA/FlyweightExample.bas').read_text(encoding='utf-8')
          for pattern, label in [
              (r'^Option Explicit$', 'VBA Option Explicit'),
              (r'CreateObject\("Scripting\.Dictionary"\)', 'VBA canonical pool'),
              (r'Function\s+GetStyleId', 'VBA Flyweight factory'),
              (r'red1\s*=\s*GetStyleId.*red2\s*=\s*GetStyleId', 'VBA shared lookup'),
          ]:
              require(vba, pattern, label)

          delphi = Path('src/Enterprise/Delphi/FlyweightExample.pas').read_text(encoding='utf-8')
          for pattern, label in [
              (r'TTextStyle\s*=\s*class', 'Delphi intrinsic state'),
              (r'TStyleFactory\s*=\s*class', 'Delphi Flyweight factory'),
              (r'TObjectDictionary<string,\s*TTextStyle>', 'Delphi canonical pool'),
              (r'FPool\.TryGetValue', 'Delphi shared lookup'),
          ]:
              require(delphi, pattern, label)

          print('VBA/Delphi Flyweight source contracts: OK')
