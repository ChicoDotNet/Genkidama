name: Learn Kotlin

on:
  pull_request:
    paths:
      - 'learn/es/kotlin/**'
      - '.github/workflows/learn-kotlin.yml'
  push:
    branches: [dev]
    paths:
      - 'learn/es/kotlin/**'
      - '.github/workflows/learn-kotlin.yml'

jobs:
  kotlin-jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'
      - name: Test FieldFlow core
        working-directory: learn/es/kotlin/app
        run: gradle test
      - name: Run FieldFlow core
        working-directory: learn/es/kotlin/app
        run: gradle run

  android-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'
      - name: Install stable Android 36 platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile Room and Compose Android app
        working-directory: learn/es/kotlin/android
        run: gradle :app:assembleDebug :app:testDebugUnitTest
