name: Pattern Singleton Diagnostics

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/pattern-singleton-diagnostics.yml'
      - 'src/DataScience/R/singleton.R'
      - 'src/Scripting/Perl/singleton.pl'
      - 'src/Historical/Pascal/singleton.pas'

jobs:
  diagnose:
    if: github.head_ref == 'patterns/singleton-kb006'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup runtimes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y r-base fp-compiler perl

      - name: Validate R Singleton
        shell: bash
        run: |
          set -euo pipefail
          output="$(Rscript --vanilla src/DataScience/R/singleton.R)"
          printf '%s\n' "$output"
          grep -Fxq 'same=true' <<<"$output"
          grep -Fxq 'count=1' <<<"$output"

      - name: Validate Perl Singleton
        shell: bash
        run: |
          set -euo pipefail
          perl -c src/Scripting/Perl/singleton.pl
          output="$(perl src/Scripting/Perl/singleton.pl)"
          printf '%s\n' "$output"
          grep -Fxq 'same=true' <<<"$output"
          grep -Fxq 'count=1' <<<"$output"

      - name: Validate Pascal Singleton
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          fpc -Mobjfpc -O2 -Sew -FE"$out" src/Historical/Pascal/singleton.pas >/dev/null
          output="$("$out/singleton")"
          printf '%s\n' "$output"
          grep -Fxq 'same=true' <<<"$output"
          grep -Fxq 'count=1' <<<"$output"
