name: Pattern Singleton Diagnostics

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/pattern-singleton-diagnostics.yml'
      - 'src/DataScience/R/singleton.R'
      - 'src/DataScience/Octave/singleton.m'
      - 'src/DataScience/Julia/singleton.jl'
      - 'src/Functional/OCaml/singleton.ml'
      - 'src/Functional/Lisp/singleton.lisp'
      - 'src/Functional/Clojure/singleton.clj'
      - 'src/Functional/Elixir/singleton.exs'
      - 'src/Functional/Erlang/singleton.erl'
      - 'src/Niche/Prolog/singleton.pl'
      - 'src/Scripting/Groovy/singleton.groovy'
      - 'src/Scripting/Perl/singleton.pl'
      - 'src/Historical/Pascal/singleton.pas'

jobs:
  portable-diagnose:
    if: github.head_ref == 'patterns/singleton-kb006'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup runtimes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y r-base fp-compiler perl

      - name: Validate R Singleton
        shell: bash
        run: |
          set -euo pipefail
          output="$(Rscript --vanilla src/DataScience/R/singleton.R)"
          printf '%s\n' "$output"
          grep -Fxq 'same=true' <<<"$output"
          grep -Fxq 'count=1' <<<"$output"

      - name: Validate Perl Singleton
        shell: bash
        run: |
          set -euo pipefail
          perl -c src/Scripting/Perl/singleton.pl
          output="$(perl src/Scripting/Perl/singleton.pl)"
          printf '%s\n' "$output"
          grep -Fxq 'same=true' <<<"$output"
          grep -Fxq 'count=1' <<<"$output"

      - name: Validate Pascal Singleton
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          fpc -Mobjfpc -O2 -Sew -FE"$out" src/Historical/Pascal/singleton.pas >/dev/null
          output="$("$out/singleton")"
          printf '%s\n' "$output"
          grep -Fxq 'same=true' <<<"$output"
          grep -Fxq 'count=1' <<<"$output"

  functional-diagnose:
    if: github.head_ref == 'patterns/singleton-kb006'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28.5.0.4'
          elixir-version: '1.19.1'

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - name: Setup functional runtimes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y r-base octave ocaml sbcl clojure swi-prolog-nox groovy

      - name: Validate R Singleton
        shell: bash
        run: |
          set -euo pipefail
          output="$(Rscript --vanilla src/DataScience/R/singleton.R)"
          printf '%s\n' "$output"
          grep -Fxq 'same=true' <<<"$output"
          grep -Fxq 'count=1' <<<"$output"

      - name: Validate Octave Singleton
        shell: bash
        run: |
          set -euo pipefail
          output="$(octave --no-gui --quiet --eval "addpath('src/DataScience/Octave'); singleton();")"
          printf '%s\n' "$output"
          grep -Fxq 'same=true' <<<"$output"
          grep -Fxq 'count=1' <<<"$output"

      - name: Validate Julia Singleton
        shell: bash
        run: |
          set -euo pipefail
          output="$(julia --startup-file=no src/DataScience/Julia/singleton.jl)"
          printf '%s\n' "$output"
          grep -Fxq 'same=true' <<<"$output"
          grep -Fxq 'count=1' <<<"$output"

      - name: Validate OCaml Singleton
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          ocamlc -w +A-70 -warn-error +A-70 src/Functional/OCaml/singleton.ml -o "$out/singleton"
          output="$("$out/singleton")"
          printf '%s\n' "$output"
          grep -Fxq 'same=true' <<<"$output"
          grep -Fxq 'count=1' <<<"$output"

      - name: Validate Common Lisp Singleton
        shell: bash
        run: |
          set -euo pipefail
          output="$(sbcl --noinform --non-interactive --load src/Functional/Lisp/singleton.lisp)"
          printf '%s\n' "$output"
          grep -Fxq 'same=true' <<<"$output"
          grep -Fxq 'count=1' <<<"$output"

      - name: Validate Clojure Singleton
        shell: bash
        run: |
          set -euo pipefail
          output="$(clojure src/Functional/Clojure/singleton.clj)"
          printf '%s\n' "$output"
          grep -Fxq 'same=true' <<<"$output"
          grep -Fxq 'count=1' <<<"$output"

      - name: Validate Elixir Singleton
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          elixirc --warnings-as-errors -o "$out" src/Functional/Elixir/singleton.exs >/dev/null
          output="$(elixir src/Functional/Elixir/singleton.exs)"
          printf '%s\n' "$output"
          grep -Fxq 'same=true' <<<"$output"
          grep -Fxq 'count=1' <<<"$output"

      - name: Validate Erlang Singleton
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          erlc -Werror -o "$out" src/Functional/Erlang/singleton.erl
          output="$(erl -noshell -pa "$out" -eval 'singleton:main(), halt().')"
          printf '%s\n' "$output"
          grep -Fxq 'same=true' <<<"$output"
          grep -Fxq 'count=1' <<<"$output"

      - name: Validate Prolog Singleton
        shell: bash
        run: |
          set -euo pipefail
          output="$(swipl -q -s src/Niche/Prolog/singleton.pl -g run -t halt)"
          printf '%s\n' "$output"
          grep -Fxq 'same=true' <<<"$output"
          grep -Fxq 'count=1' <<<"$output"

      - name: Validate Groovy Singleton
        shell: bash
        run: |
          set -euo pipefail
          groovyc -d /tmp/singleton-groovy src/Scripting/Groovy/singleton.groovy
          output="$(groovy src/Scripting/Groovy/singleton.groovy)"
          printf '%s\n' "$output"
          grep -Fxq 'same=true' <<<"$output"
          grep -Fxq 'count=1' <<<"$output"
