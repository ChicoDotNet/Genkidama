name: Pattern Facade Mainstream

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/pattern-facade-mainstream.yml'
      - 'src/Enterprise/C#/FacadeExample.cs'
      - 'src/Web/TypeScriptTS/facade.ts'
      - 'src/Scripting/PythonPY/facade.py'
      - 'src/Systems/C++/facade.cpp'
      - 'src/Enterprise/Java/FacadeExample.java'
      - 'src/Systems/Rust/facade.rs'
      - 'src/Systems/Go/facade.go'
      - 'src/Scripting/PHP/facade.php'
      - 'src/Enterprise/Kotlin/FacadeExample.kt'
      - 'src/Systems/Swift/facade.swift'
      - 'src/Functional/F#/facade.fsx'
      - 'src/Web/JavaScriptJS/facade.js'
      - 'src/Enterprise/VB.NET/FacadeExample.vb'
      - 'src/Systems/C/facade.c'
      - 'src/Scripting/Ruby/facade.rb'
      - 'src/Scripting/Lua/facade.lua'
      - 'src/Scripting/Bash/facade.sh'
      - 'src/Scripting/PowerShell/FacadeExample.ps1'
      - 'src/Functional/Haskell/Facade.hs'
      - 'src/Scripting/Perl/facade.pl'
      - 'wiki/Facade.md'

jobs:
  mainstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install portable runtimes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y php-cli lua5.4 ruby ghc
      - name: Validate Facade examples
        shell: bash
        run: |
          set -euo pipefail
          expected='checkout=auth(alice)>reserve(SKU-42)>charge(499)'
          assert_output() {
            local label="$1"
            local output="$2"
            if [[ "$output" != "$expected" ]]; then
              printf '%s output mismatch\nexpected: %s\nactual:   %s\n' "$label" "$expected" "$output" >&2
              exit 1
            fi
          }

          work="$(mktemp -d)"

          dotnet new console --framework net10.0 -n FacadeCheck -o "$work/csharp" >/dev/null
          cp 'src/Enterprise/C#/FacadeExample.cs' "$work/csharp/Program.cs"
          assert_output 'C#' "$(dotnet run --project "$work/csharp/FacadeCheck.csproj" --configuration Release)"

          assert_output 'TypeScript' "$(npx --yes tsx src/Web/TypeScriptTS/facade.ts)"
          python -m py_compile src/Scripting/PythonPY/facade.py
          assert_output 'Python' "$(python src/Scripting/PythonPY/facade.py)"

          g++ -std=c++20 -Wall -Wextra -Werror 'src/Systems/C++/facade.cpp' -o "$work/facade-cpp"
          assert_output 'C++' "$("$work/facade-cpp")"

          javac -Xlint:all -Werror -d "$work/java" src/Enterprise/Java/FacadeExample.java
          assert_output 'Java' "$(java -cp "$work/java" FacadeExample)"

          rustc --edition 2024 -D warnings src/Systems/Rust/facade.rs -o "$work/facade-rust"
          assert_output 'Rust' "$("$work/facade-rust")"

          test -z "$(gofmt -d src/Systems/Go/facade.go)"
          assert_output 'Go' "$(go run src/Systems/Go/facade.go)"

          php -l src/Scripting/PHP/facade.php >/dev/null
          assert_output 'PHP' "$(php src/Scripting/PHP/facade.php)"

          command -v kotlinc >/dev/null
          kotlinc src/Enterprise/Kotlin/FacadeExample.kt -include-runtime -d "$work/facade-kotlin.jar"
          assert_output 'Kotlin' "$(java -jar "$work/facade-kotlin.jar")"

          command -v swiftc >/dev/null
          swiftc -warnings-as-errors src/Systems/Swift/facade.swift -o "$work/facade-swift"
          assert_output 'Swift' "$("$work/facade-swift")"

          assert_output 'F#' "$(dotnet fsi 'src/Functional/F#/facade.fsx')"
          node --check src/Web/JavaScriptJS/facade.js
          assert_output 'JavaScript' "$(node src/Web/JavaScriptJS/facade.js)"

          dotnet new console -lang VB --framework net10.0 -n FacadeVb -o "$work/vb" >/dev/null
          cp 'src/Enterprise/VB.NET/FacadeExample.vb' "$work/vb/Program.vb"
          assert_output 'VB.NET' "$(dotnet run --project "$work/vb/FacadeVb.vbproj" --configuration Release)"

          gcc -std=c17 -Wall -Wextra -Werror -pedantic src/Systems/C/facade.c -o "$work/facade-c"
          assert_output 'C' "$("$work/facade-c")"

          ruby -cw src/Scripting/Ruby/facade.rb >/dev/null
          assert_output 'Ruby' "$(ruby src/Scripting/Ruby/facade.rb)"

          assert_output 'Lua' "$(lua5.4 src/Scripting/Lua/facade.lua)"

          bash -n src/Scripting/Bash/facade.sh
          assert_output 'Bash' "$(bash src/Scripting/Bash/facade.sh)"

          assert_output 'PowerShell' "$(pwsh -NoLogo -NoProfile -NonInteractive -File src/Scripting/PowerShell/FacadeExample.ps1)"

          ghc -Wall -Werror -outputdir "$work/haskell" -o "$work/facade-haskell" src/Functional/Haskell/Facade.hs
          assert_output 'Haskell' "$("$work/facade-haskell")"

          perl -c src/Scripting/Perl/facade.pl >/dev/null
          assert_output 'Perl' "$(perl src/Scripting/Perl/facade.pl)"
