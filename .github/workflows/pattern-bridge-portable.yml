name: Pattern Bridge Portable

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/pattern-bridge-portable.yml'
      - 'src/Enterprise/VisualBasic/BridgeExample.vb'
      - 'src/Systems/C/bridge.c'
      - 'src/Scripting/RubyRB/bridge.rb'
      - 'src/Scripting/Lua/bridge.lua'
      - 'src/Shell/Bash/bridge.sh'
      - 'src/Shell/PowerShell/bridge.ps1'
      - 'src/Functional/Haskell/Bridge.hs'
      - 'src/Functional/Scala/Bridge.scala'
      - 'src/Scripting/Perl/bridge.pl'
      - 'src/Historical/Pascal/bridge.pas'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup portable runtimes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fp-compiler ghc lua5.4 perl ruby scala

      - name: Validate Visual Basic .NET Bridge
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf 'basic-tv=TV:on\nbasic-radio=Radio:on\nmute-tv=TV:muted\nmute-radio=Radio:muted')"
          work="$(mktemp -d)"
          dotnet new console --language VB --framework net10.0 --output "$work" --force >/dev/null
          cp src/Enterprise/VisualBasic/BridgeExample.vb "$work/Program.vb"
          test "$(dotnet run --project "$work" --configuration Release)" = "$expected"

      - name: Validate C Bridge
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf 'basic-tv=TV:on\nbasic-radio=Radio:on\nmute-tv=TV:muted\nmute-radio=Radio:muted')"
          gcc -std=c17 -Wall -Wextra -Werror src/Systems/C/bridge.c -o /tmp/bridge-c
          test "$(/tmp/bridge-c)" = "$expected"

      - name: Validate Ruby Bridge
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf 'basic-tv=TV:on\nbasic-radio=Radio:on\nmute-tv=TV:muted\nmute-radio=Radio:muted')"
          ruby -cw src/Scripting/RubyRB/bridge.rb >/dev/null
          test "$(ruby src/Scripting/RubyRB/bridge.rb)" = "$expected"

      - name: Validate Lua Bridge
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf 'basic-tv=TV:on\nbasic-radio=Radio:on\nmute-tv=TV:muted\nmute-radio=Radio:muted')"
          test "$(lua5.4 src/Scripting/Lua/bridge.lua)" = "$expected"

      - name: Validate Bash Bridge
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf 'basic-tv=TV:on\nbasic-radio=Radio:on\nmute-tv=TV:muted\nmute-radio=Radio:muted')"
          bash -n src/Shell/Bash/bridge.sh
          test "$(bash src/Shell/Bash/bridge.sh)" = "$expected"

      - name: Validate PowerShell Bridge
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf 'basic-tv=TV:on\nbasic-radio=Radio:on\nmute-tv=TV:muted\nmute-radio=Radio:muted')"
          test "$(pwsh -NoLogo -NoProfile -NonInteractive -File src/Shell/PowerShell/bridge.ps1)" = "$expected"

      - name: Validate Haskell Bridge
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf 'basic-tv=TV:on\nbasic-radio=Radio:on\nmute-tv=TV:muted\nmute-radio=Radio:muted')"
          test "$(runghc -Wall -Werror src/Functional/Haskell/Bridge.hs)" = "$expected"

      - name: Validate Scala Bridge
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf 'basic-tv=TV:on\nbasic-radio=Radio:on\nmute-tv=TV:muted\nmute-radio=Radio:muted')"
          out="$(mktemp -d)"
          scalac -deprecation -feature -unchecked src/Functional/Scala/Bridge.scala -d "$out"
          test "$(scala -cp "$out" Bridge)" = "$expected"

      - name: Validate Perl Bridge
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf 'basic-tv=TV:on\nbasic-radio=Radio:on\nmute-tv=TV:muted\nmute-radio=Radio:muted')"
          perl -c src/Scripting/Perl/bridge.pl >/dev/null
          test "$(perl src/Scripting/Perl/bridge.pl)" = "$expected"

      - name: Validate Pascal Bridge
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf 'basic-tv=TV:on\nbasic-radio=Radio:on\nmute-tv=TV:muted\nmute-radio=Radio:muted')"
          out="$(mktemp -d)"
          fpc -Mobjfpc -O2 -Sew -FE"$out" src/Historical/Pascal/bridge.pas >/dev/null
          test "$("$out/bridge")" = "$expected"
