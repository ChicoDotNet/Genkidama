name: Learn PHP

on:
  pull_request:
    paths:
      - 'learn/es/php/**'
      - '.github/workflows/learn-php.yml'
  push:
    branches:
      - main
    paths:
      - 'learn/es/php/**'
      - '.github/workflows/learn-php.yml'

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: learn/es/php/app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Report versions
        run: |
          php --version
          composer --version

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Verify AgendaPHP
        run: bash tools/verify.sh

      - name: Smoke AgendaPHP over HTTP
        run: bash tools/smoke.sh
