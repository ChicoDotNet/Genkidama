name: JVM 25 Kotlin + Groovy Probe

on:
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jvm25-kotlin-groovy-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replay-jvm17-contracts-on-java25:
    name: Replay Kotlin + Groovy contracts / Java 25
    runs-on: ubuntu-24.04
    env:
      GENKIDAMA_JVM_PROFILE: jvm17
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'
          cache-disabled: true

      - name: Install pinned Kotlin 2.4.10 and Groovy 5.1.1
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL https://github.com/JetBrains/kotlin/releases/download/v2.4.10/kotlin-compiler-2.4.10.zip -o /tmp/kotlin.zip
          echo '473dd66c7a3ef4b182065b3da670466c1bf2773a9dbb0ed8b33a39fe9d4f876d  /tmp/kotlin.zip' | sha256sum -c -
          sudo rm -rf /opt/kotlinc
          sudo unzip -q /tmp/kotlin.zip -d /opt

          curl -fsSL https://archive.apache.org/dist/groovy/5.1.1/distribution/apache-groovy-binary-5.1.1.zip -o /tmp/groovy.zip
          echo '51a5a86c638abc618273f9f318ad2d906fcd4fecbdc1b9fa3c9f47c8c3cd753b  /tmp/groovy.zip' | sha256sum -c -
          sudo rm -rf /opt/groovy-5.1.1
          sudo unzip -q /tmp/groovy.zip -d /opt

          echo '/opt/kotlinc/bin' >> "$GITHUB_PATH"
          echo '/opt/groovy-5.1.1/bin' >> "$GITHUB_PATH"

          java --version
          /opt/kotlinc/bin/kotlinc -version
          /opt/groovy-5.1.1/bin/groovy --version

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'

      - name: Replay current Java 17 contract set with Java 25 toolchains
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/jvmToolchain(17)/jvmToolchain(25)/g' eng/ci/adapters/jvm_patterns.py learn/es/kotlin/app/build.gradle.kts
          ! grep -R --line-number --fixed-strings 'jvmToolchain(17)' eng/ci/adapters/jvm_patterns.py learn/es/kotlin/app/build.gradle.kts
          python eng/ci/run-family jvm --all --telemetry-file artifacts/ci/jvm25-kotlin-groovy-probe.jsonl
