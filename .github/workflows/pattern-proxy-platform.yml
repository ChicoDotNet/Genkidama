name: Pattern Proxy Platform

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/pattern-proxy-platform.yml'
      - 'src/Systems/Objective-C/proxy.m'
      - 'src/Systems/Zig/proxy.zig'
      - 'src/Niche/GDScript/proxy.gd'
      - 'src/Other/MicroPython/proxy.py'

jobs:
  objective-c:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Objective-C Proxy
        shell: bash
        run: |
          set -euo pipefail
          expected='backend=1;fetches=1;first=doc(42);second=doc(42)'
          work="$(mktemp -d)"
          clang -fobjc-arc -Wall -Wextra -Werror -framework Foundation src/Systems/Objective-C/proxy.m -o "$work/proxy-objective-c"
          test "$("$work/proxy-objective-c")" = "$expected"

  zig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.15.2'
      - name: Validate Zig Proxy
        shell: bash
        run: |
          set -euo pipefail
          expected='backend=1;fetches=1;first=doc(42);second=doc(42)'
          test -z "$(zig fmt --check src/Systems/Zig/proxy.zig 2>&1)"
          work="$(mktemp -d)"
          zig build-exe src/Systems/Zig/proxy.zig -O ReleaseSafe -femit-bin="$work/proxy-zig"
          test "$("$work/proxy-zig")" = "$expected"

  gdscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip' --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
      - name: Validate GDScript Proxy
        shell: bash
        run: |
          set -euo pipefail
          output="$(godot --headless --script src/Niche/GDScript/proxy.gd 2>&1)"
          grep -Fxq 'backend=1;fetches=1;first=doc(42);second=doc(42)' <<<"$output"

  micropython:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build MicroPython 1.28.0 Unix port
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev pkg-config
          git clone --depth 1 --branch v1.28.0 --recurse-submodules https://github.com/micropython/micropython.git /tmp/micropython
          make -C /tmp/micropython/mpy-cross -j2
          make -C /tmp/micropython/ports/unix -j2
      - name: Validate MicroPython Proxy
        shell: bash
        run: |
          set -euo pipefail
          test "$(/tmp/micropython/ports/unix/build-standard/micropython src/Other/MicroPython/proxy.py)" = 'backend=1;fetches=1;first=doc(42);second=doc(42)'
