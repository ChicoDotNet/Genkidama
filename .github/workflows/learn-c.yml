name: Learn C

on:
  pull_request:
    branches: [dev]
    paths:
      - 'learn/es/c/**'
      - '.github/workflows/learn-c.yml'
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    runs-on: ubuntu-latest
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v7
      - name: Show toolchain
        run: |
          "$CC" --version
          cmake --version
      - name: Configure
        run: cmake -S learn/es/c/app -B learn/es/c/app/build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build learn/es/c/app/build --parallel
      - name: Test
        run: ctest --test-dir learn/es/c/app/build --output-on-failure
      - name: Install portable artifacts
        run: cmake --install learn/es/c/app/build --prefix "$RUNNER_TEMP/telemetry-dist"
      - name: Smoke CLI
        run: |
          FILE="$RUNNER_TEMP/sample.gtl"
          RECOVERED="$RUNNER_TEMP/recovered.gtl"
          ./learn/es/c/app/build/telemetry_cli init "$FILE"
          ./learn/es/c/app/build/telemetry_cli log "$FILE" 1000 7 21500 0
          ./learn/es/c/app/build/telemetry_cli list "$FILE" | grep 'sensor=7 value_milli=21500 status=0'
          ./learn/es/c/app/build/telemetry_cli diagnose "$FILE" | grep 'Estado: ok'
          printf bad >> "$FILE"
          ./learn/es/c/app/build/telemetry_cli recover "$FILE" "$RECOVERED"
          ./learn/es/c/app/build/telemetry_cli diagnose "$RECOVERED" | grep 'Estado: ok'
          test -x "$RUNNER_TEMP/telemetry-dist/bin/telemetry_cli"
          test -f "$RUNNER_TEMP/telemetry-dist/include/telemetry.h"
