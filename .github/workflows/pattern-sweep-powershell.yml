name: Pattern sweep - PowerShell canonical

on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/Scripting/PowerShell/patterns/**'
      - 'src/Scripting/PowerShell/pattern_sweep.ps1'
      - 'docs/pattern-sweeps/powershell.md'
      - '.github/workflows/pattern-sweep-powershell.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe runtime
        shell: pwsh
        run: |
          "powershell_version=$($PSVersionTable.PSVersion)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Validate canonical cells
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $started = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $files = @(Get-ChildItem 'src/Scripting/PowerShell/patterns' -Filter '*.ps1' -File | Sort-Object Name)
          if ($files.Count -ne 39) {
            throw "Expected 39 canonical PowerShell pattern cells, found $($files.Count)."
          }

          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($file.Name): $($_.Message)" }
              throw "PowerShell parser rejected $($file.Name)."
            }
            & $file.FullName
          }

          & 'src/Scripting/PowerShell/pattern_sweep.ps1'
          $ended = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          "cells=39" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "validation_seconds=$($ended - $started)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
