name: Gradle Cache Benchmark

on:
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Gradle cache ${{ matrix.cache_disabled && 'OFF' || 'ON' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cache_disabled: [false, true]
    env:
      GENKIDAMA_JVM_PROFILE: jvm17
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'
          cache-disabled: ${{ matrix.cache_disabled }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'
      - name: Benchmark representative JVM Learn workload
        run: python eng/ci/adapters/learn_jvm.py
