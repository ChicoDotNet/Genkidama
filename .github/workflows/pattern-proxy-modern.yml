name: Pattern Proxy Modern

on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/DataScience/Julia/proxy.jl'
      - 'src/Web/Dart/proxy.dart'
      - 'src/Niche/Crystal/proxy.cr'
      - '.github/workflows/pattern-proxy-modern.yml'

jobs:
  modern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: dart-lang/setup-dart@v1
      - name: Install Crystal
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y crystal
      - name: Validate Julia, Dart and Crystal Proxy
        shell: bash
        run: |
          set -euo pipefail
          expected='backend=1;fetches=1;first=doc(42);second=doc(42)'
          work="$(mktemp -d)"

          test "$(julia --startup-file=no src/DataScience/Julia/proxy.jl)" = "$expected"

          dart format --output=none --set-exit-if-changed src/Web/Dart/proxy.dart
          dart analyze --fatal-infos --fatal-warnings src/Web/Dart/proxy.dart
          test "$(dart run src/Web/Dart/proxy.dart)" = "$expected"

          crystal tool format --check src/Niche/Crystal/proxy.cr
          crystal build --error-trace src/Niche/Crystal/proxy.cr -o "$work/proxy-crystal"
          test "$("$work/proxy-crystal")" = "$expected"
