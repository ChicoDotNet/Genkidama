name: PR112 Merge Diagnostic

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Diagnose PR112 merge against dev
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev patterns/iterator-kb006-final
          git checkout -B pr112 origin/patterns/iterator-kb006-final
          set +e
          git -c user.name='Genkidama CI' -c user.email='ci@example.invalid' merge --no-commit --no-ff origin/dev
          status=$?
          set -e
          echo "merge_status=$status"
          echo '--- unresolved paths ---'
          git diff --name-only --diff-filter=U | sort
          echo '--- status ---'
          git status --short
          git merge --abort || true
          exit 0
