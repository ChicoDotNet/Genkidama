name: Pattern Factory Method Core

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/pattern-factory-method-portable2.yml'
      - 'src/Enterprise/C#/FactoryMethodExample.cs'
      - 'src/Enterprise/Java/FactoryMethodExample.java'
      - 'src/Scripting/PythonPY/factory_method.py'
      - 'src/Web/JavaScriptJS/factory_method.js'
      - 'src/Web/TypeScriptTS/factory_method.ts'
      - 'src/Systems/Go/factory_method.go'
      - 'src/Systems/Rust/factory_method.rs'
      - 'src/Scripting/PHP/factory_method.php'
      - 'src/Systems/C/factory_method.c'
      - 'src/Systems/C++/factory_method.cpp'
      - 'src/Enterprise/VisualBasic/FactoryMethodExample.vb'
      - 'src/Functional/F#/factory_method.fsx'
      - 'src/Scripting/RubyRB/factory_method.rb'
      - 'src/Scripting/Lua/factory_method.lua'
      - 'src/Shell/Bash/factory_method.sh'
      - 'src/Shell/PowerShell/factory_method.ps1'
      - 'src/Enterprise/Kotlin/FactoryMethodExample.kt'
      - 'src/Systems/Swift/factory_method.swift'
      - 'src/Historical/Ada/factory_method.adb'
      - 'src/Niche/Solidity/FactoryMethod.sol'
      - 'src/Historical/Fortran/factory_method.f90'
      - 'src/Historical/Pascal/factory_method.pas'
      - 'src/Systems/Zig/factory_method.zig'
      - 'src/Niche/Nim/factory_method.nim'
      - 'src/Web/Dart/factory_method.dart'
      - 'src/Niche/Crystal/factory_method.cr'
      - 'src/Functional/Haskell/FactoryMethod.hs'
      - 'src/Functional/Scala/FactoryMethod.scala'
      - 'src/Scripting/Groovy/factory_method.groovy'
      - 'src/Systems/Objective-C/factory_method.m'
      - 'wiki/FactoryMethod.md'

jobs:
  validate-mainstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup portable runtimes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y php-cli lua5.4 ruby

      - name: Validate C#
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          dotnet new console --framework net10.0 --output "$work" --force >/dev/null
          cp 'src/Enterprise/C#/FactoryMethodExample.cs' "$work/Program.cs"
          output="$(dotnet run --project "$work" --configuration Release)"
          grep -Fq 'PostgreSQL connect' <<<"$output"
          grep -Fq 'PostgreSQL query' <<<"$output"
          grep -Fq 'MySQL connect' <<<"$output"
          grep -Fq 'MySQL query' <<<"$output"

      - name: Validate Java
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          javac -Xlint:all -Werror -d "$work" src/Enterprise/Java/FactoryMethodExample.java
          output="$(java -cp "$work" FactoryMethodExample)"
          grep -Fq 'PostgreSQL connect' <<<"$output"
          grep -Fq 'MySQL query' <<<"$output"

      - name: Validate Python
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile src/Scripting/PythonPY/factory_method.py
          output="$(python src/Scripting/PythonPY/factory_method.py)"
          grep -Fq 'PostgreSQL connect' <<<"$output"
          grep -Fq 'MySQL query' <<<"$output"

      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check src/Web/JavaScriptJS/factory_method.js
          output="$(node src/Web/JavaScriptJS/factory_method.js)"
          grep -Fq 'PostgreSQL connect' <<<"$output"
          grep -Fq 'MySQL query' <<<"$output"

      - name: Validate TypeScript
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          npx --yes --package typescript@6.0.3 tsc src/Web/TypeScriptTS/factory_method.ts --strict --target ES2024 --module commonjs --outDir "$work"
          output="$(node "$work/factory_method.js")"
          grep -Fq 'PostgreSQL connect' <<<"$output"
          grep -Fq 'MySQL query' <<<"$output"

      - name: Validate Go
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -d src/Systems/Go/factory_method.go)"
          go vet src/Systems/Go/factory_method.go
          output="$(go run src/Systems/Go/factory_method.go)"
          grep -Fq 'PostgreSQL connect' <<<"$output"
          grep -Fq 'MySQL query' <<<"$output"

      - name: Validate Rust
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --check src/Systems/Rust/factory_method.rs
          rustc -D warnings src/Systems/Rust/factory_method.rs -o /tmp/factory-method-rust
          output="$(/tmp/factory-method-rust)"
          grep -Fq 'PostgreSQL connect' <<<"$output"
          grep -Fq 'MySQL query' <<<"$output"

      - name: Validate PHP
        shell: bash
        run: |
          set -euo pipefail
          php -l src/Scripting/PHP/factory_method.php
          output="$(php src/Scripting/PHP/factory_method.php)"
          grep -Fq 'PostgreSQL connect' <<<"$output"
          grep -Fq 'MySQL query' <<<"$output"

      - name: Validate C
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c17 -Wall -Wextra -Werror src/Systems/C/factory_method.c -o /tmp/factory-method-c
          output="$(/tmp/factory-method-c)"
          grep -Fq 'PostgreSQL connect' <<<"$output"
          grep -Fq 'MySQL query' <<<"$output"

      - name: Validate C++
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -Wall -Wextra -Werror 'src/Systems/C++/factory_method.cpp' -o /tmp/factory-method-cpp
          output="$(/tmp/factory-method-cpp)"
          grep -Fq 'PostgreSQL connect' <<<"$output"
          grep -Fq 'MySQL query' <<<"$output"

      - name: Validate VB.NET
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          dotnet new console --language VB --framework net10.0 --output "$work" --force >/dev/null
          cp src/Enterprise/VisualBasic/FactoryMethodExample.vb "$work/Program.vb"
          output="$(dotnet run --project "$work" --configuration Release)"
          grep -Fq 'PostgreSQL connect' <<<"$output"
          grep -Fq 'MySQL query' <<<"$output"

      - name: Validate F#
        shell: bash
        run: |
          set -euo pipefail
          output="$(dotnet fsi 'src/Functional/F#/factory_method.fsx')"
          grep -Fq 'PostgreSQL connect' <<<"$output"
          grep -Fq 'MySQL query' <<<"$output"

      - name: Validate Ruby
        shell: bash
        run: |
          set -euo pipefail
          ruby -cw src/Scripting/RubyRB/factory_method.rb
          output="$(ruby src/Scripting/RubyRB/factory_method.rb)"
          grep -Fq 'PostgreSQL connect' <<<"$output"
          grep -Fq 'MySQL query' <<<"$output"

      - name: Validate Lua
        shell: bash
        run: |
          set -euo pipefail
          output="$(lua5.4 src/Scripting/Lua/factory_method.lua)"
          grep -Fq 'PostgreSQL connect' <<<"$output"
          grep -Fq 'MySQL query' <<<"$output"

      - name: Validate Bash
        shell: bash
        run: |
          set -euo pipefail
          bash -n src/Shell/Bash/factory_method.sh
          output="$(bash src/Shell/Bash/factory_method.sh)"
          grep -Fq 'PostgreSQL connect' <<<"$output"
          grep -Fq 'MySQL query' <<<"$output"

      - name: Validate PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = & ./src/Shell/PowerShell/factory_method.ps1 | Out-String
          if (-not $output.Contains('PostgreSQL connect')) { throw 'Missing PostgreSQL output' }
          if (-not $output.Contains('MySQL query')) { throw 'Missing MySQL output' }

      - name: Validate Kotlin
        shell: bash
        run: |
          set -euo pipefail
          kotlinc src/Enterprise/Kotlin/FactoryMethodExample.kt -include-runtime -d /tmp/factory-method-kotlin.jar
          output="$(java -jar /tmp/factory-method-kotlin.jar)"
          grep -Fq 'PostgreSQL connect' <<<"$output"
          grep -Fq 'MySQL query' <<<"$output"

      - name: Validate Swift
        shell: bash
        run: |
          set -euo pipefail
          swiftc src/Systems/Swift/factory_method.swift -o /tmp/factory-method-swift
          output="$(/tmp/factory-method-swift)"
          grep -Fq 'PostgreSQL connect' <<<"$output"
          grep -Fq 'MySQL query' <<<"$output"

  validate-portable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Setup Crystal
        uses: crystal-lang/install-crystal@v1

      - name: Setup runtimes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gnat gfortran fp-compiler ghc scala groovy nim

      - name: Validate Ada
        shell: bash
        run: |
          set -euo pipefail
          gnatmake -q -gnat2022 -gnatwa -gnatwe src/Historical/Ada/factory_method.adb -o /tmp/factory-method-ada
          output="$(/tmp/factory-method-ada)"
          grep -Fq 'PostgreSQL connect' <<<"$output"
          grep -Fq 'MySQL query' <<<"$output"

      - name: Validate Solidity
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          npx --yes solc@0.8.30 --bin --abi src/Niche/Solidity/FactoryMethod.sol -o "$out"
          test -n "$(find "$out" -type f -name '*FactoryMethodPostgresCreator.bin' -size +0c -print -quit)"
          test -n "$(find "$out" -type f -name '*FactoryMethodMySqlCreator.bin' -size +0c -print -quit)"

      - name: Validate Fortran
        shell: bash
        run: |
          set -euo pipefail
          gfortran -std=f2018 -Wall -Wextra -Werror src/Historical/Fortran/factory_method.f90 -o /tmp/factory-method-fortran
          output="$(/tmp/factory-method-fortran)"
          grep -Fq 'PostgreSQL connect' <<<"$output"
          grep -Fq 'MySQL query' <<<"$output"

      - name: Validate Pascal
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          fpc -Mobjfpc -O2 -Sew -FE"$out" src/Historical/Pascal/factory_method.pas >/dev/null
          output="$("$out/factory_method")"
          grep -Fq 'PostgreSQL connect' <<<"$output"
          grep -Fq 'MySQL query' <<<"$output"

      - name: Validate Zig
        shell: bash
        run: |
          set -euo pipefail
          zig fmt --check src/Systems/Zig/factory_method.zig
          output="$(zig run src/Systems/Zig/factory_method.zig 2>&1)"
          grep -Fq 'PostgreSQL connect' <<<"$output"
          grep -Fq 'MySQL query' <<<"$output"

      - name: Validate Nim
        shell: bash
        run: |
          set -euo pipefail
          nim c --hints:off --warnings:on -o:/tmp/factory-method-nim src/Niche/Nim/factory_method.nim
          output="$(/tmp/factory-method-nim)"
          grep -Fq 'PostgreSQL connect' <<<"$output"
          grep -Fq 'MySQL query' <<<"$output"

      - name: Validate Dart
        shell: bash
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed src/Web/Dart/factory_method.dart
          dart analyze --fatal-infos --fatal-warnings src/Web/Dart/factory_method.dart
          output="$(dart run src/Web/Dart/factory_method.dart)"
          grep -Fq 'PostgreSQL connect' <<<"$output"
          grep -Fq 'MySQL query' <<<"$output"

      - name: Validate Crystal
        shell: bash
        run: |
          set -euo pipefail
          crystal tool format src/Niche/Crystal/factory_method.cr
          test -z "$(git status --short -- src/Niche/Crystal/factory_method.cr)"
          crystal build --error-on-warnings src/Niche/Crystal/factory_method.cr -o /tmp/factory-method-crystal
          output="$(/tmp/factory-method-crystal)"
          grep -Fq 'PostgreSQL connect' <<<"$output"
          grep -Fq 'MySQL query' <<<"$output"

      - name: Validate Haskell
        shell: bash
        run: |
          set -euo pipefail
          output="$(runghc -Wall -Werror src/Functional/Haskell/FactoryMethod.hs)"
          grep -Fq 'PostgreSQL connect' <<<"$output"
          grep -Fq 'MySQL query' <<<"$output"

      - name: Validate Scala
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          scalac -deprecation -feature -unchecked src/Functional/Scala/FactoryMethod.scala -d "$out"
          output="$(scala -cp "$out" FactoryMethod)"
          grep -Fq 'PostgreSQL connect' <<<"$output"
          grep -Fq 'MySQL query' <<<"$output"

      - name: Validate Groovy
        shell: bash
        run: |
          set -euo pipefail
          groovyc -d /tmp/factory-method-groovy src/Scripting/Groovy/factory_method.groovy
          output="$(groovy src/Scripting/Groovy/factory_method.groovy)"
          grep -Fq 'PostgreSQL connect' <<<"$output"
          grep -Fq 'MySQL query' <<<"$output"

  validate-objective-c:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Objective-C
        shell: bash
        run: |
          set -euo pipefail
          clang -fobjc-arc -Wall -Wextra -Werror -framework Foundation src/Systems/Objective-C/factory_method.m -o /tmp/factory-method-objective-c
          output="$(/tmp/factory-method-objective-c 2>&1)"
          grep -Fq 'PostgreSQL connect' <<<"$output"
          grep -Fq 'MySQL query' <<<"$output"
