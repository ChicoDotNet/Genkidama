name: Memento Reconcile Diagnostic

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Report merge conflicts against current dev
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          set +e
          git merge --no-commit --no-ff origin/dev
          status=$?
          set -e
          echo "merge_exit=$status"
          conflicts="$(git diff --name-only --diff-filter=U || true)"
          if [[ -n "$conflicts" ]]; then
            echo "CONFLICTS_BEGIN"
            printf '%s\n' "$conflicts"
            echo "CONFLICTS_END"
          else
            echo "NO_CONFLICTS"
          fi
          git merge --abort || true
