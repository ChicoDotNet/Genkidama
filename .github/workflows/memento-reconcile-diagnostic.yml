name: Memento Reconcile Diagnostic

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Inspect Memento merge against dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Genkidama Merge Diagnostic"
          git config user.email "merge-diagnostic@users.noreply.github.com"
          git fetch origin patterns/memento-kb006 dev
          git checkout --detach origin/patterns/memento-kb006
          set +e
          git merge --no-commit --no-ff origin/dev
          status=$?
          set -e
          echo "merge_exit=$status"
          conflicts="$(git diff --name-only --diff-filter=U || true)"
          echo "CONFLICTS_BEGIN"
          printf '%s\n' "$conflicts"
          echo "CONFLICTS_END"
          git merge --abort || true
