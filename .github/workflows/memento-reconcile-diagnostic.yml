name: Memento Reconcile Diagnostic

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Replay Memento net-diff onto current dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Genkidama Merge Diagnostic"
          git config user.email "merge-diagnostic@users.noreply.github.com"
          git fetch origin patterns/memento-kb006 dev
          memento_head="$(git rev-parse origin/patterns/memento-kb006)"
          dev_head="$(git rev-parse origin/dev)"
          base="$(git merge-base "$memento_head" "$dev_head")"
          echo "memento_head=$memento_head"
          echo "dev_head=$dev_head"
          echo "merge_base=$base"
          git diff --binary "$base" "$memento_head" -- . > /tmp/memento.patch
          git checkout --detach "$dev_head"
          set +e
          git apply --3way --index /tmp/memento.patch
          apply_status=$?
          set -e
          echo "apply_exit=$apply_status"
          residual="$(git diff --name-only --diff-filter=U || true)"
          echo "RESIDUAL_CONFLICTS_BEGIN"
          printf '%s\n' "$residual"
          echo "RESIDUAL_CONFLICTS_END"
          if [[ $apply_status -ne 0 || -n "$residual" ]]; then
            exit 1
          fi
          git diff --cached --check
          echo "STAGED_FILES_BEGIN"
          git diff --cached --name-only
          echo "STAGED_FILES_END"
          git diff --cached --stat
          echo "RECONCILIATION_DRY_RUN_OK"
