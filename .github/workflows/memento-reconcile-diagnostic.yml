name: Memento Zig Format Repair

on:
  pull_request:
    branches: [dev]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Format reconciled Zig sweep with pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          expected_memento=84b0bac3b0efaab0c72c748c60a056b9169a852e
          expected_dev=785f6722112cda57a43c7cae26d006c43edd2a46
          zig_version=0.16.0
          zig_sha256=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00

          git config user.name "Genkidama Reconcile Bot"
          git config user.email "reconcile-bot@users.noreply.github.com"
          git fetch origin patterns/memento-kb006 dev
          test "$(git rev-parse origin/patterns/memento-kb006)" = "$expected_memento"
          test "$(git rev-parse origin/dev)" = "$expected_dev"
          git checkout -B repair origin/patterns/memento-kb006

          archive="$RUNNER_TEMP/zig-$zig_version.tar.xz"
          root="$RUNNER_TEMP/zig-$zig_version"
          curl -fsSL "https://ziglang.org/download/$zig_version/zig-x86_64-linux-$zig_version.tar.xz" -o "$archive"
          echo "$zig_sha256  $archive" | sha256sum -c -
          mkdir -p "$root"
          tar -xJf "$archive" --strip-components=1 -C "$root"
          export PATH="$root:$PATH"
          test "$(zig version)" = "$zig_version"

          before="$(git rev-parse HEAD:src/Systems/Zig/pattern_sweep.zig)"
          zig fmt src/Systems/Zig/pattern_sweep.zig
          zig fmt --check src/Systems/Zig/pattern_sweep.zig
          git diff --check -- src/Systems/Zig/pattern_sweep.zig
          changed="$(git diff --name-only)"
          test "$changed" = "src/Systems/Zig/pattern_sweep.zig"
          git add src/Systems/Zig/pattern_sweep.zig
          after="$(git hash-object src/Systems/Zig/pattern_sweep.zig)"
          test "$after" != "$before"
          git diff --cached --stat

          git fetch origin patterns/memento-kb006 dev
          test "$(git rev-parse origin/patterns/memento-kb006)" = "$expected_memento"
          test "$(git rev-parse origin/dev)" = "$expected_dev"
          git commit -m "style: format reconciled Zig Memento sweep"
          repaired="$(git rev-parse HEAD)"
          git push --force-with-lease=refs/heads/patterns/memento-kb006:$expected_memento origin HEAD:refs/heads/patterns/memento-kb006
          echo "MEMENTO_ZIG_FORMAT_PUSHED=$repaired"
