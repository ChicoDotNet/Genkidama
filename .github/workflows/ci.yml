name: Product CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  product:
    name: Product
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run Product contract
        run: eng/ci/run-product --telemetry-file artifacts/ci/product.jsonl

      - name: Upload Product telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-ci-telemetry-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/product.jsonl
          if-no-files-found: warn
          retention-days: 14
