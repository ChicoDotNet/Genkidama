name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Erlang for pattern validation
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'patterns/')
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28.5.0.4'

      - name: Setup Julia for pattern validation
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'patterns/')
        uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - name: Setup Zig for pattern validation
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'patterns/')
        uses: mlugg/setup-zig@v2

      - name: Setup Dart for pattern validation
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'patterns/')
        uses: dart-lang/setup-dart@v1

      - name: Setup Crystal for pattern validation
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'patterns/')
        uses: crystal-lang/install-crystal@v1

      - name: Setup additional pattern runtimes
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'patterns/')
        shell: bash
        run: |
          set -euo pipefail
          echo 'Updating apt metadata for pattern runtimes'
          sudo env DEBIAN_FRONTEND=noninteractive timeout --signal=TERM 5m apt-get update -o Acquire::Retries=3
          echo 'Installing pattern runtimes with a bounded non-interactive setup'
          sudo env DEBIAN_FRONTEND=noninteractive timeout --signal=TERM 20m apt-get install -o Acquire::Retries=3 --no-install-recommends -y fp-compiler octave r-base lua5.4 ghc gfortran ocaml sbcl scala clojure elixir swi-prolog-nox gnat gnucobol3 nasm nim groovy

      - name: Restore
        run: dotnet restore Genkidama.slnx

      - name: Build
        run: dotnet build Genkidama.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Genkidama.slnx --configuration Release --no-build --collect:"XPlat Code Coverage" --logger trx --results-directory TestResults

      - name: Validate portable Abstract Factory examples
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'patterns/')
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf 'Dark Button\nDark Checkbox\nLight Button\nLight Checkbox')"

          gcc -std=c17 -Wall -Wextra -Werror src/Systems/C/example1.c -o /tmp/abstract-factory-c
          /tmp/abstract-factory-c

          g++ -std=c++20 -Wall -Wextra -Werror 'src/Systems/C++/example1.cpp' -o /tmp/abstract-factory-cpp
          /tmp/abstract-factory-cpp

          work="$(mktemp -d)"
          dotnet new console --language VB --framework net10.0 --output "$work" --force >/dev/null
          cp src/Enterprise/VisualBasic/Example1.vb "$work/Program.vb"
          dotnet run --project "$work" --configuration Release

          dotnet fsi 'src/Functional/F#/example1.fsx'

          ruby -cw src/Scripting/RubyRB/example1.rb
          ruby src/Scripting/RubyRB/example1.rb

          perl -c src/Scripting/Perl/example1.pl
          perl src/Scripting/Perl/example1.pl

          bash -n src/Shell/Bash/example1.sh
          bash src/Shell/Bash/example1.sh

          pwsh -NoLogo -NoProfile -NonInteractive -File src/Shell/PowerShell/example1.ps1

          erlang_out="$(mktemp -d)"
          erlc -Werror -o "$erlang_out" src/Functional/Erlang/example1.erl
          erl -noshell -pa "$erlang_out" -eval 'example1:main(), halt().'

          pascal_out="$(mktemp -d)"
          fpc -Mobjfpc -O2 -Sew -FE"$pascal_out" src/Historical/Pascal/example1.pas
          "$pascal_out/example1"

          octave --no-gui --quiet --eval "addpath('src/DataScience/Octave'); example1();"

          Rscript --vanilla src/DataScience/R/example1.R

          lua5.4 src/Scripting/Lua/example1.lua

          runghc -Wall -Werror src/Functional/Haskell/Example1.hs

          command -v kotlinc >/dev/null
          kotlinc src/Enterprise/Kotlin/Example1.kt -include-runtime -d /tmp/abstract-factory-kotlin.jar
          java -jar /tmp/abstract-factory-kotlin.jar

          command -v swiftc >/dev/null
          swiftc src/Systems/Swift/example1.swift -o /tmp/abstract-factory-swift
          /tmp/abstract-factory-swift

          julia --startup-file=no src/DataScience/Julia/example1.jl

          scala_out="$(mktemp -d)"
          scalac -deprecation -feature -unchecked src/Functional/Scala/Example1.scala -d "$scala_out"
          scala -cp "$scala_out" Example1

          gfortran -std=f2018 -Wall -Wextra -Werror src/Historical/Fortran/example1.f90 -o /tmp/abstract-factory-fortran
          /tmp/abstract-factory-fortran

          ocamlc -w +A-70 -warn-error +A-70 src/Functional/OCaml/example1.ml -o /tmp/abstract-factory-ocaml
          /tmp/abstract-factory-ocaml

          sbcl --noinform --non-interactive --load src/Functional/Lisp/example1.lisp

          clojure src/Functional/Clojure/example1.clj

          elixir_out="$(mktemp -d)"
          PATH="/usr/bin:$PATH" elixirc --warnings-as-errors -o "$elixir_out" src/Functional/Elixir/example1.exs

          swipl -q -s src/Niche/Prolog/example1.pl -g run -t halt

          ada_out="$(mktemp -d)"
          gnatmake -q -gnat2022 -gnatwa -gnatwe -D "$ada_out" src/Historical/Ada/example1.adb -o /tmp/abstract-factory-ada
          /tmp/abstract-factory-ada

          solidity_out="$(mktemp -d)"
          npx --yes solc@0.8.30 --bin --abi src/Niche/Solidity/Example1.sol -o "$solidity_out"
          test -n "$(find "$solidity_out" -type f -name '*_Example1.bin' -size +0c -print -quit)"

          cobc -x -Wall src/Historical/Cobol/example1.cbl -o /tmp/abstract-factory-cobol
          /tmp/abstract-factory-cobol

          nasm -f elf64 -Wall src/LowLevel/Assembly/example1.asm -o /tmp/abstract-factory-assembly.o
          ld /tmp/abstract-factory-assembly.o -o /tmp/abstract-factory-assembly
          assembly_output="$(/tmp/abstract-factory-assembly)"
          test "$assembly_output" = "$expected"

          zig fmt --check src/Systems/Zig/example1.zig
          zig_output="$(zig run src/Systems/Zig/example1.zig 2>&1)"
          test "$zig_output" = "$expected"

          nim c --hints:off --warnings:on -o:/tmp/abstract-factory-nim src/Niche/Nim/example1.nim
          nim_output="$(/tmp/abstract-factory-nim)"
          test "$nim_output" = "$expected"

          dart format --output=none --set-exit-if-changed src/Web/Dart/example1.dart
          dart analyze --fatal-infos --fatal-warnings src/Web/Dart/example1.dart
          dart_output="$(dart run src/Web/Dart/example1.dart)"
          test "$dart_output" = "$expected"

          crystal tool format src/Niche/Crystal/example1.cr
          git diff -- src/Niche/Crystal/example1.cr
          test -z "$(git status --short -- src/Niche/Crystal/example1.cr)"

          crystal build --error-on-warnings src/Niche/Crystal/example1.cr -o /tmp/abstract-factory-crystal
          crystal_output="$(/tmp/abstract-factory-crystal)"
          test "$crystal_output" = "$expected"

          groovyc -d /tmp/abstract-factory-groovy src/Scripting/Groovy/example1.groovy
          groovy_output="$(groovy src/Scripting/Groovy/example1.groovy)"
          test "$groovy_output" = "$expected"

      - name: Pack CLI Tool
        run: dotnet pack src/Genkidama.Cli/Genkidama.Cli.csproj --configuration Release --no-build --output artifacts/packages

  objective-c-abstract-factory:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'patterns/')
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Objective-C Abstract Factory with Foundation
        shell: bash
        run: |
          set -euo pipefail
          clang -fobjc-arc -Wall -Wextra -Werror -framework Foundation \
            src/Systems/Objective-C/example1.m \
            -o /tmp/abstract-factory-objective-c
          output="$(/tmp/abstract-factory-objective-c 2>&1)"
          printf '%s\n' "$output"
          grep -Fq 'Dark Button' <<<"$output"
          grep -Fq 'Dark Checkbox' <<<"$output"
          grep -Fq 'Light Button' <<<"$output"
          grep -Fq 'Light Checkbox' <<<"$output"

  factory-method-mainstream:
    if: github.event_name == 'pull_request' && github.head_ref == 'patterns/factory-method-kb006'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup portable runtimes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y php-cli lua5.4 ruby

      - name: Validate mainstream and portable Factory Method examples
        shell: bash
        run: |
          set -euo pipefail
          assert_output() {
            local output="$1"
            grep -Fq 'PostgreSQL connect' <<<"$output"
            grep -Fq 'MySQL query' <<<"$output"
          }

          work="$(mktemp -d)"
          dotnet new console --framework net10.0 --output "$work/csharp" --force >/dev/null
          cp 'src/Enterprise/C#/FactoryMethodExample.cs' "$work/csharp/Program.cs"
          assert_output "$(dotnet run --project "$work/csharp" --configuration Release)"

          java_out="$work/java"
          mkdir -p "$java_out"
          javac -Xlint:all -Werror -d "$java_out" src/Enterprise/Java/FactoryMethodExample.java
          assert_output "$(java -cp "$java_out" FactoryMethodExample)"

          python -m py_compile src/Scripting/PythonPY/factory_method.py
          assert_output "$(python src/Scripting/PythonPY/factory_method.py)"

          node --check src/Web/JavaScriptJS/factory_method.js
          assert_output "$(node src/Web/JavaScriptJS/factory_method.js)"

          ts_out="$work/typescript"
          npx --yes --package typescript@6.0.3 tsc src/Web/TypeScriptTS/factory_method.ts --strict --target ES2024 --module commonjs --outDir "$ts_out"
          assert_output "$(node "$ts_out/factory_method.js")"

          test -z "$(gofmt -d src/Systems/Go/factory_method.go)"
          go vet src/Systems/Go/factory_method.go
          assert_output "$(go run src/Systems/Go/factory_method.go)"

          rustfmt --check src/Systems/Rust/factory_method.rs
          rustc -D warnings src/Systems/Rust/factory_method.rs -o "$work/factory-method-rust"
          assert_output "$("$work/factory-method-rust")"

          php -l src/Scripting/PHP/factory_method.php >/dev/null
          assert_output "$(php src/Scripting/PHP/factory_method.php)"

          gcc -std=c17 -Wall -Wextra -Werror src/Systems/C/factory_method.c -o "$work/factory-method-c"
          assert_output "$("$work/factory-method-c")"

          g++ -std=c++20 -Wall -Wextra -Werror 'src/Systems/C++/factory_method.cpp' -o "$work/factory-method-cpp"
          assert_output "$("$work/factory-method-cpp")"

          vb="$work/vb"
          dotnet new console --language VB --framework net10.0 --output "$vb" --force >/dev/null
          cp src/Enterprise/VisualBasic/FactoryMethodExample.vb "$vb/Program.vb"
          assert_output "$(dotnet run --project "$vb" --configuration Release)"

          assert_output "$(dotnet fsi 'src/Functional/F#/factory_method.fsx')"

          ruby -cw src/Scripting/RubyRB/factory_method.rb
          assert_output "$(ruby src/Scripting/RubyRB/factory_method.rb)"
          assert_output "$(lua5.4 src/Scripting/Lua/factory_method.lua)"
          bash -n src/Shell/Bash/factory_method.sh
          assert_output "$(bash src/Shell/Bash/factory_method.sh)"
          assert_output "$(pwsh -NoLogo -NoProfile -NonInteractive -File src/Shell/PowerShell/factory_method.ps1)"

          kotlinc src/Enterprise/Kotlin/FactoryMethodExample.kt -include-runtime -d "$work/factory-method-kotlin.jar"
          assert_output "$(java -jar "$work/factory-method-kotlin.jar")"

          swiftc src/Systems/Swift/factory_method.swift -o "$work/factory-method-swift"
          assert_output "$("$work/factory-method-swift")"

  factory-method-portable:
    if: github.event_name == 'pull_request' && github.head_ref == 'patterns/factory-method-kb006'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Setup Crystal
        uses: crystal-lang/install-crystal@v1

      - name: Setup portable runtimes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gnat gfortran fp-compiler ghc scala groovy nim

      - name: Validate extended portable Factory Method examples
        shell: bash
        run: |
          set -euo pipefail
          assert_output() {
            local output="$1"
            grep -Fq 'PostgreSQL connect' <<<"$output"
            grep -Fq 'MySQL query' <<<"$output"
          }

          work="$(mktemp -d)"
          gnatmake -q -gnat2022 -gnatwa -gnatwe src/Historical/Ada/factory_method.adb -o "$work/factory-method-ada"
          assert_output "$("$work/factory-method-ada")"

          sol="$work/solidity"
          mkdir -p "$sol"
          npx --yes solc@0.8.30 --bin --abi src/Niche/Solidity/FactoryMethod.sol -o "$sol"
          test -n "$(find "$sol" -type f -name '*FactoryMethodPostgresCreator.bin' -size +0c -print -quit)"
          test -n "$(find "$sol" -type f -name '*FactoryMethodMySqlCreator.bin' -size +0c -print -quit)"

          gfortran -std=f2018 -Wall -Wextra -Werror src/Historical/Fortran/factory_method.f90 -o "$work/factory-method-fortran"
          assert_output "$("$work/factory-method-fortran")"

          pas="$work/pascal"
          mkdir -p "$pas"
          fpc -Mobjfpc -O2 -Sew -FE"$pas" src/Historical/Pascal/factory_method.pas >/dev/null
          assert_output "$("$pas/factory_method")"

          zig fmt --check src/Systems/Zig/factory_method.zig
          assert_output "$(zig run src/Systems/Zig/factory_method.zig 2>&1)"

          nim c --hints:off --warnings:on -o:"$work/factory-method-nim" src/Niche/Nim/factory_method.nim
          assert_output "$("$work/factory-method-nim")"

          dart format --output=none --set-exit-if-changed src/Web/Dart/factory_method.dart
          dart analyze --fatal-infos --fatal-warnings src/Web/Dart/factory_method.dart
          assert_output "$(dart run src/Web/Dart/factory_method.dart)"

          crystal tool format src/Niche/Crystal/factory_method.cr
          test -z "$(git status --short -- src/Niche/Crystal/factory_method.cr)"
          crystal build --error-on-warnings src/Niche/Crystal/factory_method.cr -o "$work/factory-method-crystal"
          assert_output "$("$work/factory-method-crystal")"

          assert_output "$(runghc -Wall -Werror src/Functional/Haskell/FactoryMethod.hs)"

          scala_out="$work/scala"
          mkdir -p "$scala_out"
          scalac -deprecation -feature -unchecked src/Functional/Scala/FactoryMethod.scala -d "$scala_out"
          assert_output "$(scala -cp "$scala_out" FactoryMethod)"

          groovyc -d "$work/groovy" src/Scripting/Groovy/factory_method.groovy
          assert_output "$(groovy src/Scripting/Groovy/factory_method.groovy)"

  factory-method-objective-c:
    if: github.event_name == 'pull_request' && github.head_ref == 'patterns/factory-method-kb006'
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Objective-C Factory Method with Foundation
        shell: bash
        run: |
          set -euo pipefail
          clang -fobjc-arc -Wall -Wextra -Werror -framework Foundation \
            src/Systems/Objective-C/factory_method.m \
            -o /tmp/factory-method-objective-c
          output="$(/tmp/factory-method-objective-c 2>&1)"
          grep -Fq 'PostgreSQL connect' <<<"$output"
          grep -Fq 'MySQL query' <<<"$output"