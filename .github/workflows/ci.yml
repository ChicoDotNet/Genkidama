name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Genkidama.sln

      - name: Build
        run: dotnet build Genkidama.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Genkidama.sln --configuration Release --no-build --collect:"XPlat Code Coverage"
