name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Erlang for pattern validation
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'patterns/')
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28.5.0.4'

      - name: Setup Julia for pattern validation
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'patterns/')
        uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - name: Setup Zig for pattern validation
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'patterns/')
        uses: mlugg/setup-zig@v2

      - name: Setup Dart for pattern validation
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'patterns/')
        uses: dart-lang/setup-dart@v1

      - name: Setup Crystal for pattern validation
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'patterns/')
        uses: crystal-lang/install-crystal@v1

      - name: Setup additional pattern runtimes
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'patterns/')
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fp-compiler octave r-base lua5.4 ghc gfortran ocaml sbcl scala clojure elixir swi-prolog-nox gnat gnucobol3 nasm nim groovy

      - name: Restore
        run: dotnet restore Genkidama.slnx

      - name: Build
        run: dotnet build Genkidama.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Genkidama.slnx --configuration Release --no-build --collect:"XPlat Code Coverage" --logger trx --results-directory TestResults

      - name: Validate portable Abstract Factory examples
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'patterns/')
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf 'Dark Button\nDark Checkbox\nLight Button\nLight Checkbox')"

          gcc -std=c17 -Wall -Wextra -Werror src/Systems/C/example1.c -o /tmp/abstract-factory-c
          /tmp/abstract-factory-c

          g++ -std=c++20 -Wall -Wextra -Werror 'src/Systems/C++/example1.cpp' -o /tmp/abstract-factory-cpp
          /tmp/abstract-factory-cpp

          work="$(mktemp -d)"
          dotnet new console --language VB --framework net10.0 --output "$work" --force >/dev/null
          cp src/Enterprise/VisualBasic/Example1.vb "$work/Program.vb"
          dotnet run --project "$work" --configuration Release

          dotnet fsi 'src/Functional/F#/example1.fsx'

          ruby -cw src/Scripting/RubyRB/example1.rb
          ruby src/Scripting/RubyRB/example1.rb

          perl -c src/Scripting/Perl/example1.pl
          perl src/Scripting/Perl/example1.pl

          bash -n src/Shell/Bash/example1.sh
          bash src/Shell/Bash/example1.sh

          pwsh -NoLogo -NoProfile -NonInteractive -File src/Shell/PowerShell/example1.ps1

          erlang_out="$(mktemp -d)"
          erlc -Werror -o "$erlang_out" src/Functional/Erlang/example1.erl
          erl -noshell -pa "$erlang_out" -eval 'example1:main(), halt().'

          pascal_out="$(mktemp -d)"
          fpc -Mobjfpc -O2 -Sew -FE"$pascal_out" src/Historical/Pascal/example1.pas
          "$pascal_out/example1"

          octave --no-gui --quiet --eval "addpath('src/DataScience/Octave'); example1();"

          Rscript --vanilla src/DataScience/R/example1.R

          lua5.4 src/Scripting/Lua/example1.lua

          runghc -Wall -Werror src/Functional/Haskell/Example1.hs

          command -v kotlinc >/dev/null
          kotlinc src/Enterprise/Kotlin/Example1.kt -include-runtime -d /tmp/abstract-factory-kotlin.jar
          java -jar /tmp/abstract-factory-kotlin.jar

          command -v swiftc >/dev/null
          swiftc src/Systems/Swift/example1.swift -o /tmp/abstract-factory-swift
          /tmp/abstract-factory-swift

          julia --startup-file=no src/DataScience/Julia/example1.jl

          scala_out="$(mktemp -d)"
          scalac -deprecation -feature -unchecked src/Functional/Scala/Example1.scala -d "$scala_out"
          scala -cp "$scala_out" Example1

          gfortran -std=f2018 -Wall -Wextra -Werror src/Historical/Fortran/example1.f90 -o /tmp/abstract-factory-fortran
          /tmp/abstract-factory-fortran

          ocamlc -w +A-70 -warn-error +A-70 src/Functional/OCaml/example1.ml -o /tmp/abstract-factory-ocaml
          /tmp/abstract-factory-ocaml

          sbcl --noinform --non-interactive --load src/Functional/Lisp/example1.lisp

          clojure src/Functional/Clojure/example1.clj

          elixir_out="$(mktemp -d)"
          PATH="/usr/bin:$PATH" elixirc --warnings-as-errors -o "$elixir_out" src/Functional/Elixir/example1.exs

          swipl -q -s src/Niche/Prolog/example1.pl -g run -t halt

          ada_out="$(mktemp -d)"
          gnatmake -q -gnat2022 -gnatwa -gnatwe -D "$ada_out" src/Historical/Ada/example1.adb -o /tmp/abstract-factory-ada
          /tmp/abstract-factory-ada

          solidity_out="$(mktemp -d)"
          npx --yes solc@0.8.30 --bin --abi src/Niche/Solidity/Example1.sol -o "$solidity_out"
          test -n "$(find "$solidity_out" -type f -name '*_Example1.bin' -size +0c -print -quit)"

          cobc -x -Wall src/Historical/Cobol/example1.cbl -o /tmp/abstract-factory-cobol
          /tmp/abstract-factory-cobol

          nasm -f elf64 -Wall src/LowLevel/Assembly/example1.asm -o /tmp/abstract-factory-assembly.o
          ld /tmp/abstract-factory-assembly.o -o /tmp/abstract-factory-assembly
          assembly_output="$(/tmp/abstract-factory-assembly)"
          test "$assembly_output" = "$expected"

          zig fmt --check src/Systems/Zig/example1.zig
          zig_output="$(zig run src/Systems/Zig/example1.zig 2>&1)"
          test "$zig_output" = "$expected"

          nim c --hints:off --warnings:on -o:/tmp/abstract-factory-nim src/Niche/Nim/example1.nim
          nim_output="$(/tmp/abstract-factory-nim)"
          test "$nim_output" = "$expected"

          dart format --output=none --set-exit-if-changed src/Web/Dart/example1.dart
          dart analyze --fatal-infos --fatal-warnings src/Web/Dart/example1.dart
          dart_output="$(dart run src/Web/Dart/example1.dart)"
          test "$dart_output" = "$expected"

          crystal tool format src/Niche/Crystal/example1.cr
          git diff -- src/Niche/Crystal/example1.cr
          test -z "$(git status --short -- src/Niche/Crystal/example1.cr)"

          crystal build --error-on-warnings src/Niche/Crystal/example1.cr -o /tmp/abstract-factory-crystal
          crystal_output="$(/tmp/abstract-factory-crystal)"
          test "$crystal_output" = "$expected"

          groovyc -d /tmp/abstract-factory-groovy src/Scripting/Groovy/example1.groovy
          groovy_output="$(groovy src/Scripting/Groovy/example1.groovy)"
          test "$groovy_output" = "$expected"

      - name: Pack CLI Tool
        run: dotnet pack src/Genkidama.Cli/Genkidama.Cli.csproj --configuration Release --no-build --output artifacts/packages

  objective-c-abstract-factory:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'patterns/')
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Objective-C Abstract Factory with Foundation
        shell: bash
        run: |
          set -euo pipefail
          clang -fobjc-arc -Wall -Wextra -Werror -framework Foundation \
            src/Systems/Objective-C/example1.m \
            -o /tmp/abstract-factory-objective-c
          output="$(/tmp/abstract-factory-objective-c 2>&1)"
          printf '%s\n' "$output"
          grep -Fq 'Dark Button' <<<"$output"
          grep -Fq 'Dark Checkbox' <<<"$output"
          grep -Fq 'Light Button' <<<"$output"
          grep -Fq 'Light Checkbox' <<<"$output"

  decorator-mainstream:
    if: github.event_name == 'pull_request' && github.head_ref == 'patterns/decorator-kb006'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate Decorator mainstream examples
        shell: bash
        run: |
          set -euo pipefail
          assert_output() {
            local output="$1"
            grep -Fxq 'base=alert' <<<"$output"
            grep -Fxq 'audit=audit(alert)' <<<"$output"
            grep -Fxq 'encrypted=enc(alert)' <<<"$output"
            grep -Fxq 'stacked=audit(enc(alert))' <<<"$output"
          }

          work="$(mktemp -d)"
          dotnet new console --framework net10.0 --output "$work/csharp" --force >/dev/null
          cp 'src/Enterprise/C#/DecoratorExample.cs' "$work/csharp/Program.cs"
          assert_output "$(dotnet run --project "$work/csharp" --configuration Release)"

          python -m py_compile src/Scripting/PythonPY/decorator.py
          assert_output "$(python src/Scripting/PythonPY/decorator.py)"

          node --check src/Web/JavaScriptJS/decorator.js
          assert_output "$(node src/Web/JavaScriptJS/decorator.js)"

          npx --yes --package typescript@6.0.3 tsc src/Web/TypeScriptTS/decorator.ts --strict --target ES2024 --module commonjs --outDir "$work/typescript"
          assert_output "$(node "$work/typescript/decorator.js")"

          test -z "$(gofmt -d src/Systems/Go/decorator.go)"
          go vet src/Systems/Go/decorator.go
          assert_output "$(go run src/Systems/Go/decorator.go)"

          rustfmt --check src/Systems/Rust/decorator.rs
          rustc -D warnings src/Systems/Rust/decorator.rs -o "$work/decorator-rust"
          assert_output "$("$work/decorator-rust")"

          g++ -std=c++20 -Wall -Wextra -Werror 'src/Systems/C++/decorator.cpp' -o "$work/decorator-cpp"
          assert_output "$("$work/decorator-cpp")"

          javac -Xlint:all -Werror -d "$work/java" src/Enterprise/Java/DecoratorExample.java
          assert_output "$(java -cp "$work/java" DecoratorExample)"

          php -l src/Scripting/PHP/decorator.php
          assert_output "$(php src/Scripting/PHP/decorator.php)"

          command -v kotlinc >/dev/null
          kotlinc src/Enterprise/Kotlin/DecoratorExample.kt -include-runtime -d "$work/decorator-kotlin.jar"
          assert_output "$(java -jar "$work/decorator-kotlin.jar")"

          command -v swiftc >/dev/null
          swiftc src/Systems/Swift/decorator.swift -o "$work/decorator-swift"
          assert_output "$("$work/decorator-swift")"

          assert_output "$(dotnet fsi 'src/Functional/F#/decorator.fsx')"

  decorator-portable:
    if: github.event_name == 'pull_request' && github.head_ref == 'patterns/decorator-kb006'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install portable runtimes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fp-compiler lua5.4 ghc scala perl powershell ruby

      - name: Validate Decorator portable examples
        shell: bash
        run: |
          set -euo pipefail
          assert_output() {
            local output="$1"
            grep -Fxq 'base=alert' <<<"$output"
            grep -Fxq 'audit=audit(alert)' <<<"$output"
            grep -Fxq 'encrypted=enc(alert)' <<<"$output"
            grep -Fxq 'stacked=audit(enc(alert))' <<<"$output"
          }

          work="$(mktemp -d)"
          dotnet new console --language VB --framework net10.0 --output "$work/vb" --force >/dev/null
          cp src/Enterprise/VisualBasic/DecoratorExample.vb "$work/vb/Program.vb"
          assert_output "$(dotnet run --project "$work/vb" --configuration Release)"

          gcc -std=c17 -Wall -Wextra -Werror src/Systems/C/decorator.c -o "$work/decorator-c"
          assert_output "$("$work/decorator-c")"

          ruby -cw src/Scripting/RubyRB/decorator.rb
          assert_output "$(ruby src/Scripting/RubyRB/decorator.rb)"

          assert_output "$(lua5.4 src/Scripting/Lua/decorator.lua)"

          bash -n src/Shell/Bash/decorator.sh
          assert_output "$(bash src/Shell/Bash/decorator.sh)"

          assert_output "$(pwsh -NoLogo -NoProfile -NonInteractive -File src/Shell/PowerShell/decorator.ps1)"

          assert_output "$(runghc -Wall -Werror src/Functional/Haskell/Decorator.hs)"

          scala_out="$(mktemp -d)"
          scalac -deprecation -feature -unchecked src/Functional/Scala/Decorator.scala -d "$scala_out"
          assert_output "$(scala -cp "$scala_out" Decorator)"

          perl -c src/Scripting/Perl/decorator.pl
          assert_output "$(perl src/Scripting/Perl/decorator.pl)"

          pascal_out="$(mktemp -d)"
          fpc -Mobjfpc -O2 -Sew -FE"$pascal_out" src/Historical/Pascal/decorator.pas >/dev/null
          assert_output "$("$pascal_out/decorator")"

  decorator-functional:
    if: github.event_name == 'pull_request' && github.head_ref == 'patterns/decorator-kb006'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28.5.0.4'
          elixir-version: '1.19.1'

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - name: Install functional runtimes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y r-base octave ocaml sbcl clojure swi-prolog-nox groovy

      - name: Validate Decorator functional examples
        shell: bash
        run: |
          set -euo pipefail
          assert_output() {
            local output="$1"
            grep -Fxq 'base=alert' <<<"$output"
            grep -Fxq 'audit=audit(alert)' <<<"$output"
            grep -Fxq 'encrypted=enc(alert)' <<<"$output"
            grep -Fxq 'stacked=audit(enc(alert))' <<<"$output"
          }

          assert_output "$(Rscript --vanilla src/DataScience/R/decorator.R)"
          assert_output "$(octave --no-gui --quiet --eval "addpath('src/DataScience/Octave'); decorator();")"
          assert_output "$(julia --startup-file=no src/DataScience/Julia/decorator.jl)"

          ocamlc -w +A-70 -warn-error +A-70 src/Functional/OCaml/decorator.ml -o /tmp/decorator-ocaml
          assert_output "$(/tmp/decorator-ocaml)"

          assert_output "$(sbcl --noinform --non-interactive --load src/Functional/Lisp/decorator.lisp)"
          assert_output "$(clojure src/Functional/Clojure/decorator.clj)"

          elixir_out="$(mktemp -d)"
          elixirc --warnings-as-errors -o "$elixir_out" src/Functional/Elixir/decorator.exs >/dev/null
          assert_output "$(elixir src/Functional/Elixir/decorator.exs)"

          erlang_out="$(mktemp -d)"
          erlc -Werror -o "$erlang_out" src/Functional/Erlang/decorator.erl
          assert_output "$(erl -noshell -pa "$erlang_out" -eval 'decorator:main(), halt().')"

          assert_output "$(swipl -q -s src/Niche/Prolog/decorator.pl -g run -t halt)"

          groovyc -d /tmp/decorator-groovy src/Scripting/Groovy/decorator.groovy
          assert_output "$(groovy src/Scripting/Groovy/decorator.groovy)"
