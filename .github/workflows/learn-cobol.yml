name: Learn COBOL

on:
  pull_request:
    paths:
      - 'learn/es/cobol/**'
      - '.github/workflows/learn-cobol.yml'
  push:
    branches:
      - main
    paths:
      - 'learn/es/cobol/**'
      - '.github/workflows/learn-cobol.yml'

permissions:
  contents: read

jobs:
  cobol:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Homebrew
        run: echo '/home/linuxbrew/.linuxbrew/bin' >> "$GITHUB_PATH"

      - name: Install GnuCOBOL 3.2
        run: |
          brew update
          brew install gnucobol
          echo "LD_LIBRARY_PATH=$(brew --prefix gnucobol)/lib" >> "$GITHUB_ENV"
          cobc --version

      - name: Verify NominaBatch
        working-directory: learn/es/cobol/app
        run: bash tests/smoke.sh
