name: Pattern Builder Portable 2

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/pattern-builder-portable2.yml'
      - 'src/Enterprise/VisualBasic/BuilderExample.vb'
      - 'src/Systems/Objective-C/builder.m'
      - 'src/Systems/Zig/builder.zig'
      - 'src/Niche/Nim/builder.nim'
      - 'src/Web/Dart/builder.dart'
      - 'src/Niche/Crystal/builder.cr'
      - 'src/Scripting/Groovy/builder.groovy'
      - 'src/Functional/OCaml/builder.ml'
      - 'src/DataScience/Julia/builder.jl'
      - 'src/Functional/Lisp/builder.lisp'
      - 'wiki/Builder.md'

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: '10.0.x' }
      - uses: mlugg/setup-zig@v2
      - uses: dart-lang/setup-dart@v1
      - uses: crystal-lang/install-crystal@v1
      - uses: julia-actions/setup-julia@v2
        with: { version: '1' }
      - name: Setup runtimes
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y nim groovy ocaml sbcl

      - name: Validate Visual Basic .NET Builder
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          dotnet new console --language VB --framework net10.0 --output "$work" --force >/dev/null
          cp src/Enterprise/VisualBasic/BuilderExample.vb "$work/Program.vb"
          output="$(dotnet run --project "$work" -c Release)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Zig Builder
        shell: bash
        run: |
          set -euo pipefail
          zig fmt --check src/Systems/Zig/builder.zig
          output="$(zig run src/Systems/Zig/builder.zig 2>&1)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Nim Builder
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          nim c --hints:off --warnings:on -o:"$work/builder" src/Niche/Nim/builder.nim
          output="$("$work/builder")"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Dart Builder
        shell: bash
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed src/Web/Dart/builder.dart
          dart analyze --fatal-infos --fatal-warnings src/Web/Dart/builder.dart
          output="$(dart run src/Web/Dart/builder.dart)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Crystal Builder
        shell: bash
        run: |
          set -euo pipefail
          crystal tool format src/Niche/Crystal/builder.cr
          test -z "$(git status --short -- src/Niche/Crystal/builder.cr)"
          work="$(mktemp -d)"
          crystal build --error-on-warnings src/Niche/Crystal/builder.cr -o "$work/builder"
          output="$("$work/builder")"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Groovy Builder
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          groovyc -d "$work" src/Scripting/Groovy/builder.groovy
          output="$(groovy src/Scripting/Groovy/builder.groovy)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate OCaml Builder
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          ocamlc -w +A-70 -warn-error +A-70 src/Functional/OCaml/builder.ml -o "$work/builder"
          output="$("$work/builder")"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Julia Builder
        shell: bash
        run: |
          set -euo pipefail
          output="$(julia --startup-file=no src/DataScience/Julia/builder.jl)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Common Lisp Builder
        shell: bash
        run: |
          set -euo pipefail
          output="$(sbcl --noinform --non-interactive --load src/Functional/Lisp/builder.lisp)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

  objective-c:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Objective-C Builder
        shell: bash
        run: |
          set -euo pipefail
          clang -fobjc-arc -Wall -Wextra -Werror -framework Foundation src/Systems/Objective-C/builder.m -o /tmp/builder-objc
          output="$(/tmp/builder-objc 2>&1)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"
