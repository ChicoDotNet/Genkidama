name: Pattern Builder Portable 2

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/pattern-builder-portable2.yml'
      - 'src/Enterprise/Java/BuilderExample.java'
      - 'src/Enterprise/Kotlin/BuilderExample.kt'
      - 'src/Enterprise/VisualBasic/BuilderExample.vb'
      - 'src/Systems/Objective-C/builder.m'
      - 'src/Systems/Zig/builder.zig'
      - 'src/Systems/Rust/builder.rs'
      - 'src/Systems/C/builder.c'
      - 'src/Systems/C++/builder.cpp'
      - 'src/Systems/Swift/builder.swift'
      - 'src/Niche/Nim/builder.nim'
      - 'src/Web/Dart/builder.dart'
      - 'src/Web/TypeScriptTS/builder.ts'
      - 'src/Niche/Crystal/builder.cr'
      - 'src/Scripting/Groovy/builder.groovy'
      - 'src/Scripting/PHP/builder.php'
      - 'src/Scripting/RubyRB/builder.rb'
      - 'src/Scripting/Lua/builder.lua'
      - 'src/Shell/Bash/builder.sh'
      - 'src/Functional/OCaml/builder.ml'
      - 'src/DataScience/Julia/builder.jl'
      - 'src/Functional/Lisp/builder.lisp'
      - 'wiki/Builder.md'

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: '10.0.x' }
      - uses: mlugg/setup-zig@v2
      - uses: dart-lang/setup-dart@v1
      - uses: crystal-lang/install-crystal@v1
      - uses: julia-actions/setup-julia@v2
        with: { version: '1' }
      - name: Setup runtimes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y nim groovy ocaml sbcl lua5.4 php-cli ruby
          command -v node
          command -v javac
          command -v rustc
          command -v rustfmt
          command -v gcc
          command -v g++
          command -v kotlinc
          command -v swiftc

      - name: Validate Visual Basic .NET Builder
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          dotnet new console --language VB --framework net10.0 --output "$work" --force >/dev/null
          cp src/Enterprise/VisualBasic/BuilderExample.vb "$work/Program.vb"
          output="$(dotnet run --project "$work" -c Release)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Zig Builder
        shell: bash
        run: |
          set -euo pipefail
          zig fmt --check src/Systems/Zig/builder.zig
          output="$(zig run src/Systems/Zig/builder.zig 2>&1)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Nim Builder
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          nim c --hints:off --warnings:on -o:"$work/builder" src/Niche/Nim/builder.nim
          output="$("$work/builder")"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Dart Builder
        shell: bash
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed src/Web/Dart/builder.dart
          dart analyze --fatal-infos --fatal-warnings src/Web/Dart/builder.dart
          output="$(dart run src/Web/Dart/builder.dart)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Crystal Builder
        shell: bash
        run: |
          set -euo pipefail
          crystal tool format src/Niche/Crystal/builder.cr
          test -z "$(git status --short -- src/Niche/Crystal/builder.cr)"
          work="$(mktemp -d)"
          crystal build --error-on-warnings src/Niche/Crystal/builder.cr -o "$work/builder"
          output="$("$work/builder")"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Groovy Builder
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          groovyc -d "$work" src/Scripting/Groovy/builder.groovy
          output="$(groovy src/Scripting/Groovy/builder.groovy)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate OCaml Builder
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          ocamlc -w +A-70 -warn-error +A-70 src/Functional/OCaml/builder.ml -o "$work/builder"
          output="$("$work/builder")"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Julia Builder
        shell: bash
        run: |
          set -euo pipefail
          output="$(julia --startup-file=no src/DataScience/Julia/builder.jl)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Common Lisp Builder
        shell: bash
        run: |
          set -euo pipefail
          output="$(sbcl --noinform --non-interactive --load src/Functional/Lisp/builder.lisp)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate TypeScript Builder
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          npx --yes typescript@6.0.3 tsc src/Web/TypeScriptTS/builder.ts --strict --target ES2024 --module commonjs --outDir "$work"
          output="$(node "$work/builder.js")"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Java Builder
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          javac -Xlint:all -Werror -d "$work" src/Enterprise/Java/BuilderExample.java
          output="$(java -cp "$work" BuilderExample)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Rust Builder
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          rustfmt --check src/Systems/Rust/builder.rs
          rustc -D warnings src/Systems/Rust/builder.rs -o "$work/builder"
          output="$("$work/builder")"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate C++ Builder
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          g++ -std=c++20 -Wall -Wextra -Werror 'src/Systems/C++/builder.cpp' -o "$work/builder"
          output="$("$work/builder")"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate C Builder
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          gcc -std=c17 -Wall -Wextra -Werror src/Systems/C/builder.c -o "$work/builder"
          output="$("$work/builder")"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Ruby Builder
        shell: bash
        run: |
          set -euo pipefail
          ruby -cw src/Scripting/RubyRB/builder.rb
          output="$(ruby src/Scripting/RubyRB/builder.rb)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate PHP Builder
        shell: bash
        run: |
          set -euo pipefail
          php -l src/Scripting/PHP/builder.php
          output="$(php src/Scripting/PHP/builder.php)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Lua Builder
        shell: bash
        run: |
          set -euo pipefail
          output="$(lua5.4 src/Scripting/Lua/builder.lua)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Bash Builder
        shell: bash
        run: |
          set -euo pipefail
          bash -n src/Shell/Bash/builder.sh
          output="$(bash src/Shell/Bash/builder.sh)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Kotlin Builder
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          kotlinc src/Enterprise/Kotlin/BuilderExample.kt -include-runtime -d "$work/builder.jar"
          output="$(java -jar "$work/builder.jar")"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

      - name: Validate Swift Builder
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          swiftc src/Systems/Swift/builder.swift -o "$work/builder"
          output="$("$work/builder")"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

  objective-c:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Objective-C Builder
        shell: bash
        run: |
          set -euo pipefail
          clang -fobjc-arc -Wall -Wextra -Werror -framework Foundation src/Systems/Objective-C/builder.m -o /tmp/builder-objc
          output="$(/tmp/builder-objc 2>&1)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"
