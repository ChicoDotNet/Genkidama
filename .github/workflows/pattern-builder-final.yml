name: Pattern Builder Final

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/pattern-builder-final.yml'
      - 'src/Historical/Ada/builder.adb'
      - 'src/Niche/Solidity/Builder.sol'
      - 'src/Historical/Fortran/builder.f90'
      - 'src/Historical/Cobol/builder.cbl'
      - 'src/LowLevel/Assembly/builder.asm'
      - 'src/Niche/GDScript/builder.gd'
      - 'src/DataScience/MATLAB/builder.m'
      - 'src/Shell/VBA/builder.bas'
      - 'src/Enterprise/Delphi/Builder.pas'
      - 'src/Other/MicroPython/builder.py'
      - 'src/Other/Rockstar/builder.rock'
      - 'wiki/Builder.md'

jobs:
  portable-final:
    if: startsWith(github.head_ref, 'patterns/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup compilers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gnat gfortran gnucobol3 nasm
      - name: Validate Ada Builder
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          gnatmake -q -gnat2022 -gnatwa -gnatwe -D "$out" src/Historical/Ada/builder.adb -o /tmp/builder-ada
          output="$(/tmp/builder-ada)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"
      - name: Validate Solidity Builder
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          npx --yes solc@0.8.30 --bin --abi src/Niche/Solidity/Builder.sol -o "$out"
          test -n "$(find "$out" -type f -name '*_Builder.bin' -size +0c -print -quit)"
      - name: Validate Fortran Builder
        shell: bash
        run: |
          set -euo pipefail
          gfortran -std=f2018 -Wall -Wextra -Werror src/Historical/Fortran/builder.f90 -o /tmp/builder-fortran
          output="$(/tmp/builder-fortran)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"
      - name: Validate COBOL Builder
        shell: bash
        run: |
          set -euo pipefail
          cobc -x -Wall src/Historical/Cobol/builder.cbl -o /tmp/builder-cobol
          output="$(/tmp/builder-cobol)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"
      - name: Validate Assembly Builder
        shell: bash
        run: |
          set -euo pipefail
          nasm -f elf64 -Wall src/LowLevel/Assembly/builder.asm -o /tmp/builder-assembly.o
          ld /tmp/builder-assembly.o -o /tmp/builder-assembly
          output="$(/tmp/builder-assembly)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

  gdscript-builder:
    if: startsWith(github.head_ref, 'patterns/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip' --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
      - name: Validate GDScript Builder
        shell: bash
        run: |
          set -euo pipefail
          output="$(godot --headless --script src/Niche/GDScript/builder.gd 2>&1)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

  matlab-builder:
    if: startsWith(github.head_ref, 'patterns/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: latest
      - name: Validate MATLAB Builder
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            addpath('src/DataScience/MATLAB');
            output = evalc('builder');
            disp(output);
            assert(contains(output, "# Service status"));
            assert(contains(output, "<h1>Service status</h1>"));
            assert(contains(output, "99.95%"));

  micropython-builder:
    if: startsWith(github.head_ref, 'patterns/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build MicroPython 1.28.0 Unix port
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev pkg-config
          git clone --depth 1 --branch v1.28.0 --recurse-submodules https://github.com/micropython/micropython.git /tmp/micropython
          make -C /tmp/micropython/mpy-cross -j2
          make -C /tmp/micropython/ports/unix -j2
      - name: Validate MicroPython Builder
        shell: bash
        run: |
          set -euo pipefail
          output="$(/tmp/micropython/ports/unix/build-standard/micropython src/Other/MicroPython/builder.py)"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

  rockstar-builder:
    if: startsWith(github.head_ref, 'patterns/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Rockstar v2.0.31
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://github.com/RockstarLang/rockstar/releases/download/v2.0.31/rockstar-v2.0.31-linux-x64.tar.gz' --output /tmp/rockstar.tar.gz
          echo '3d265c80d9d039ad92524f42951eb546d8b42c680965dfa551210457e399653f  /tmp/rockstar.tar.gz' | sha256sum -c -
          mkdir -p /tmp/rockstar
          tar -xzf /tmp/rockstar.tar.gz -C /tmp/rockstar
          ROCKSTAR="$(find /tmp/rockstar -type f -name rockstar -perm -111 | head -n 1)"
          test -n "$ROCKSTAR"
          echo "ROCKSTAR=$ROCKSTAR" >> "$GITHUB_ENV"
      - name: Validate Rockstar Builder
        shell: bash
        run: |
          set -euo pipefail
          output="$("$ROCKSTAR" src/Other/Rockstar/builder.rock 2>&1)"
          printf '%s\n' "$output"
          grep -Fq '# Service status' <<<"$output"
          grep -Fq '<h1>Service status</h1>' <<<"$output"
          grep -Fq '99.95%' <<<"$output"

  proprietary-source-contracts:
    if: startsWith(github.head_ref, 'patterns/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate VBA and Delphi Builder source contracts
        shell: python
        run: |
          from pathlib import Path
          import re

          def require(text: str, pattern: str, label: str) -> None:
              if re.search(pattern, text, flags=re.IGNORECASE | re.MULTILINE | re.DOTALL) is None:
                  raise SystemExit(f"Missing source contract: {label}")

          vba = Path('src/Shell/VBA/builder.bas').read_text(encoding='utf-8')
          for pattern, label in [
              (r'^Option Explicit$', 'VBA Option Explicit'),
              (r'Private\s+Enum\s+ReportFormat.*TextReport.*HtmlReport.*End\s+Enum', 'VBA representations'),
              (r'Private\s+Type\s+ReportBuilder.*Format\s+As\s+ReportFormat.*Parts\(1\s+To\s+3\)\s+As\s+String.*End\s+Type', 'VBA builder state'),
              (r'Sub\s+AddTitle.*# .*<h1>', 'VBA title step'),
              (r'Sub\s+AddSection.*## .*<h2>', 'VBA section step'),
              (r'Function\s+BuildAvailabilityReport.*Reset\s+target.*AddTitle.*Service status.*AddSection.*Availability.*99\.95%', 'VBA shared recipe'),
          ]:
              require(vba, pattern, label)

          delphi = Path('src/Enterprise/Delphi/Builder.pas').read_text(encoding='utf-8')
          for pattern, label in [
              (r'IReportBuilder\s*=\s*interface.*procedure\s+Reset.*procedure\s+AddTitle.*procedure\s+AddSection.*function\s+Build', 'Delphi builder interface'),
              (r'TTextReportBuilder\s*=\s*class\(TInterfacedObject,\s*IReportBuilder\)', 'Delphi text builder'),
              (r'THtmlReportBuilder\s*=\s*class\(TTextReportBuilder\)', 'Delphi HTML builder'),
              (r'THtmlReportBuilder\.AddTitle.*<h1>', 'Delphi HTML title step'),
              (r'THtmlReportBuilder\.AddSection.*<h2>', 'Delphi HTML section step'),
              (r"function\s+BuildAvailabilityReport.*ABuilder\.Reset.*ABuilder\.AddTitle\('Service status'\).*ABuilder\.AddSection\('Availability',\s*'99\.95%'\).*ABuilder\.Build", 'Delphi shared recipe'),
          ]:
              require(delphi, pattern, label)

          print('VBA Builder source contract: OK')
          print('Delphi Builder source contract: OK')
