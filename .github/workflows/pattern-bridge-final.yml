name: Pattern Bridge Final

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/pattern-bridge-final.yml'
      - 'src/Historical/Ada/bridge.adb'
      - 'src/Niche/Solidity/Bridge.sol'
      - 'src/Historical/Fortran/bridge.f90'
      - 'src/Systems/Objective-C/bridge.m'
      - 'src/Systems/Zig/bridge.zig'
      - 'src/Niche/Nim/bridge.nim'
      - 'src/Web/Dart/bridge.dart'
      - 'src/Niche/Crystal/bridge.cr'
      - 'src/Historical/Cobol/bridge.cbl'
      - 'src/Shell/VBA/bridge.bas'
      - 'src/Shell/VBA/IBridgeDevice.cls'
      - 'src/Shell/VBA/TvBridgeDevice.cls'
      - 'src/Shell/VBA/RadioBridgeDevice.cls'
      - 'src/Shell/VBA/BasicBridgeRemote.cls'
      - 'src/Shell/VBA/MuteBridgeRemote.cls'
      - 'src/Niche/GDScript/bridge.gd'
      - 'src/DataScience/MATLAB/bridge.m'
      - 'src/LowLevel/Assembly/bridge.asm'
      - 'src/Enterprise/Delphi/BridgeExample.pas'
      - 'src/Other/MicroPython/bridge.py'
      - 'src/Other/Rockstar/bridge.rock'
      - 'wiki/Bridge.md'

jobs:
  portable-final:
    if: github.head_ref == 'patterns/bridge-kb006'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
      - name: Setup Crystal
        uses: crystal-lang/install-crystal@v1
      - name: Setup final portable runtimes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gnat gfortran nim gnucobol3 nasm
      - name: Validate Ada Bridge
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          gnatmake -q -gnat2022 -gnatwa -gnatwe -D "$work" src/Historical/Ada/bridge.adb -o /tmp/bridge-ada
          output="$(/tmp/bridge-ada)"
          grep -Fxq 'basic-tv=TV:on' <<<"$output"
          grep -Fxq 'basic-radio=Radio:on' <<<"$output"
          grep -Fxq 'mute-tv=TV:muted' <<<"$output"
          grep -Fxq 'mute-radio=Radio:muted' <<<"$output"
      - name: Validate Solidity Bridge source contract
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          npx --yes solc@0.8.30 --bin --abi src/Niche/Solidity/Bridge.sol -o "$out"
          test -n "$(find "$out" -type f -name '*BasicRemote.bin' -size +0c -print -quit)"
          test -n "$(find "$out" -type f -name '*MuteRemote.bin' -size +0c -print -quit)"
          grep -Fq 'interface IDevice' src/Niche/Solidity/Bridge.sol
          grep -Fq 'device.powerOn()' src/Niche/Solidity/Bridge.sol
          grep -Fq 'device.mute()' src/Niche/Solidity/Bridge.sol
      - name: Validate Fortran Bridge
        shell: bash
        run: |
          set -euo pipefail
          gfortran -std=f2018 -Wall -Wextra -Werror src/Historical/Fortran/bridge.f90 -o /tmp/bridge-fortran
          output="$(/tmp/bridge-fortran)"
          grep -Fxq 'basic-tv=TV:on' <<<"$output"
          grep -Fxq 'basic-radio=Radio:on' <<<"$output"
          grep -Fxq 'mute-tv=TV:muted' <<<"$output"
          grep -Fxq 'mute-radio=Radio:muted' <<<"$output"
      - name: Validate Zig Bridge
        shell: bash
        run: |
          set -euo pipefail
          zig fmt --check src/Systems/Zig/bridge.zig
          output="$(zig run src/Systems/Zig/bridge.zig 2>&1)"
          grep -Fxq 'basic-tv=TV:on' <<<"$output"
          grep -Fxq 'basic-radio=Radio:on' <<<"$output"
          grep -Fxq 'mute-tv=TV:muted' <<<"$output"
          grep -Fxq 'mute-radio=Radio:muted' <<<"$output"
      - name: Validate Nim Bridge
        shell: bash
        run: |
          set -euo pipefail
          nim c --hints:off --warnings:on -o:/tmp/bridge-nim src/Niche/Nim/bridge.nim
          output="$(/tmp/bridge-nim)"
          grep -Fxq 'basic-tv=TV:on' <<<"$output"
          grep -Fxq 'basic-radio=Radio:on' <<<"$output"
          grep -Fxq 'mute-tv=TV:muted' <<<"$output"
          grep -Fxq 'mute-radio=Radio:muted' <<<"$output"
      - name: Validate Dart Bridge
        shell: bash
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed src/Web/Dart/bridge.dart
          dart analyze --fatal-infos --fatal-warnings src/Web/Dart/bridge.dart
          output="$(dart run src/Web/Dart/bridge.dart)"
          grep -Fxq 'basic-tv=TV:on' <<<"$output"
          grep -Fxq 'basic-radio=Radio:on' <<<"$output"
          grep -Fxq 'mute-tv=TV:muted' <<<"$output"
          grep -Fxq 'mute-radio=Radio:muted' <<<"$output"
      - name: Validate Crystal Bridge
        shell: bash
        run: |
          set -euo pipefail
          crystal tool format src/Niche/Crystal/bridge.cr
          test -z "$(git status --short -- src/Niche/Crystal/bridge.cr)"
          crystal build --error-on-warnings src/Niche/Crystal/bridge.cr -o /tmp/bridge-crystal
          output="$(/tmp/bridge-crystal)"
          grep -Fxq 'basic-tv=TV:on' <<<"$output"
          grep -Fxq 'basic-radio=Radio:on' <<<"$output"
          grep -Fxq 'mute-tv=TV:muted' <<<"$output"
          grep -Fxq 'mute-radio=Radio:muted' <<<"$output"
      - name: Validate COBOL Bridge
        shell: bash
        run: |
          set -euo pipefail
          cobc -x -Wall src/Historical/Cobol/bridge.cbl -o /tmp/bridge-cobol
          output="$(/tmp/bridge-cobol)"
          grep -Fxq 'basic-tv=TV:on' <<<"$output"
          grep -Fxq 'basic-radio=Radio:on' <<<"$output"
          grep -Fxq 'mute-tv=TV:muted' <<<"$output"
          grep -Fxq 'mute-radio=Radio:muted' <<<"$output"
      - name: Validate Assembly Bridge
        shell: bash
        run: |
          set -euo pipefail
          nasm -f elf64 -Wall src/LowLevel/Assembly/bridge.asm -o /tmp/bridge-assembly.o
          ld /tmp/bridge-assembly.o -o /tmp/bridge-assembly
          output="$(/tmp/bridge-assembly)"
          grep -Fxq 'basic-tv=TV:on' <<<"$output"
          grep -Fxq 'basic-radio=Radio:on' <<<"$output"
          grep -Fxq 'mute-tv=TV:muted' <<<"$output"
          grep -Fxq 'mute-radio=Radio:muted' <<<"$output"

  objective-c:
    if: github.head_ref == 'patterns/bridge-kb006'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate Objective-C Bridge
        shell: bash
        run: |
          set -euo pipefail
          clang -fobjc-arc -Wall -Wextra -Werror -framework Foundation src/Systems/Objective-C/bridge.m -o /tmp/bridge-objective-c
          output="$(/tmp/bridge-objective-c 2>&1)"
          grep -Fxq 'basic-tv=TV:on' <<<"$output"
          grep -Fxq 'basic-radio=Radio:on' <<<"$output"
          grep -Fxq 'mute-tv=TV:muted' <<<"$output"
          grep -Fxq 'mute-radio=Radio:muted' <<<"$output"

  gdscript:
    if: github.head_ref == 'patterns/bridge-kb006'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip' --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
      - name: Validate GDScript Bridge
        shell: bash
        run: |
          set -euo pipefail
          output="$(godot --headless --script src/Niche/GDScript/bridge.gd 2>&1)"
          grep -Fxq 'basic-tv=TV:on' <<<"$output"
          grep -Fxq 'basic-radio=Radio:on' <<<"$output"
          grep -Fxq 'mute-tv=TV:muted' <<<"$output"
          grep -Fxq 'mute-radio=Radio:muted' <<<"$output"

  matlab:
    if: github.head_ref == 'patterns/bridge-kb006'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: latest
      - name: Validate MATLAB Bridge
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            addpath('src/DataScience/MATLAB');
            output = evalc('bridge');
            disp(output);
            assert(contains(output, "basic-tv=TV:on"));
            assert(contains(output, "basic-radio=Radio:on"));
            assert(contains(output, "mute-tv=TV:muted"));
            assert(contains(output, "mute-radio=Radio:muted"));

  micropython:
    if: github.head_ref == 'patterns/bridge-kb006'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build MicroPython 1.28.0 Unix port
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev pkg-config
          git clone --depth 1 --branch v1.28.0 --recurse-submodules https://github.com/micropython/micropython.git /tmp/micropython
          make -C /tmp/micropython/mpy-cross -j2
          make -C /tmp/micropython/ports/unix -j2
      - name: Validate MicroPython Bridge
        shell: bash
        run: |
          set -euo pipefail
          output="$(/tmp/micropython/ports/unix/build-standard/micropython src/Other/MicroPython/bridge.py)"
          grep -Fxq 'basic-tv=TV:on' <<<"$output"
          grep -Fxq 'basic-radio=Radio:on' <<<"$output"
          grep -Fxq 'mute-tv=TV:muted' <<<"$output"
          grep -Fxq 'mute-radio=Radio:muted' <<<"$output"

  rockstar:
    if: github.head_ref == 'patterns/bridge-kb006'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Rockstar v2.0.31
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://github.com/RockstarLang/rockstar/releases/download/v2.0.31/rockstar-v2.0.31-linux-x64.tar.gz' --output /tmp/rockstar.tar.gz
          echo '3d265c80d9d039ad92524f42951eb546d8b42c680965dfa551210457e399653f  /tmp/rockstar.tar.gz' | sha256sum -c -
          mkdir -p /tmp/rockstar
          tar -xzf /tmp/rockstar.tar.gz -C /tmp/rockstar
          ROCKSTAR="$(find /tmp/rockstar -type f -name rockstar -perm -111 | head -n 1)"
          echo "ROCKSTAR=$ROCKSTAR" >> "$GITHUB_ENV"
      - name: Validate Rockstar Bridge
        shell: bash
        run: |
          set -euo pipefail
          output="$("$ROCKSTAR" src/Other/Rockstar/bridge.rock)"
          grep -Fxq 'basic-tv=TV:on' <<<"$output"
          grep -Fxq 'basic-radio=Radio:on' <<<"$output"
          grep -Fxq 'mute-tv=TV:muted' <<<"$output"
          grep -Fxq 'mute-radio=Radio:muted' <<<"$output"
          test "$(wc -l <<<"$output" | tr -d ' ')" = '4'

  proprietary-source-contracts:
    if: github.head_ref == 'patterns/bridge-kb006'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate VBA and Delphi Bridge source contracts
        shell: python
        run: |
          from pathlib import Path
          import re

          def require(text: str, pattern: str, label: str) -> None:
              if re.search(pattern, text, flags=re.IGNORECASE | re.MULTILINE | re.DOTALL) is None:
                  raise SystemExit(f"Missing source contract: {label}")

          interface = Path('src/Shell/VBA/IBridgeDevice.cls').read_text(encoding='utf-8')
          tv = Path('src/Shell/VBA/TvBridgeDevice.cls').read_text(encoding='utf-8')
          radio = Path('src/Shell/VBA/RadioBridgeDevice.cls').read_text(encoding='utf-8')
          basic = Path('src/Shell/VBA/BasicBridgeRemote.cls').read_text(encoding='utf-8')
          muting = Path('src/Shell/VBA/MuteBridgeRemote.cls').read_text(encoding='utf-8')
          demo = Path('src/Shell/VBA/bridge.bas').read_text(encoding='utf-8')

          require(interface, r'Public\s+Function\s+PowerOn\(\)\s+As\s+String.*Public\s+Function\s+Mute\(\)\s+As\s+String', 'VBA Implementor contract')
          require(tv, r'Implements\s+IBridgeDevice.*IBridgeDevice_PowerOn.*TV:on.*IBridgeDevice_Mute.*TV:muted', 'VBA TV implementor')
          require(radio, r'Implements\s+IBridgeDevice.*IBridgeDevice_PowerOn.*Radio:on.*IBridgeDevice_Mute.*Radio:muted', 'VBA Radio implementor')
          require(basic, r'Private\s+device\s+As\s+IBridgeDevice.*Activate.*device\.PowerOn', 'VBA Basic abstraction')
          require(muting, r'Private\s+device\s+As\s+IBridgeDevice.*Activate.*device\.Mute', 'VBA Mute abstraction')
          require(demo, r'basic\.Initialize\s+tv.*basic\.Initialize\s+radio.*muting\.Initialize\s+tv.*muting\.Initialize\s+radio', 'VBA 2x2 client composition')

          delphi = Path('src/Enterprise/Delphi/BridgeExample.pas').read_text(encoding='utf-8')
          require(delphi, r'IBridgeDevice\s*=\s*interface.*PowerOn.*Mute', 'Delphi Implementor interface')
          require(delphi, r'TTvDevice\s*=\s*class\(TInterfacedObject,\s*IBridgeDevice\)', 'Delphi TV implementor')
          require(delphi, r'TRadioDevice\s*=\s*class\(TInterfacedObject,\s*IBridgeDevice\)', 'Delphi Radio implementor')
          require(delphi, r'TBasicRemote\s*=\s*class.*FDevice:\s*IBridgeDevice.*Result\s*:=\s*FDevice\.PowerOn', 'Delphi Basic abstraction')
          require(delphi, r'TMuteRemote\s*=\s*class.*FDevice:\s*IBridgeDevice.*Result\s*:=\s*FDevice\.Mute', 'Delphi Mute abstraction')

          print('VBA Bridge source contract: OK')
          print('Delphi Bridge source contract: OK')
