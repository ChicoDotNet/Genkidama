name: Pattern Chain of Responsibility Mainstream
on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/**/chain*'
      - 'src/**/ChainOfResponsibility*'
      - 'wiki/ChainOfResponsibility.md'
      - '.github/workflows/pattern-chain-of-responsibility-mainstream.yml'

jobs:
  mainstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-node@v6
        with: { node-version: '24' }
      - uses: actions/setup-python@v7
        with: { python-version: '3.x' }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '25' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with: { go-version: stable }
      - name: Install SQL and portable runtimes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y sqlite3 ruby lua5.4 ghc
      - name: Validate Chain of Responsibility examples
        shell: bash
        run: |
          set -euo pipefail
          expected='visited=faq>billing;handled=billing;result=refund(250)'
          assert_output() {
            test "$2" = "$expected" || {
              printf '%s mismatch\nexpected: %s\nactual: %s\n' "$1" "$expected" "$2" >&2
              exit 1
            }
          }
          work="$(mktemp -d)"

          dotnet new console -n ChainCs -o "$work/cs" --force >/dev/null
          cp 'src/Enterprise/C#/ChainOfResponsibilityExample.cs' "$work/cs/Program.cs"
          assert_output C# "$(dotnet run --project "$work/cs/ChainCs.csproj" --configuration Release -q)"

          npx --yes --package typescript tsc --noEmit --target ES2022 src/Web/TypeScriptTS/chain-of-responsibility.ts
          assert_output TypeScript "$(npx --yes tsx src/Web/TypeScriptTS/chain-of-responsibility.ts)"

          python -m py_compile src/Scripting/PythonPY/chain_of_responsibility.py
          assert_output Python "$(python src/Scripting/PythonPY/chain_of_responsibility.py)"

          g++ -std=c++20 -Wall -Wextra -Werror -pedantic 'src/Systems/C++/chain_of_responsibility.cpp' -o "$work/chain-cpp"
          assert_output C++ "$("$work/chain-cpp")"

          javac -Xlint:all -Werror src/Enterprise/Java/ChainOfResponsibilityExample.java
          assert_output Java "$(java -cp src/Enterprise/Java ChainOfResponsibilityExample)"

          rustc -D warnings src/Systems/Rust/chain_of_responsibility.rs -o "$work/chain-rs"
          assert_output Rust "$("$work/chain-rs")"

          test -z "$(gofmt -d src/Systems/Go/chain_of_responsibility.go)"
          assert_output Go "$(go run src/Systems/Go/chain_of_responsibility.go)"

          php -l src/Scripting/PHP/chain_of_responsibility.php >/dev/null
          assert_output PHP "$(php src/Scripting/PHP/chain_of_responsibility.php)"

          assert_output F# "$(dotnet fsi 'src/Functional/F#/chain_of_responsibility.fsx' | tail -n 1)"

          node --check src/Web/JavaScriptJS/chain-of-responsibility.js
          assert_output JavaScript "$(node src/Web/JavaScriptJS/chain-of-responsibility.js)"

          command -v kotlinc >/dev/null
          kotlinc src/Enterprise/Kotlin/ChainOfResponsibilityExample.kt -include-runtime -d "$work/chain-kotlin.jar"
          assert_output Kotlin "$(java -jar "$work/chain-kotlin.jar")"

          command -v swiftc >/dev/null
          swiftc -warnings-as-errors src/Systems/Swift/chain_of_responsibility.swift -o "$work/chain-swift"
          assert_output Swift "$("$work/chain-swift")"

          dotnet new console -lang VB --framework net10.0 -n ChainVb -o "$work/vb" >/dev/null
          cp src/Enterprise/VB.NET/ChainOfResponsibilityExample.vb "$work/vb/Program.vb"
          assert_output VB.NET "$(dotnet run --project "$work/vb/ChainVb.vbproj" --configuration Release)"

          gcc -std=c17 -Wall -Wextra -Werror -pedantic src/Systems/C/chain_of_responsibility.c -o "$work/chain-c"
          assert_output C "$("$work/chain-c")"

          ruby -cw src/Scripting/Ruby/chain_of_responsibility.rb >/dev/null
          assert_output Ruby "$(ruby src/Scripting/Ruby/chain_of_responsibility.rb)"

          luac5.4 -p src/Scripting/Lua/chain_of_responsibility.lua
          assert_output Lua "$(lua5.4 src/Scripting/Lua/chain_of_responsibility.lua)"

          bash -n src/Shell/Bash/chain_of_responsibility.sh
          assert_output Bash "$(bash src/Shell/Bash/chain_of_responsibility.sh)"

          command -v pwsh >/dev/null
          assert_output PowerShell "$(pwsh -NoLogo -NoProfile -File src/Shell/PowerShell/chain_of_responsibility.ps1)"

          ghc -Wall -Werror src/Functional/Haskell/ChainOfResponsibility.hs -o "$work/chain-hs"
          assert_output Haskell "$("$work/chain-hs")"

          perl -c src/Scripting/Perl/chain_of_responsibility.pl >/dev/null
          assert_output Perl "$(perl src/Scripting/Perl/chain_of_responsibility.pl)"

          assert_output SQL "$(sqlite3 :memory: < src/Data/SQL/chain_of_responsibility.sql)"
