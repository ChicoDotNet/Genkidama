name: Pattern Chain of Responsibility Modern
on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/DataScience/Julia/chain_of_responsibility.jl'
      - 'wiki/ChainOfResponsibility.md'
      - '.github/workflows/pattern-chain-of-responsibility-modern.yml'

jobs:
  modern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Validate Julia Chain of Responsibility
        shell: bash
        run: |
          set -euo pipefail
          expected='visited=faq>billing;handled=billing;result=refund(250)'
          test "$(julia --startup-file=no src/DataScience/Julia/chain_of_responsibility.jl)" = "$expected"
