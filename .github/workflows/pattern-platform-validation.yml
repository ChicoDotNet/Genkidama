name: Pattern Platform Validation

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/pattern-platform-validation.yml'
      - 'src/Niche/GDScript/**'
      - 'src/DataScience/MATLAB/**'
      - 'src/Other/MicroPython/**'
      - 'src/Other/Rockstar/**'
      - 'wiki/AbstractFactory.md'

jobs:
  gdscript-abstract-factory:
    if: startsWith(github.head_ref, 'patterns/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip' \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Validate GDScript Abstract Factory with Godot
        shell: bash
        run: |
          set -euo pipefail
          output="$(godot --headless --script src/Niche/GDScript/example1.gd 2>&1)"
          printf '%s\n' "$output"
          grep -Fxq 'Dark Button' <<<"$output"
          grep -Fxq 'Dark Checkbox' <<<"$output"
          grep -Fxq 'Light Button' <<<"$output"
          grep -Fxq 'Light Checkbox' <<<"$output"

  matlab-abstract-factory:
    if: startsWith(github.head_ref, 'patterns/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: latest

      - name: Validate MATLAB Abstract Factory
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            addpath('src/DataScience/MATLAB');
            output = evalc('example1');
            disp(output);
            assert(contains(output, "Dark Button"));
            assert(contains(output, "Dark Checkbox"));
            assert(contains(output, "Light Button"));
            assert(contains(output, "Light Checkbox"));

  micropython-abstract-factory:
    if: startsWith(github.head_ref, 'patterns/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build MicroPython 1.28.0 Unix port
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev pkg-config
          git clone --depth 1 --branch v1.28.0 --recurse-submodules \
            https://github.com/micropython/micropython.git /tmp/micropython
          make -C /tmp/micropython/mpy-cross -j2
          make -C /tmp/micropython/ports/unix -j2
          /tmp/micropython/ports/unix/build-standard/micropython --version

      - name: Validate MicroPython Abstract Factory
        shell: bash
        run: |
          set -euo pipefail
          output="$(/tmp/micropython/ports/unix/build-standard/micropython src/Other/MicroPython/example1.py)"
          printf '%s\n' "$output"
          grep -Fxq 'Dark Button' <<<"$output"
          grep -Fxq 'Dark Checkbox' <<<"$output"
          grep -Fxq 'Light Button' <<<"$output"
          grep -Fxq 'Light Checkbox' <<<"$output"

  rockstar-abstract-factory:
    if: startsWith(github.head_ref, 'patterns/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rockstar v2.0.31
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://github.com/RockstarLang/rockstar/releases/download/v2.0.31/rockstar-v2.0.31-linux-x64.tar.gz' \
            --output /tmp/rockstar.tar.gz
          echo '3d265c80d9d039ad92524f42951eb546d8b42c680965dfa551210457e399653f  /tmp/rockstar.tar.gz' | sha256sum -c -
          mkdir -p /tmp/rockstar
          tar -xzf /tmp/rockstar.tar.gz -C /tmp/rockstar
          ROCKSTAR="$(find /tmp/rockstar -type f -name rockstar -perm -111 | head -n 1)"
          test -n "$ROCKSTAR"
          echo "ROCKSTAR=$ROCKSTAR" >> "$GITHUB_ENV"
          "$ROCKSTAR" --version

      - name: Run Rockstar Abstract Factory
        id: rockstar
        shell: bash
        run: |
          set +e
          "$ROCKSTAR" src/Other/Rockstar/example1.rock > rockstar-output.txt 2>&1
          status=$?
          set -e
          cat rockstar-output.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Upload Rockstar diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rockstar-abstract-factory-output
          path: rockstar-output.txt
          if-no-files-found: error
          retention-days: 1

      - name: Validate Rockstar Abstract Factory
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.rockstar.outputs.status }}' -eq 0
          output="$(cat rockstar-output.txt)"
          grep -Fxq 'Dark Button' <<<"$output"
          grep -Fxq 'Dark Checkbox' <<<"$output"
          grep -Fxq 'Light Button' <<<"$output"
          grep -Fxq 'Light Checkbox' <<<"$output"
