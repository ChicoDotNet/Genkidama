name: Pattern Abstract Factory

on:
  pull_request:
    paths:
      - 'wiki/AbstractFactory.md'
      - 'src/Enterprise/C#/Example1.cs'
      - 'src/Enterprise/Java/Example1.java'
      - 'src/Enterprise/VisualBasic/Example1.vb'
      - 'src/Scripting/Perl/example1.pl'
      - 'src/Scripting/PHP/example1.php'
      - 'src/Scripting/PythonPY/example1.py'
      - 'src/Scripting/RubyRB/example1.rb'
      - 'src/Shell/Bash/example1.sh'
      - 'src/Systems/C/example1.c'
      - 'src/Systems/C++/example1.cpp'
      - 'src/Systems/Go/example1.go'
      - 'src/Systems/Rust/example1.rs'
      - 'src/Web/JavaScriptJS/example1.js'
      - 'src/Web/TypeScriptTS/example1.ts'
      - '.github/workflows/pattern-abstract-factory.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Validate C#
        shell: bash
        run: |
          work="$(mktemp -d)"
          dotnet new console --framework net10.0 --output "$work" --force >/dev/null
          cp 'src/Enterprise/C#/Example1.cs' "$work/Program.cs"
          dotnet run --project "$work" --configuration Release

      - name: Validate Visual Basic .NET
        shell: bash
        run: |
          work="$(mktemp -d)"
          dotnet new console --language VB --framework net10.0 --output "$work" --force >/dev/null
          cp 'src/Enterprise/VisualBasic/Example1.vb' "$work/Program.vb"
          dotnet run --project "$work" --configuration Release

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate Java
        run: |
          javac src/Enterprise/Java/Example1.java
          java -cp src/Enterprise/Java Example1

      - name: Validate C
        run: |
          gcc -std=c17 -Wall -Wextra -Werror src/Systems/C/example1.c -o /tmp/abstract-factory-c
          /tmp/abstract-factory-c

      - name: Validate C++
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror src/Systems/C++/example1.cpp -o /tmp/abstract-factory-cpp
          /tmp/abstract-factory-cpp

      - name: Setup Go 1.26.5
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'

      - name: Validate Go
        run: go run src/Systems/Go/example1.go

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Validate PHP
        run: |
          php -l src/Scripting/PHP/example1.php
          php src/Scripting/PHP/example1.php

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Validate Python
        run: python src/Scripting/PythonPY/example1.py

      - name: Validate Rust
        run: |
          rustc --edition 2024 src/Systems/Rust/example1.rs -o /tmp/abstract-factory-rust
          /tmp/abstract-factory-rust

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate JavaScript
        run: node src/Web/JavaScriptJS/example1.js

      - name: Validate TypeScript
        run: |
          npm install --global typescript@6.0.3
          out="$(mktemp -d)"
          tsc --strict --target ES2022 --module commonjs --outDir "$out" src/Web/TypeScriptTS/example1.ts
          node "$out/example1.js"

      - name: Setup Ruby 3.4
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Validate Ruby
        run: ruby -cw src/Scripting/RubyRB/example1.rb && ruby src/Scripting/RubyRB/example1.rb

      - name: Validate Perl
        run: perl -c src/Scripting/Perl/example1.pl && perl src/Scripting/Perl/example1.pl

      - name: Validate Bash
        run: bash -n src/Shell/Bash/example1.sh && bash src/Shell/Bash/example1.sh
