name: Learn VB.NET

on:
  pull_request:
    paths:
      - 'learn/es/vbnet/**'
      - '.github/workflows/learn-vbnet.yml'

jobs:
  core-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Show .NET version
        run: dotnet --info
      - name: Test core and presenter
        working-directory: learn/es/vbnet/app
        run: dotnet test QuoteDesk.Tests/QuoteDesk.Tests.vbproj -c Release

  winforms-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build WinForms app
        working-directory: learn/es/vbnet/app
        run: dotnet build QuoteDesk.WinForms/QuoteDesk.WinForms.vbproj -c Release
      - name: Publish WinForms app
        working-directory: learn/es/vbnet/app
        shell: pwsh
        run: |
          dotnet publish QuoteDesk.WinForms/QuoteDesk.WinForms.vbproj -c Release -r win-x64 --self-contained false -o publish/quotedesk
          if (-not (Test-Path 'publish/quotedesk/QuoteDesk.WinForms.exe')) { throw 'No se generó QuoteDesk.WinForms.exe' }
