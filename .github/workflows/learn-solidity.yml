name: Learn Solidity

on:
  pull_request:
    paths:
      - 'learn/es/solidity/**'
      - '.github/workflows/learn-solidity.yml'
  push:
    branches:
      - main
    paths:
      - 'learn/es/solidity/**'
      - '.github/workflows/learn-solidity.yml'

permissions:
  contents: read

jobs:
  solidity:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: learn/es/solidity/app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Foundry stable
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Check contract formatting
        run: forge fmt --check src/FreelanceEscrow.sol

      - name: Check test formatting
        run: forge fmt --check test/FreelanceEscrow.t.sol

      - name: Build FreelanceEscrow
        run: forge build

      - name: Diagnose deposit test
        continue-on-error: true
        run: forge test --match-test testDepositStartsFunded -vv

      - name: Diagnose release test
        continue-on-error: true
        run: forge test --match-test testFreelancerDeliversAndClientReleases -vv

      - name: Diagnose refund test
        continue-on-error: true
        run: forge test --match-test testClientCanRefundBeforeDelivery -vv

      - name: Diagnose delivery authorization test
        continue-on-error: true
        run: forge test --match-test testOnlyFreelancerCanMarkDelivered -vv

      - name: Diagnose release authorization test
        continue-on-error: true
        run: forge test --match-test testOnlyClientCanRelease -vv

      - name: Diagnose invalid transition test
        continue-on-error: true
        run: forge test --match-test testCannotRefundAfterDelivery -vv

      - name: Test FreelanceEscrow
        run: forge test -vv
