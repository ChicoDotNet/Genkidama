name: Learn Solidity

on:
  pull_request:
    paths:
      - 'learn/es/solidity/**'
      - '.github/workflows/learn-solidity.yml'
  push:
    branches:
      - main
    paths:
      - 'learn/es/solidity/**'
      - '.github/workflows/learn-solidity.yml'

permissions:
  contents: read

jobs:
  solidity:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: learn/es/solidity
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Foundry stable
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Verify final course package
        run: |
          test -f lessons/17-evaluacion-final.md
          test -f exercises/evaluacion-final.md
          test -f exercises/rubrica-final.md
          test -f solutions/evaluacion-final.md

      - name: Check formatting
        run: forge fmt --check app/src/FreelanceEscrow.sol app/test/FreelanceEscrow.t.sol app/test/Security.t.sol

      - name: Build FreelanceEscrow
        run: forge build

      - name: Test FreelanceEscrow
        run: forge test -vv
