name: Pattern MATLAB Sweep

on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/DataScience/MATLAB/*.m'
      - 'docs/pattern-sweeps/matlab.md'
      - 'docs/kb/catalog/pattern-authoring-standard.md'
      - 'docs/roadmap.md'
      - '.github/workflows/pattern-matlab-sweep.yml'

jobs:
  matlab-pattern-sweep:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Mark MATLAB setup start
        shell: bash
        run: date +%s > "$RUNNER_TEMP/matlab-setup-start"

      - name: Setup MATLAB once for the full sweep
        uses: matlab-actions/setup-matlab@v3
        with:
          release: latest

      - name: Record setup timing
        shell: bash
        run: |
          set -euo pipefail
          start="$(cat "$RUNNER_TEMP/matlab-setup-start")"
          now="$(date +%s)"
          echo "$((now - start))" > "$RUNNER_TEMP/matlab-setup-seconds"
          echo "$now" > "$RUNNER_TEMP/matlab-validation-start"

      - name: Validate all remaining MATLAB pattern cells
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            addpath('src/DataScience/MATLAB');
            validate_pattern_sweep;

      - name: Record MATLAB sweep timing telemetry
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$RUNNER_TEMP/matlab-setup-start" || ! -f "$RUNNER_TEMP/matlab-setup-seconds" || ! -f "$RUNNER_TEMP/matlab-validation-start" ]]; then
            echo 'MATLAB sweep timing telemetry unavailable because setup did not reach the validation boundary.'
            exit 0
          fi

          setup_start="$(cat "$RUNNER_TEMP/matlab-setup-start")"
          validation_start="$(cat "$RUNNER_TEMP/matlab-validation-start")"
          now="$(date +%s)"
          setup_seconds="$(cat "$RUNNER_TEMP/matlab-setup-seconds")"
          validation_seconds="$((now - validation_start))"
          total_seconds="$((now - setup_start))"

          printf 'cells=39\nsetup_seconds=%s\nvalidation_seconds=%s\ntotal_seconds=%s\n' \
            "$setup_seconds" "$validation_seconds" "$total_seconds"

          {
            echo '### MATLAB language-major pattern sweep'
            echo
            echo '- cells=39'
            echo "- setup_seconds=$setup_seconds"
            echo "- validation_seconds=$validation_seconds"
            echo "- total_seconds=$total_seconds"
          } >> "$GITHUB_STEP_SUMMARY"
