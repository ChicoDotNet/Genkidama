name: Learn Rust

on:
  pull_request:
    paths:
      - 'learn/es/rust/**'
      - '.github/workflows/learn-rust.yml'
  push:
    branches:
      - main
    paths:
      - 'learn/es/rust/**'
      - '.github/workflows/learn-rust.yml'

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable 1.97.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Show Rust version
        working-directory: learn/es/rust/app
        run: rustc --version && cargo --version

      - name: Diagnose exact rustfmt delta
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path learn/es/rust/app/Cargo.toml
          if ! git diff --quiet -- learn/es/rust/app; then
            delta="$(git diff -- learn/es/rust/app)"
            delta="${delta//'%'/'%25'}"
            delta="${delta//$'\r'/'%0D'}"
            delta="${delta//$'\n'/'%0A'}"
            echo "::error title=rustfmt delta::$delta"
            echo 'RUSTFMT_CHANGED=1' >> "$GITHUB_ENV"
          fi

      - name: Clippy after rustfmt
        working-directory: learn/es/rust/app
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test after rustfmt
        working-directory: learn/es/rust/app
        run: cargo test

      - name: Fail if rustfmt changed files
        shell: bash
        run: |
          if [ "${RUSTFMT_CHANGED:-0}" = "1" ]; then
            exit 1
          fi

      - name: Build release
        working-directory: learn/es/rust/app
        run: cargo build --release

      - name: Smoke create and verify
        working-directory: learn/es/rust/app
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/source/docs"
          printf 'hola rust\n' > "$work/source/hello.txt"
          printf 'backup verificable\n' > "$work/source/docs/readme.txt"
          cargo run --quiet -- create "$work/source" "$work/backup"
          cargo run --quiet -- verify "$work/backup"
