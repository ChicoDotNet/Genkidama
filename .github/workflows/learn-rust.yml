name: Learn Rust

on:
  pull_request:
    paths:
      - 'learn/es/rust/**'
      - '.github/workflows/learn-rust.yml'
  push:
    branches:
      - main
    paths:
      - 'learn/es/rust/**'
      - '.github/workflows/learn-rust.yml'

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable 1.97.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Show Rust version
        working-directory: learn/es/rust/app
        run: rustc --version && cargo --version

      - name: Format
        working-directory: learn/es/rust/app
        run: cargo fmt --check

      - name: Clippy
        working-directory: learn/es/rust/app
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        working-directory: learn/es/rust/app
        run: cargo test

      - name: Build release
        working-directory: learn/es/rust/app
        run: cargo build --release

      - name: Smoke create and verify
        working-directory: learn/es/rust/app
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/source/docs"
          printf 'hola rust\n' > "$work/source/hello.txt"
          printf 'backup verificable\n' > "$work/source/docs/readme.txt"
          cargo run --quiet -- create "$work/source" "$work/backup"
          cargo run --quiet -- verify "$work/backup"
