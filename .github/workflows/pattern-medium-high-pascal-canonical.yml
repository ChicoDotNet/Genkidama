name: Pattern Medium-High Pascal Canonical

on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/Systems/Pascal/*_pattern.pas'
      - 'src/Systems/Pascal/pattern_sweep.pas'
      - '.github/workflows/pattern-medium-high-pascal-canonical.yml'

jobs:
  pascal-canonical:
    name: Free Pascal — 39 canonical cells
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Install distro-stable Free Pascal
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fp-compiler
          fpc -iV
      - run: echo "SETUP_END=$(date +%s)" >> "$GITHUB_ENV"
      - name: Compile and execute all canonical Pascal cells
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          mkdir -p "$work/bin" "$work/units"
          test "$(find src/Systems/Pascal -maxdepth 1 -type f -name '*_pattern.pas' | wc -l)" -eq 39
          fpc -O2 -S2 -vw -FE"$work/bin" -FU"$work/units" src/Systems/Pascal/pattern_sweep.pas
          test "$("$work/bin/pattern_sweep" | tail -n 1)" = 'Pascal pattern sweep: 39/39 examples passed'
      - name: Timing summary
        if: always()
        shell: bash
        run: |
          now="$(date +%s)"; setup="$((SETUP_END-JOB_START))"; total="$((now-JOB_START))"; validation="$((total-setup))"
          printf '### Pascal canonical\n\n- cells: 39\n- setup_seconds: %s\n- validation_seconds: %s\n- total_seconds: %s\n' "$setup" "$validation" "$total" >> "$GITHUB_STEP_SUMMARY"
