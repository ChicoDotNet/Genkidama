name: Pattern Prototype Portable

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/pattern-prototype-portable.yml'
      - 'src/Enterprise/C#/PrototypeExample.cs'
      - 'src/Web/TypeScriptTS/prototype.ts'
      - 'src/Scripting/PythonPY/prototype.py'
      - 'src/Systems/C++/prototype.cpp'
      - 'src/Enterprise/Java/PrototypeExample.java'
      - 'src/Systems/Rust/prototype.rs'
      - 'src/Systems/Go/prototype.go'
      - 'src/Scripting/PHP/prototype.php'
      - 'src/Enterprise/Kotlin/PrototypeExample.kt'
      - 'src/Systems/Swift/prototype.swift'
      - 'src/Functional/F#/prototype.fsx'
      - 'src/Web/JavaScriptJS/prototype.js'
      - 'src/Enterprise/VisualBasic/PrototypeExample.vb'
      - 'src/Systems/C/prototype.c'
      - 'src/Scripting/RubyRB/prototype.rb'
      - 'src/Scripting/Lua/prototype.lua'
      - 'src/Shell/Bash/prototype.sh'
      - 'src/Shell/PowerShell/prototype.ps1'
      - 'src/Functional/Haskell/Prototype.hs'
      - 'src/Functional/Scala/Prototype.scala'
      - 'src/Scripting/Perl/prototype.pl'
      - 'src/Historical/Pascal/prototype.pas'
      - 'wiki/Prototype.md'

jobs:
  validate-mainstream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup PHP
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y php-cli

      - name: Validate Prototype mainstream tranche
        shell: bash
        run: |
          set -euo pipefail

          assert_output() {
            local output="$1"
            grep -Fq 'original=orders: metrics' <<<"$output"
            grep -Fq 'clone=orders-canary: metrics,tracing' <<<"$output"
            if grep -Fq 'original=orders: metrics,tracing' <<<"$output"; then
              echo 'Prototype clone shares mutable feature state with the original.' >&2
              exit 1
            fi
          }

          work="$(mktemp -d)"

          dotnet new console --framework net10.0 --output "$work/csharp" --force >/dev/null
          cp 'src/Enterprise/C#/PrototypeExample.cs' "$work/csharp/Program.cs"
          assert_output "$(dotnet run --project "$work/csharp" --configuration Release)"

          python -m py_compile src/Scripting/PythonPY/prototype.py
          assert_output "$(python src/Scripting/PythonPY/prototype.py)"

          node --check src/Web/JavaScriptJS/prototype.js
          assert_output "$(node src/Web/JavaScriptJS/prototype.js)"

          test -z "$(gofmt -d src/Systems/Go/prototype.go)"
          go vet src/Systems/Go/prototype.go
          assert_output "$(go run src/Systems/Go/prototype.go)"

          npx --yes --package typescript@6.0.3 tsc src/Web/TypeScriptTS/prototype.ts --strict --target ES2024 --module commonjs --outDir "$work/typescript"
          assert_output "$(node "$work/typescript/prototype.js")"

          javac -Xlint:all -Werror -d "$work/java" src/Enterprise/Java/PrototypeExample.java
          assert_output "$(java -cp "$work/java" PrototypeExample)"

          rustfmt --check src/Systems/Rust/prototype.rs
          rustc -D warnings src/Systems/Rust/prototype.rs -o "$work/prototype-rust"
          assert_output "$("$work/prototype-rust")"

          g++ -std=c++20 -Wall -Wextra -Werror 'src/Systems/C++/prototype.cpp' -o "$work/prototype-cpp"
          assert_output "$("$work/prototype-cpp")"

          php -l src/Scripting/PHP/prototype.php >/dev/null
          assert_output "$(php src/Scripting/PHP/prototype.php)"

          command -v kotlinc >/dev/null
          kotlinc src/Enterprise/Kotlin/PrototypeExample.kt -include-runtime -d "$work/prototype-kotlin.jar"
          assert_output "$(java -jar "$work/prototype-kotlin.jar")"

          command -v swiftc >/dev/null
          swiftc src/Systems/Swift/prototype.swift -o "$work/prototype-swift"
          assert_output "$("$work/prototype-swift")"

          assert_output "$(dotnet fsi 'src/Functional/F#/prototype.fsx')"

  validate-portable:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup portable runtimes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y lua5.4 ghc scala fp-compiler

      - name: Validate Prototype portable tranche
        shell: bash
        run: |
          set -euo pipefail

          assert_output() {
            local output="$1"
            grep -Fq 'original=orders: metrics' <<<"$output"
            grep -Fq 'clone=orders-canary: metrics,tracing' <<<"$output"
            if grep -Fq 'original=orders: metrics,tracing' <<<"$output"; then
              echo 'Prototype clone shares mutable feature state with the original.' >&2
              exit 1
            fi
          }

          work="$(mktemp -d)"

          dotnet new console --language VB --framework net10.0 --output "$work/vb" --force >/dev/null
          cp src/Enterprise/VisualBasic/PrototypeExample.vb "$work/vb/Program.vb"
          assert_output "$(dotnet run --project "$work/vb" --configuration Release)"

          gcc -std=c17 -Wall -Wextra -Werror src/Systems/C/prototype.c -o "$work/prototype-c"
          assert_output "$("$work/prototype-c")"

          ruby -cw src/Scripting/RubyRB/prototype.rb
          assert_output "$(ruby src/Scripting/RubyRB/prototype.rb)"

          assert_output "$(lua5.4 src/Scripting/Lua/prototype.lua)"

          bash -n src/Shell/Bash/prototype.sh
          assert_output "$(bash src/Shell/Bash/prototype.sh)"

          assert_output "$(pwsh -NoLogo -NoProfile -NonInteractive -File src/Shell/PowerShell/prototype.ps1)"

          assert_output "$(runghc -Wall -Werror src/Functional/Haskell/Prototype.hs)"

          scala_out="$(mktemp -d)"
          scalac -deprecation -feature -unchecked src/Functional/Scala/Prototype.scala -d "$scala_out"
          assert_output "$(scala -cp "$scala_out" Prototype)"

          perl -c src/Scripting/Perl/prototype.pl
          assert_output "$(perl src/Scripting/Perl/prototype.pl)"

          pascal_out="$(mktemp -d)"
          fpc -Mobjfpc -O2 -Sew -FE"$pascal_out" src/Historical/Pascal/prototype.pas >/dev/null
          assert_output "$("$pascal_out/prototype")"
