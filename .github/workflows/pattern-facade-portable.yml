name: Pattern Facade Portable

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/pattern-facade-portable.yml'
      - 'src/Niche/Solidity/Facade.sol'
      - 'src/Historical/Fortran/facade.f90'
      - 'src/Systems/Zig/facade.zig'
      - 'src/Systems/Objective-C/facade.m'
      - 'src/Niche/Nim/facade.nim'
      - 'src/Web/Dart/facade.dart'

jobs:
  solidity-fortran-zig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.15.2'
      - name: Install Solidity compiler
        shell: bash
        run: npm install --global solc
      - name: Validate Solidity, Fortran and Zig Facade
        shell: bash
        run: |
          set -euo pipefail
          expected='checkout=auth(alice)>reserve(SKU-42)>charge(499)'
          assert_output() {
            local label="$1"
            local output="$2"
            if [[ "$output" != "$expected" ]]; then
              printf '%s output mismatch\nexpected: %s\nactual:   %s\n' "$label" "$expected" "$output" >&2
              exit 1
            fi
          }

          work="$(mktemp -d)"

          solcjs --bin --abi src/Niche/Solidity/Facade.sol -o "$work/solidity"
          test "$(find "$work/solidity" -maxdepth 1 -name '*CheckoutFacade.bin' -size +0c | wc -l)" -eq 1
          test "$(find "$work/solidity" -maxdepth 1 -name '*CheckoutFacade.abi' -size +0c | wc -l)" -eq 1

          gfortran -std=f2018 -Wall -Wextra -Werror src/Historical/Fortran/facade.f90 -o "$work/facade-fortran"
          assert_output 'Fortran' "$("$work/facade-fortran")"

          zig fmt --check src/Systems/Zig/facade.zig
          zig build-exe src/Systems/Zig/facade.zig -O ReleaseSafe -femit-bin="$work/facade-zig"
          assert_output 'Zig' "$("$work/facade-zig")"

  nim-dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - name: Install Nim
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y nim
      - name: Validate Nim and Dart Facade
        shell: bash
        run: |
          set -euo pipefail
          expected='checkout=auth(alice)>reserve(SKU-42)>charge(499)'
          work="$(mktemp -d)"

          nim c --hints:off --warnings:on -o:"$work/facade-nim" src/Niche/Nim/facade.nim
          test "$("$work/facade-nim")" = "$expected"

          dart format --output=none --set-exit-if-changed src/Web/Dart/facade.dart
          dart analyze --fatal-infos --fatal-warnings src/Web/Dart/facade.dart
          test "$(dart run src/Web/Dart/facade.dart)" = "$expected"

  objective-c:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Objective-C Facade
        shell: bash
        run: |
          set -euo pipefail
          expected='checkout=auth(alice)>reserve(SKU-42)>charge(499)'
          clang -fobjc-arc -Wall -Wextra -Werror -framework Foundation src/Systems/Objective-C/facade.m -o /tmp/facade-objective-c
          test "$(/tmp/facade-objective-c)" = "$expected"
